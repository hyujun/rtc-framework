# Codecov 설정 — rtc-framework
# https://docs.codecov.io/docs/codecov-yaml
#
# Single source of truth for coverage targets:
#   - 빌드/테스트 패키지 목록: .github/ci-packages.yml
#   - lcov 추출 경로: ci-packages.yml 의 coverage_paths field
#
# 2026-05-31: C++ coverage upload 복원 (coverage-cpp job, cpp flag).
#   colcon test 의 ModuleNotFoundError root cause 는 colcon-test-report action 의
#   PYTHONPATH 보강으로 해결됨. 활성 flag: python (rtc_tools, rtc_digital_twin)
#   + cpp (test_cpp 패키지, ci-packages.yml SSoT).
#   flag paths / component paths 는 ci-packages.yml 의 coverage_paths 와 정합 유지.

codecov:
  require_ci_to_pass: false   # coverage 업로드는 CI 실패와 독립적으로 처리
  notify:
    wait_for_ci: true

github_checks:
  annotations: true           # PR diff 라인에 인라인 coverage annotation

coverage:
  precision: 2
  round: down
  range: "0...100"

  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        if_ci_failed: success
        informational: false
      # RT-critical 패키지 회귀 감시 — RT path 코드의 커버리지 하락을 별도 추적
      rt_core:
        target: auto
        threshold: 1%
        if_ci_failed: success
        flags:
          - cpp
        paths:
          - "rtc_base/"
          - "rtc_controllers/"
          - "rtc_tsid/"
          - "rtc_controller_manager/"
    patch:
      default:
        # #148 Phase 2: 측정 실측화(#144, #146) 후 신규/변경 라인 기준 상향.
        # threshold 3% → 실질 하한 67%.
        target: 70%
        threshold: 3%
        if_ci_failed: success

# 활성 flag (ci-packages.yml 의 test_cpp / test_python 과 정합).
flags:
  python:
    paths:
      - rtc_tools/
      - rtc_digital_twin/
    carryforward: true
    carryforward_mode: "labels"
  cpp:
    paths:
      - rtc_base/
      - rtc_math/
      - rtc_communication/
      - rtc_controller_interface/
      - rtc_controller_manager/
      - rtc_controllers/
      - rtc_inference/
      - rtc_tsid/
      - rtc_urdf_bridge/
      - integrated_bringup/
      - ur5e_bt_coordinator/
      - udp_hand_driver/
      - shape_estimation/
    carryforward: true
    carryforward_mode: "labels"

# Per-package 커버리지 가시성 (PR 코멘트 components 섹션).
component_management:
  individual_components:
    - component_id: base
      name: rtc_base
      paths: ["rtc_base/"]
    - component_id: math
      name: rtc_math
      paths: ["rtc_math/"]
    - component_id: communication
      name: rtc_communication
      paths: ["rtc_communication/"]
    - component_id: controller_interface
      name: rtc_controller_interface
      paths: ["rtc_controller_interface/"]
    - component_id: controller_manager
      name: rtc_controller_manager
      paths: ["rtc_controller_manager/"]
    - component_id: controllers
      name: rtc_controllers
      paths: ["rtc_controllers/"]
    - component_id: inference
      name: rtc_inference
      paths: ["rtc_inference/"]
    - component_id: tsid
      name: rtc_tsid
      paths: ["rtc_tsid/"]
    - component_id: urdf_bridge
      name: rtc_urdf_bridge
      paths: ["rtc_urdf_bridge/"]
    - component_id: shape_estimation
      name: shape_estimation
      paths: ["shape_estimation/"]
    - component_id: hand_driver
      name: udp_hand_driver
      paths: ["udp_hand_driver/"]
    - component_id: bt_coordinator
      name: ur5e_bt_coordinator
      paths: ["ur5e_bt_coordinator/"]
    - component_id: bringup
      name: integrated_bringup
      paths: ["integrated_bringup/"]

# 커버리지에서 제외할 경로
ignore:
  - "robot_descriptions/**"          # 데이터/설정 전용
  - "rtc_mujoco_sim/**"              # MuJoCo (옵셔널)
  - "rtc_msgs/**"                    # rosidl 자동 생성
  - "shape_estimation_msgs/**"       # rosidl 자동 생성
  - "repo_scripts/**"                 # 셸 스크립트
  - "**/test/**"
  - "**/tests/**"
  - "**/launch/**"
  - "**/config/**"
  - "**/examples/**"
  - "**/build/**"
  - "**/install/**"
  - "**/log/**"

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  show_carryforward_flags: true
