# Single source of truth for CI package selection.
#
# 변경 시 함께 갱신:
#   - agent_docs/architecture.md (패키지 표)
#   - repo_scripts/scripts/build_deps.sh (외부 deps 추가 시 deps.repos 도)
#
# 카테고리 의미:
#   build       : `colcon build --packages-up-to <build>` 의 입력. 의존성으로
#                 rtc_msgs / rtc_base / rtc_mpc 등이 자동 포함됨.
#   test_cpp_gated      : `colcon test` GATE — CI 실측 통과 패키지. 실패 시 PR red.
#   test_cpp_besteffort : CI-fragile (perf/타이밍·mimalloc grasp) — coverage 만 수집,
#                 continue-on-error (실패해도 PR 차단 안 함). loader 가 둘을 union 하여
#                 빌드/커버리지 대상 test_cpp 를 유도한다.
#   test_python : ament_python 패키지 (별도 pytest job)
#   lint_cpp    : cppcheck 대상 — include/ 또는 src/ 가 있는 C++ 패키지
#
# 누락된 패키지 (의도적):
#   rtc_mujoco_sim       : MuJoCo 미설치 (D-2)
#   rtc_mpc              : integrated_bringup transitive 로만 build (직접 test X)
#   robot_descriptions   : URDF/MJCF 데이터만
#   rtc_msgs / shape_estimation_msgs : msg 정의만 (lint_cpp 의 ament_cppcheck 가
#                                       include/src 부재 시 자동 skip)
#   repo_scripts / rtc_tools / rtc_digital_twin : C++ 빌드 대상 아님

build:
  - rtc_controller_manager
  - rtc_controllers
  - rtc_tsid
  - integrated_bringup
  - ur5e_bt_coordinator
  - udp_hand_driver
  - rtc_urdf_bridge
  - shape_estimation

# gtest 보유 패키지 — 두 tier 로 분리 (2026-06-03, CI 실측 기반):
#   gated 로 승격하기 전 반드시 CI 환경 실측 통과를 확인한다 (로컬 green ≠ CI green).
#   loader: test_cpp = test_cpp_gated + test_cpp_besteffort (union) → 빌드/커버리지 입력.
test_cpp_gated:
  - rtc_base
  - rtc_math
  - rtc_communication
  - rtc_controller_interface
  - rtc_controller_manager
  - rtc_controllers
  - rtc_urdf_bridge
  - shape_estimation
  - ur5e_bt_coordinator
  - udp_hand_driver

test_cpp_besteffort:
  # rtc_tsid           : TSIDPerformanceTest.*SolveTime — CI 러너에서 solve-time 초과로 실패
  # integrated_bringup : GraspPipelineTest — contact_rich/mimalloc grasp (10~20s) CI-fragile
  # rtc_inference      : STAGING (2026-07-12) — test_inference_engine (fixture-free 순수 로직:
  #                      base-class 위임 / pre-Init guard / batch 첫 실패 중단 / zero-count) 은
  #                      기존에 어느 test 목록에도 없어 CI 미실행 → 분모 0% drag 였다. 우선
  #                      besteffort 로 CI 실측을 확인한 뒤 안정적이면 test_cpp_gated 로 승격한다.
  - rtc_tsid
  - integrated_bringup
  - rtc_inference

test_python:
  - rtc_tools
  - rtc_digital_twin

lint_cpp:
  - rtc_base
  - rtc_math
  - rtc_communication
  - rtc_controller_interface
  - rtc_controller_manager
  - rtc_controllers
  - rtc_inference
  - rtc_msgs
  - rtc_tsid
  - rtc_urdf_bridge
  - shape_estimation
  - integrated_bringup
  - ur5e_bt_coordinator
  - udp_hand_driver

# Coverage extraction patterns (lcov --extract globs).
# test_cpp_gated + test_cpp_besteffort union 과 일치해야 한다. 패키지별 실제 레이아웃
# 에 맞춰 include/ · src/ 를 hand-tune (예: rtc_base 는 header-only → include 만,
# rtc_controller_manager 는 src 만) — 자동 유도 안 함 (분모가 바뀌므로).
coverage_paths:
  - "*/rtc_base/include/*"
  - "*/rtc_math/include/*"
  - "*/rtc_communication/include/*"
  - "*/rtc_controller_interface/include/*"
  - "*/rtc_controller_interface/src/*"
  - "*/rtc_controller_manager/src/*"
  - "*/rtc_controllers/include/*"
  - "*/rtc_controllers/src/*"
  - "*/rtc_inference/include/*"
  - "*/rtc_tsid/include/*"
  - "*/rtc_tsid/src/*"
  - "*/rtc_urdf_bridge/include/*"
  - "*/rtc_urdf_bridge/src/*"
  - "*/integrated_bringup/include/*"
  - "*/integrated_bringup/src/*"
  - "*/ur5e_bt_coordinator/include/*"
  - "*/ur5e_bt_coordinator/src/*"
  - "*/udp_hand_driver/include/*"
  - "*/udp_hand_driver/src/*"
  - "*/shape_estimation/include/*"
  - "*/shape_estimation/src/*"
