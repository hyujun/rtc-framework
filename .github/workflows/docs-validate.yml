# Documentation-corpus gate (issue #213).
#
# Deliberately a separate workflow rather than a job inside ros2-advanced-ci:
# that workflow's `paths-ignore` drops `docs/**`, `agent_docs/**` and root
# `*.md`, so a docs-only pull request never starts it. A validation job living
# there could not run on the changes it exists to validate.
#
# Scope here is the whole corpus. The Stop hook runs the same script over the
# *changed* files only -- an agent must not be blocked by a defect in a file it
# never touched, least of all one it cannot see.
#
# It is also where every other cheap whole-repo gate lives -- the ones that need
# no ROS and must run on each pull request whatever paths it touched: thread
# layout, the hook's routing suite, the shell corpus and repo_scripts' own tests.
name: Docs Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ros2-advanced-ci.yml 은 push 런이 서로 취소되지 않도록 SHA 를 그룹 키에 넣었지만
# (#506), 여기는 ref 단위 취소를 그대로 둔다: 위에 적힌 대로 이 잡의 범위는 변경
# diff 가 아니라 **전체 코퍼스**라, 취소된 런이 검사했을 파일을 다음 런이 남김없이
# 다시 본다. 저쪽이 잃는 것(직전 커밋 diff 에만 걸린 C++ 게이트)이 여기엔 없다.
concurrency:
  group: docs-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The routing suite's YAML-parse case needs PyYAML importable. The hook
      # itself fails OPEN without it (a missing tool must not wedge a turn), so
      # a job without PyYAML would silently skip that gate and leave it untested
      # here -- the one place it is supposed to be exercised.
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml

      # The checker's own fixtures run first and gate the corpus scan. A
      # detector for silent failures that is merely green on this repository
      # has proven nothing; it has to be green on inputs whose answer is known
      # -- including the malformed-grep forms that a previous version of this
      # script graded as healthy.
      - name: Validator self-test
        run: python3 repo_scripts/scripts/validate_docs.py --self-test

      - name: Validate documentation corpus
        run: python3 repo_scripts/scripts/validate_docs.py

      # The Stop hook is a stack of filters, and its failure mode is one layer
      # silently cancelling a fix made in another. These assert the observable
      # behaviour -- given this input, does the warning actually come out --
      # rather than each layer in isolation, which is how the last regression
      # got through.
      - name: verify-changes.sh routing
        run: bash repo_scripts/test/test_verify_changes.sh

      # ── Thread layout manifest (issue #153 M1) ───────────────────────────
      # The C++ artifact is emitted through clang-format so the checked-in file
      # matches what the repo's format hook would produce. Without the tool the
      # generator *skips* that artifact rather than reporting a false STALE --
      # which would make this job quietly stop gating the header it exists to
      # gate. Installing it keeps all five artifacts in scope here.
      # apt-get update first: runner images ship with a pruned
      # /var/lib/apt/lists, where a bare install dies with "Unable to locate
      # package" and takes this whole job down with it. .github/actions/
      # setup-rtc-env does the same for the same reason. shellcheck is for the
      # shell-corpus step further down.
      - name: Install clang-format + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format shellcheck

      # Fails when any generated artifact (C++ tier constants, shell helpers,
      # Python launch mirror, the two README tables) is stale or hand-edited.
      # This is the cross-language drift gate that replaced six hand-maintained
      # copies of the tier table.
      - name: Thread layout artifacts in sync
        run: python3 repo_scripts/scripts/gen_thread_layout.py --check

      # The generator's own invariants -- emitters are formatter-stable, and the
      # layout keeps its structural rules (worker <= main, mpc < rt_callback, no
      # RT slot collisions) on every tier.
      - name: Thread layout generator self-test
        run: python3 repo_scripts/scripts/gen_thread_layout.py --self-test

      # Semantic equivalence: manifest vs *executed* shell helpers vs the
      # imported Python mirror for ncpu 1..17 and 24. --check only proves the
      # files are fresh; this proves they mean the same thing.
      - name: Thread layout cross-language equivalence
        run: python3 repo_scripts/test/test_thread_layout_equivalence.py

      # ── Shell corpus + repo_scripts sensors ──────────────────────────────
      # repo_scripts is not in .github/ci-packages.yml, so ros2-advanced-ci never
      # runs its colcon tests, and the Stop hook runs them only when repo_scripts
      # itself changed. Two things fell through that gap: validate_test_domains
      # reads *other* packages' CMakeLists, so two integrated_bringup tests that
      # opened DDS without a ROS_DOMAIN_ID reached main (fixed in #513), and the
      # shell regression tests were local-only. None of them needs ROS.

      # The Stop hook lints every changed .sh as a whole file rather than just the
      # added lines, because shellcheck reports a finding where the symptom is,
      # not where the cause is (an `expected` declared -A in one test surfaced as
      # SC2178 on an untouched helper). That scope is only fair while no file
      # carries a warning into a turn -- before this step, that very pre-existing
      # false positive blocked an unrelated edit to test_rt_common.sh. Same file
      # set and severity as the hook; each script finds the repo .shellcheckrc by
      # walking up. The version is printed because a runner-image bump can change
      # the rule set under both.
      - name: shellcheck (whole shell corpus)
        run: |
          shellcheck --version | head -2
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning -f gcc

      # Globbed, not listed, so a new test/test_*.sh is gated from its first PR.
      # They stub what they would touch on the host -- sudo/apt/dpkg, uv, the
      # cset mask reader, a sysfs CPU tree -- so they need neither ROS nor root.
      # test_verify_changes.sh already ran above.
      - name: repo_scripts shell tests
        run: |
          fail=0
          for t in repo_scripts/test/test_*.sh; do
            [ "$t" = repo_scripts/test/test_verify_changes.sh ] && continue
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          exit "$fail"

      # Cross-package validators: their input is every package's CMakeLists and
      # test sources, so they belong where the whole repo is in scope. Self-test
      # first, as with validate_docs above.
      - name: Test DDS domain allocation
        run: |
          python3 repo_scripts/scripts/validate_test_domains.py --self-test
          python3 repo_scripts/scripts/validate_test_domains.py

      - name: Test fixture package resolution
        run: |
          python3 repo_scripts/scripts/validate_test_fixtures.py --self-test
          python3 repo_scripts/scripts/validate_test_fixtures.py
