name: CodeQL Security Scan

# 분리 배경 (2026-04-28):
#   PR/푸시마다 CodeQL instrumentation 빌드 (~30-60 min) 를 돌릴 가치 낮음.
#   weekly cron + manual dispatch 로 격하, query suite 도 보안 only 로 축소.
#
# 단순화:
#   - trigger: weekly + workflow_dispatch (push/PR 미참여)
#   - queries: default (security only) — 기존 security-and-quality 의 quality 제거
#   - parallel-workers / ccache / swap / 별도 colcon cache 제거 — 기본값 사용
#
# Two-job 구조 (2026-07-18, #179):
#   이전엔 단일 analyze job 이 `Initialize CodeQL`(트레이싱 ON) 이후에 aligator
#   0.19.0 콜드 빌드를 수행 → 헤비 pinocchio TU 가 트레이싱 오버헤드 하에서 메모리
#   고갈, SIGTERM(143) 으로 매 weekly run 이 죽고 codeql 캐시가 영영 안 채워지는
#   무한 루프였다. 메인 CI 처럼 deps 빌드를 트레이싱 밖 별도 job 으로 분리한다:
#     - build-deps job: CodeQL init 없음 → aligator 비추적 빌드 (메인 CI 와 동일 구조).
#       cache-version=v1 을 메인 CI 와 공유 → 대개 cache hit 으로 콜드 빌드 자체를 skip.
#     - analyze job: needs build-deps → deps artifact download → CodeQL init → rtc
#       패키지만 빌드/분석. 트레이싱 경로에서 aligator 콜드 빌드를 완전히 제거.

on:
  schedule:
    # 매주 일요일 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: jazzy
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  #  Build isolated deps — fmt 11 / mimalloc / aligator
  #  CodeQL init 이 없는 별도 job → aligator 콜드 빌드가 트레이싱되지 않는다 (#179).
  #  cache-version=v1 은 메인 CI (ros2-advanced-ci.yml) 와 공유 → 대개 cache hit.
  # ============================================================
  build-deps:
    name: Build Isolated Deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: deps-v1
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            ros-jazzy-proxsuite
            libeigen3-dev

      - name: Build & cache deps
        uses: ./.github/actions/build-isolated-deps
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          cache-version: v1

  analyze:
    name: Analyze (cpp)
    needs: build-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Load build package list
        id: pkgs
        run: |
          set -eo pipefail
          BUILD=$(yq -r '.build | join(" ")' .github/ci-packages.yml)
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          # queries 미지정 → v4 기본 default suite (security only) 사용.
          # v3까지는 `queries: default` 약어가 동작했으나 v4에서는 query pack 이름으로
          # 해석되어 "Query pack default cannot be found" fatal error 발생 (2026-05-03).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: codeql-v2
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-tinyxml2-vendor
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      # deps 는 build-deps job 이 비추적으로 빌드해 올린 artifact 를 그대로 받는다.
      # (메인 CI gated-test / coverage-cpp 와 동일 패턴 — aligator 를 CodeQL 트레이싱
      # 경로에서 완전히 제거하는 것이 #179 correctness 조건.)
      - name: Download deps artifact
        uses: actions/download-artifact@v8
        with:
          name: rtc-deps-${{ env.ROS_DISTRO }}
          path: _rtc_ws/deps/install

      # 리소스 계측 (#179 진단): rtc_* 패키지를 CodeQL 트레이싱 하에 빌드할 때 러너가
      # SIGTERM(143) 으로 죽는데 컴파일러 alloc 에러가 안 남아 VM-레벨 kill 로 보인다.
      # 실측이 없어 한계를 모르므로, 빌드 내내 free/df 를 백그라운드로 샘플해 peak 메모리
      # /디스크를 남긴다. setsid 로 step 종료 후에도 살려 Build 스텝과 겹쳐 돌게 하고,
      # 종료 스텝에서 로그를 덤프한다 (VM 이 통째로 죽으면 유실될 수 있으나 best-effort).
      - name: Start resource monitor
        shell: bash
        run: |
          echo "=== baseline ==="; nproc; free -h; df -h /
          setsid bash -c '
            while true; do
              printf "[MON %s] " "$(date +%T)"
              free -m | awk "/Mem:/{printf \"mem_used=%sM avail=%sM \", \$3, \$7}"
              df -m / | awk "NR==2{printf \"disk_avail=%sM\n\", \$4}"
              sleep 8
            done' > "${GITHUB_WORKSPACE}/mem-monitor.log" 2>&1 &
          echo "$!" > "${GITHUB_WORKSPACE}/mem-monitor.pid"

      # parallel-workers=1 로 완전 직렬화: rtc_mpc / rtc_tsid / rtc_controllers 는
      # pinocchio·aligator 헤비 템플릿 TU 라, CodeQL 트레이싱(추출기 + 컴파일러 +
      # in-memory DB) 오버헤드가 얹히면 nproc(11분)·2-worker(7분) 모두 16GB 러너를
      # 소진해 SIGTERM(143) 으로 죽는다 (#179 — deps OOM 제거 후 드러난 2차 OOM).
      # 동시 헤비 TU 를 1개로 묶어 peak RSS 를 러너 한도 안에 확실히 수렴시킨다
      # (트레이싱 없는 메인 CI 는 nproc 로 통과하므로 이 직렬화는 CodeQL 경로 전용).
      - name: Build packages
        uses: ./.github/actions/colcon-build
        with:
          packages: ${{ steps.pkgs.outputs.build }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          build-type: Release
          enable-testing: "false"
          parallel-workers: "1"
          artifact-suffix: codeql-build

      - name: Dump resource monitor (peak)
        if: always()
        shell: bash
        run: |
          [ -f "${GITHUB_WORKSPACE}/mem-monitor.pid" ] && kill "$(cat "${GITHUB_WORKSPACE}/mem-monitor.pid")" 2>/dev/null || true
          if [ -f "${GITHUB_WORKSPACE}/mem-monitor.log" ]; then
            echo "=== resource timeline (tail 40) ==="; tail -40 "${GITHUB_WORKSPACE}/mem-monitor.log"
            echo "=== min available memory (M) ==="
            awk 'match($0,/avail=([0-9]+)M /,m){print m[1]}' "${GITHUB_WORKSPACE}/mem-monitor.log" | sort -n | head -1
            echo "=== min available disk (M) ==="
            awk 'match($0,/disk_avail=([0-9]+)M/,m){print m[1]}' "${GITHUB_WORKSPACE}/mem-monitor.log" | sort -n | head -1
          else
            echo "no monitor log (runner may have been terminated before flush)"
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
