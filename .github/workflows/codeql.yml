name: CodeQL Security Scan

# 분리 배경 (2026-04-28):
#   PR/푸시마다 CodeQL instrumentation 빌드 (~30-60 min) 를 돌릴 가치 낮음.
#   weekly cron + manual dispatch 로 격하, query suite 도 보안 only 로 축소.
#
# 단순화:
#   - trigger: weekly + workflow_dispatch (push/PR 미참여)
#   - queries: default (security only) — 기존 security-and-quality 의 quality 제거
#   - parallel-workers / ccache / swap / 별도 colcon cache 제거 — 기본값 사용
#
# Two-job 구조 (2026-07-18, #179):
#   이전엔 단일 analyze job 이 `Initialize CodeQL`(트레이싱 ON) 이후에 aligator
#   0.19.0 콜드 빌드를 수행 → 헤비 pinocchio TU 가 트레이싱 오버헤드 하에서 메모리
#   고갈, SIGTERM(143) 으로 매 weekly run 이 죽고 codeql 캐시가 영영 안 채워지는
#   무한 루프였다. 메인 CI 처럼 deps 빌드를 트레이싱 밖 별도 job 으로 분리한다:
#     - build-deps job: CodeQL init 없음 → aligator 비추적 빌드 (메인 CI 와 동일 구조).
#       cache-version=v1 을 메인 CI 와 공유 → 대개 cache hit 으로 콜드 빌드 자체를 skip.
#     - analyze job: needs build-deps → deps artifact download → CodeQL init → rtc
#       패키지만 빌드/분석. 트레이싱 경로에서 aligator 콜드 빌드를 완전히 제거.

on:
  schedule:
    # 매주 일요일 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: jazzy
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  #  Build isolated deps — fmt 11 / mimalloc / aligator
  #  CodeQL init 이 없는 별도 job → aligator 콜드 빌드가 트레이싱되지 않는다 (#179).
  #  cache-version=v1 은 메인 CI (ros2-advanced-ci.yml) 와 공유 → 대개 cache hit.
  # ============================================================
  build-deps:
    name: Build Isolated Deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: deps-v1
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            ros-jazzy-proxsuite
            libeigen3-dev

      - name: Build & cache deps
        uses: ./.github/actions/build-isolated-deps
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          cache-version: v1

  analyze:
    name: Analyze (cpp)
    needs: build-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Load build package list
        id: pkgs
        run: |
          set -eo pipefail
          BUILD=$(yq -r '.build | join(" ")' .github/ci-packages.yml)
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          # queries 미지정 → v4 기본 default suite (security only) 사용.
          # v3까지는 `queries: default` 약어가 동작했으나 v4에서는 query pack 이름으로
          # 해석되어 "Query pack default cannot be found" fatal error 발생 (2026-05-03).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: codeql-v2
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-tinyxml2-vendor
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      # deps 는 build-deps job 이 비추적으로 빌드해 올린 artifact 를 그대로 받는다.
      # (메인 CI gated-test / coverage-cpp 와 동일 패턴 — aligator 를 CodeQL 트레이싱
      # 경로에서 완전히 제거하는 것이 #179 correctness 조건.)
      - name: Download deps artifact
        uses: actions/download-artifact@v8
        with:
          name: rtc-deps-${{ env.ROS_DISTRO }}
          path: _rtc_ws/deps/install

      # ── DIAGNOSTIC (#179): 인라인 계측 빌드 ──────────────────────────────
      # parallel-workers=1(패키지 직렬) 로도 단일 pinocchio-헤비 패키지(rtc_urdf_bridge)
      # 가 CodeQL 트레이싱 하에 SIGTERM(143) 으로 죽었다 → 패키지-레벨 parallelism 은
      # 원인이 아니다. 남은 변수: (a) 패키지 내부 컴파일러 parallelism(-j, Ninja 면
      # nproc), (b) 실제 병목이 memory 인지 disk 인지 tracer hang 인지 미측정.
      # 이 스텝은 (1) monitor 를 Build 와 같은 스텝에서 stdout 으로 스트림(VM 이 죽어도
      # live 로그에 남음), (2) CMAKE_BUILD_PARALLEL_LEVEL=1 + MAKEFLAGS=-j1 로 컴파일러
      # 를 완전 직렬화 — 실패 모드를 확정하기 위한 임시 진단(composite action 대체).
      # 진단 후 원인이 확정되면 정식 수정으로 되돌린다.
      - name: Build packages (instrumented, serial)
        shell: bash
        env:
          BUILD_PKGS: ${{ steps.pkgs.outputs.build }}
          DEPS_INSTALL: ${{ github.workspace }}/_rtc_ws/deps/install
        run: |
          set -eo pipefail
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          export CMAKE_PREFIX_PATH="${DEPS_INSTALL}:${CMAKE_PREFIX_PATH:-}"
          export LD_LIBRARY_PATH="${DEPS_INSTALL}/lib:${LD_LIBRARY_PATH:-}"
          # 컴파일러 전역 직렬화 (패키지 내부 make/ninja 병렬 차단)
          export CMAKE_BUILD_PARALLEL_LEVEL=1
          export MAKEFLAGS="-j1"

          echo "=== baseline ==="; nproc; free -h; df -h /
          # monitor 를 이 스텝 stdout 으로 스트림 → VM 종료돼도 마지막 샘플이 로그에 남음
          ( while true; do
              printf "[MON %s] " "$(date +%T)"
              free -m | awk '/Mem:/{printf "mem_used=%sM avail=%sM ", $3, $7}'
              df -m / | awk 'NR==2{printf "disk_avail=%sM\n", $4}'
              sleep 6
            done ) &
          MON=$!
          trap 'kill "$MON" 2>/dev/null || true' EXIT

          # shellcheck disable=SC2086
          colcon build \
            --packages-up-to ${BUILD_PKGS} \
            --parallel-workers 1 \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
