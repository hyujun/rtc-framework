name: ROS2 Advanced CI

# 전면 재작성: 2026-04-27 — 설계 근거는 그 시점의 커밋 메시지와 PR 논의에 있다
#            (당시 참조하던 계획 문서는 머지 후 삭제됐다).
# 핵심 변경:
#   - build-deps job: fmt 11 / mimalloc / aligator 사전 빌드 → cache + artifact
#     (이전 실패의 root cause 해결: rtc_mpc 의 find_package(fmt 10) 실패)
#   - claude-review job 제거 (D-1)
#   - 패키지 목록 SSoT: .github/ci-packages.yml
#   - composite actions 활용 (.github/actions/*)
#   - coverage upload 분리 (build 실패에 묶이지 않음)
#   - paths-ignore 에 agent_docs/** 추가
#   - codeql 분리: .github/workflows/codeql.yml (weekly + manual, 2026-04-28)

on:
  push:
    branches: [main]
    # repo_scripts/** 는 통째로 ignore 하지 않는다: repo_scripts/scripts/build_deps.sh
    # 는 cpp 필터(changes job)의 트리거 입력이므로 ignore 하면 워크플로 자체가 시작되지
    # 않아 필터가 死한다. build 무관한 repo_scripts 변경은 트리거되되 cpp/python 필터가
    # 모두 false → heavy job 은 skip(changes/packages 만, 수 초).
    paths-ignore:
      - 'docs/**'
      - 'agent_docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'agent_docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

# 동일 브랜치 중복 실행 방지 — 새 push 시 이전 실행 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙 — 전 job 은 read-only GITHUB_TOKEN 을 상속. Codecov 는 별도 secret
# (CODECOV_TOKEN) 을 쓰므로 token write 불요. write 가 필요한 job 은 job-level override.
permissions:
  contents: read

env:
  ROS_DISTRO: jazzy
  # ros-tooling/setup-ros@v0.7 (핀 649ef6b = 0.7.19, 현재 latest) 는 아직 Node 20 사용 — 강제 Node 24
  # 으로 호환성 유지. 2026-06-02 부터 GitHub Actions 가 Node 24 강제 전환.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  #  Path filter — 후속 job 실행 여부 결정
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # 잡 timeout 은 상한이 아니라 진단 도구다 — 하나라도 없으면 그 잡이 기본 6시간을
    # 잡고 run 을 열어둔 채 앉아 있고, run 이 in_progress 인 동안에는
    # `gh run rerun --job <id>` 이 거부되어 **게이트 잡의 개별 재실행 자체가 봉쇄**된다
    # (2026-08-07 run 31188282031 실측: apt 정체로 gated-test 가 cancelled 됐는데
    # timeout 없는 python-test 가 run 을 붙들어 재실행을 못 걸었다).
    timeout-minutes: 10
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            cpp:
              - '**/*.hpp'
              - '**/*.cpp'
              - '**/*.h'
              - '**/CMakeLists.txt'
              - '**/package.xml'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.xml'
              - '**/*.urdf'
              - '**/*.msg'
              - '**/*.srv'
              - '.github/actions/**'
              - '.github/ci-packages.yml'
              - 'deps.repos'
              - 'repo_scripts/scripts/build_deps.sh'
            python:
              - 'rtc_tools/**/*.py'
              - 'rtc_digital_twin/**/*.py'
              - 'rtc_tools/setup.py'
              - 'rtc_tools/setup.cfg'
              - 'rtc_digital_twin/setup.py'
              - 'rtc_digital_twin/setup.cfg'
              - 'rtc_msgs/msg/*.msg'
              - 'rtc_msgs/srv/*.srv'
              # 워크플로/composite action 변경도 python job 을 재실행해야 한다 —
              # 그러지 않으면 coverage 업로드 로직 수정이 python 경로에서 실증되지
              # 않고 skip 된다 (cpp 필터가 .github/ci-packages.yml·actions 를 포함하는 것과 대칭).
              - '.github/workflows/ros2-advanced-ci.yml'
              - '.github/actions/**'

  # ============================================================
  #  Package list loader — .github/ci-packages.yml 을 4개 output 으로 노출
  # ============================================================
  packages:
    name: Load Package Lists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.load.outputs.build }}
      test_cpp: ${{ steps.load.outputs.test_cpp }}
      test_cpp_gated: ${{ steps.load.outputs.test_cpp_gated }}
      test_cpp_besteffort: ${{ steps.load.outputs.test_cpp_besteffort }}
      test_python: ${{ steps.load.outputs.test_python }}
      lint_cpp: ${{ steps.load.outputs.lint_cpp }}
      coverage_paths: ${{ steps.load.outputs.coverage_paths }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse ci-packages.yml
        id: load
        run: |
          set -eo pipefail
          # ubuntu-24.04 image 는 yq 4.x preinstalled
          BUILD=$(yq -r '.build | join(" ")' .github/ci-packages.yml)
          TEST_CPP_GATED=$(yq -r '.test_cpp_gated | join(" ")' .github/ci-packages.yml)
          TEST_CPP_BESTEFFORT=$(yq -r '.test_cpp_besteffort | join(" ")' .github/ci-packages.yml)
          # test_cpp = gated + besteffort union — 빌드/커버리지 입력의 단일 유도
          TEST_CPP=$(yq -r '(.test_cpp_gated + .test_cpp_besteffort) | join(" ")' .github/ci-packages.yml)
          TEST_PY=$(yq -r '.test_python | join(" ")' .github/ci-packages.yml)
          LINT=$(yq -r '.lint_cpp | join(" ")' .github/ci-packages.yml)
          # coverage_paths: lcov --extract 의 다중 인자 — 한 줄에 공백 분리
          COV=$(yq -r '.coverage_paths | join(" ")' .github/ci-packages.yml)
          {
            echo "build=${BUILD}"
            echo "test_cpp=${TEST_CPP}"
            echo "test_cpp_gated=${TEST_CPP_GATED}"
            echo "test_cpp_besteffort=${TEST_CPP_BESTEFFORT}"
            echo "test_python=${TEST_PY}"
            echo "lint_cpp=${LINT}"
            echo "coverage_paths=${COV}"
          } >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"
          echo "test_cpp=${TEST_CPP}"
          echo "test_cpp_gated=${TEST_CPP_GATED}"
          echo "test_cpp_besteffort=${TEST_CPP_BESTEFFORT}"
          echo "test_python=${TEST_PY}"
          echo "lint_cpp=${LINT}"

  # ============================================================
  #  Build isolated deps — fmt 11 / mimalloc / aligator
  #  cache hit 시 skip, miss 시 ~15 min 빌드 후 artifact upload
  # ============================================================
  build-deps:
    name: Build Isolated Deps
    needs: [changes, packages]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        # step-level timeout: apt 미러가 정체하면 이 composite 하나가 잡의 예산을
        # 통째로 먹는다. 그러면 결과가 `cancelled` 로 남고 빌드·테스트 step 은
        # `skipped` 이라 **진짜 실패와 한눈에 구분되지 않는다** — 신호가 사라지는 게
        # 시간을 잃는 것보다 비싸다. 형제 잡들이 같은 composite 를 3분 안에 끝내므로
        # 15분은 5배 여유이고, 넘으면 그건 코드가 아니라 인프라 정체다.
        timeout-minutes: 15
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: deps-v1
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            ros-jazzy-proxsuite
            libeigen3-dev

      - name: Build & cache deps
        uses: ./.github/actions/build-isolated-deps
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          cache-version: v1

  # ============================================================
  #  C++ Lint (cppcheck) — deps 불요
  # ============================================================
  lint-cpp:
    name: C++ Lint (cppcheck)
    needs: [changes, packages]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        timeout-minutes: 15
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: lint-v1
          install-numpy: "false"
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-tinyxml2-vendor
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      - name: Run cppcheck
        env:
          AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: 1
          LINT_PACKAGES: ${{ needs.packages.outputs.lint_cpp }}
        run: |
          set -eo pipefail
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          read -ra PACKAGES <<< "$LINT_PACKAGES"
          ERRORS=0
          for pkg in "${PACKAGES[@]}"; do
            [ -d "$pkg" ] || continue
            DIRS=""
            [ -d "$pkg/include" ] && DIRS="$DIRS $pkg/include"
            [ -d "$pkg/src" ] && DIRS="$DIRS $pkg/src"
            if [ -z "$DIRS" ]; then
              echo "=== $pkg: no include/ or src/ — skipped"
              continue
            fi
            echo "=== Checking $pkg ==="
            ament_cppcheck $DIRS || ERRORS=$((ERRORS + 1))
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::cppcheck found errors in $ERRORS package(s)"
            exit 1
          fi

  # ============================================================
  #  Python Tests (rtc_tools, rtc_digital_twin) — deps 불요
  # ============================================================
  python-test:
    name: Python Test
    needs: [changes, packages]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        timeout-minutes: 15
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: pytest-v1
          install-numpy: "false"

      - name: Install Python test dependencies
        # mujoco 는 test_compare_mjcf_urdf 의 구조 비교(컴파일된 MJCF vs URDF)가
        # 실제로 돌게 하는 데 필요하다. 없으면 _compare_structure() 가 통째로
        # skip 되고 `assert mismatches == 0` 이 "비교를 안 해서" 통과한다 (#385).
        run: pip install pytest pytest-cov coverage pandas numpy matplotlib mujoco

      - name: Build Python packages
        uses: ./.github/actions/colcon-build
        with:
          packages: ${{ needs.packages.outputs.test_python }}
          ros-distro: ${{ env.ROS_DISTRO }}
          enable-testing: "true"
          artifact-suffix: pybuild

      - name: Run Python tests with coverage
        uses: ./.github/actions/colcon-test-report
        with:
          packages: ${{ needs.packages.outputs.test_python }}
          ros-distro: ${{ env.ROS_DISTRO }}
          pytest-args: "--cov=rtc_tools --cov=rtc_digital_twin --cov-report=xml:coverage.xml"
          summary-title: Python Test Results
          artifact-suffix: pytest

      - name: Collect Python coverage
        id: pycov
        if: always()
        run: |
          set -eo pipefail
          # colcon 은 각 python 패키지 pytest 를 그 패키지 소스 dir(rootdir)에서 실행하므로
          # pytest-cov 는 coverage.xml 을 rtc_tools/coverage.xml · rtc_digital_twin/coverage.xml
          # (소스 트리)에 각각 쓴다 — build/ 도 ws-root 도 아니다. 이전엔 ./coverage.xml 과
          # build/ 만 봐서 둘 다 놓쳐 항상 0개 → carryforward 였다. ws 전체를 검색해(install/
          # log/deps 제외) 두 파일을 모두 업로드하면 Codecov 가 병합(line-max)한다.
          mapfile -t FILES < <(find . -name 'coverage.xml' \
            -not -path './install/*' -not -path './log/*' -not -path './_rtc_ws/*' \
            2>/dev/null | sort -u)
          echo "Found ${#FILES[@]} coverage.xml file(s):"
          printf '  %s\n' "${FILES[@]}"
          # 측정 무결성 게이트 (내용 기반): 두 python 패키지가 실제로 리포트에 들어갔는지
          # 확인한다. 하나라도 없으면 부분/빈 업로드이므로 annotation 으로 가시화한다.
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::warning title=Python coverage missing::pytest-cov produced no coverage.xml"
          else
            for pkg in rtc_tools rtc_digital_twin; do
              if ! grep -q "${pkg}" "${FILES[@]}" 2>/dev/null; then
                echo "::warning title=Python coverage incomplete::${pkg} absent from coverage.xml (partial upload)"
              fi
            done
          fi
          IFS=,; echo "files=${FILES[*]}" >> "$GITHUB_OUTPUT"

      - name: Upload Python coverage to Codecov
        if: always() && steps.pycov.outputs.files != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.pycov.outputs.files }}
          flags: python
          name: rtc-framework-python
          fail_ci_if_error: false

  # ============================================================
  #  C++ Build & Gated Test — MERGE GATE (fast, RelWithDebInfo, 비계측)
  #
  #  Fast-gate 분리 (2026-07-11): 이전엔 merge gate(test_cpp_gated)가 coverage-cpp
  #  의 Debug+gcov 계측 빌드(60min) 안에 있어 merge 판정이 느린 커버리지 job 종료까지
  #  묶였다. 이제 gated 테스트를 이 빠른 비계측 job 으로 분리해 merge 신호를 즉시 낸다.
  #  coverage-cpp 는 non-blocking observability(추세)로 강등된다.
  #
  #  구성: 전체 build 리스트 RelWithDebInfo 빌드(compile-all 신호, enable-testing) +
  #  test_cpp_gated colcon test(--return-code-on-test-failure → job 실패 = merge 차단).
  #  best-effort(rtc_tsid perf / integrated_bringup grasp) 는 여기서 돌리지 않는다 —
  #  coverage-cpp 에서 coverage 전용으로 수집.
  # ============================================================
  gated-test:
    name: C++ Build & Gated Test
    needs: [changes, packages, build-deps]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    # 예산 60 의 근거 (#388) — coverage-cpp 와 동일한 기준: 예산은 **콜드 경로**가
    # 완주할 수 있어야 한다 (콜드 run 이 잘리면 캐시를 못 채워 다음 run 도 콜드다).
    # 이 잡의 콜드 실측은 #389 검증에서 처음 나왔다: 44.9분(run 31234173159) ·
    # 43.4분(run 31235008568), 둘 다 build 만 39분대. 50 이었을 때 여유가 10%뿐이라
    # coverage-cpp 가 60 에서 만료했던 것과 같은 벼랑이었고, 이쪽은 merge gate 라
    # 만료가 PR 을 막는다. 새 구조의 콜드 상한 = preamble 4.3 + build 39.2 +
    # save 1.2 + test 0.4 ≈ 45.1분 → 60 은 그 위 25%.
    timeout-minutes: 60
    # ccache: RelWithDebInfo flavor 전용 캐시 디렉토리. CCACHE_COMPILERCHECK=content 로
    # runner image 의 컴파일러가 바뀌면 (ident 가 아니라 내용 기준) 자동 무효화 → stale
    # object 재사용 방지. maxsize 는 repo 10GB actions-cache 예산 안에서 넉넉히.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/gated
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: "1G"
    steps:
      - uses: actions/checkout@v7

      # issue #210: 18 패키지 RelWithDebInfo 산출물 + ccache 2벌이 14GB 표준 러너의
      # 임계에 붙어 최종 링크에서 간헐적 ENOSPC. 빌드 전에 미사용 툴체인을 걷어내고,
      # cleanup / pre-build / post-build 3지점에서 free block·inode·구성별 크기를 남긴다.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Disk report (after cleanup)
        uses: ./.github/actions/disk-report
        with:
          label: after-cleanup

      - name: Setup environment
        timeout-minutes: 15
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: build-v4
          apt-packages: >-
            ccache
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-xacro
            ros-jazzy-tinyxml2-vendor
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      - name: Download deps artifact
        uses: actions/download-artifact@v8
        with:
          name: rtc-deps-${{ env.ROS_DISTRO }}
          path: _rtc_ws/deps/install

      # 캐시 정책 (#388, 2026-08-08) — restore/save 분리 + main 에서만 save.
      #   ① 10GB repo 예산에 한 run 이 8.9GB(colcon×2 + ccache×2)를 생산해 두 run 이
      #      공존할 수 없었다. 게다가 PR-ref 캐시는 main·타 PR 에서 원리적으로 읽지
      #      못하므로(ref scoping) 사장 용량이면서 축출 압력만 만든다 — 실측 시점에
      #      예산의 53%가 이미 머지된 PR 의 ref 에 앉아 있었다. → PR 은 restore 만 한다.
      #   ② `actions/cache@v6` 의 post 는 `post-if: success()` 다. 잡이 실패하면 저장이
      #      통째로 skip 되므로 "step timeout 으로 post 몫을 남긴다" 는 처방은 cancelled
      #      를 skipped 로 바꿀 뿐이었다. save 를 명시 step 으로 분리해 `always()` 를 건다.
      #   ③ save 를 **build 직후**로 올린다. 이로써 잡 끝의 비싼 post-step 이 사라지고
      #      (restore-only 는 post 가 없다) 만료 cliff 가 캐시를 앗아갈 구간 자체가
      #      없어진다 — #388 되먹임 고리(만료 → 미저장 → 다음 run 콜드 → 재만료)를
      #      예산 산술이 아니라 구조로 끊는다. 덤으로 test 전 저장이라 .gcda 가 안 섞인다.
      - name: Restore colcon workspace
        id: colcon-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/
            install/
          key: colcon-${{ env.ROS_DISTRO }}-build-v6-${{ hashFiles('**/CMakeLists.txt', '**/package.xml', '**/*.hpp', '**/*.cpp') }}
          restore-keys: |
            colcon-${{ env.ROS_DISTRO }}-build-v6-

      # ccache 는 build/ colcon 캐시와 상보적이다: colcon 키는 소스 한 줄만 바뀌어도
      # hashFiles 가 달라져 전량 재빌드하지만, ccache 는 per-TU content hash 라 바뀐
      # translation unit 만 재컴파일한다 (warm-cache 시간 단축의 실제 메커니즘). main
      # push 마다 run_id 로 새 엔트리를 저장하고 flavor prefix restore-key 로 직전 캐시를
      # 상속. coverage-cpp 와 flavor prefix(relwithdebinfo vs debug-gcov)가 달라 namespace 미공유.
      - name: Restore ccache (RelWithDebInfo)
        id: ccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache/gated
          key: ccache-${{ runner.os }}-${{ env.ROS_DISTRO }}-relwithdebinfo-v1-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ROS_DISTRO }}-relwithdebinfo-v1-

      # 두 cache + deps artifact 복원이 모두 끝난 뒤 = 빌드가 실제로 출발하는 headroom.
      # cold-cache 실행과 warm-cache 실행의 차이가 여기서 드러난다.
      - name: Disk report (pre-build)
        uses: ./.github/actions/disk-report
        with:
          # min-free-gb 는 첫 cold/warm 실측 뒤에 채운다 (issue #210 성공 기준 2).
          label: pre-build

      - name: Build packages
        uses: ./.github/actions/colcon-build
        with:
          packages: ${{ needs.packages.outputs.build }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          build-type: RelWithDebInfo
          enable-testing: "true"
          use-ccache: "true"
          artifact-suffix: cpp-build

      # 캐시 저장 — build 직후 (위 restore step 주석 ①②③). test 이후가 아니라 여기서
      # 저장하므로 뒤따르는 어떤 실패·만료도 다음 run 의 캐시를 앗아가지 못한다.
      # cache-primary-key 를 되받아 restore 와 키 동일성을 보장한다 (수식 중복 금지).
      - name: Save colcon workspace
        if: always() && github.ref == 'refs/heads/main' && steps.colcon-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/
            install/
          key: ${{ steps.colcon-cache.outputs.cache-primary-key }}

      # ccache 키는 run_id 라 정확 히트가 원리적으로 없다 → cache-hit 조건 불요.
      - name: Save ccache (RelWithDebInfo)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache/gated
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      # GATE: CI 실측 통과 패키지. --return-code-on-test-failure 가 job 을 그대로
      # 실패시킨다 (continue-on-error 없음) → 여기 red 면 PR merge 차단. 비계측
      # RelWithDebInfo 라 coverage-cpp 의 Debug+gcov 보다 빠르게 판정이 난다.
      - name: Run gated C++ tests (merge gate)
        uses: ./.github/actions/colcon-test-report
        with:
          packages: ${{ needs.packages.outputs.test_cpp_gated }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          summary-title: C++ Gated Test Results
          artifact-suffix: cpp-gated-test

      # always(): ENOSPC 로 죽은 run 이야말로 이 수치가 필요하다.
      - name: Disk report (post-build)
        if: always()
        uses: ./.github/actions/disk-report
        with:
          label: post-build

  # ============================================================
  #  C++ Coverage — gcov/lcov instrumented build + colcon test → Codecov
  #
  #  복원 (2026-05-31): build-test 단순화 (2026-04-28) 로 제거됐던 C++ coverage
  #  upload 를 별도 job 으로 분리 복원. colcon test 의 ModuleNotFoundError root
  #  cause 는 colcon-test-report action 의 PYTHONPATH 보강으로 해결됨 (python-test
  #  job 에서 검증됨). gated-test 는 RelWithDebInfo 빌드+merge gate 를 담당하고,
  #  여기서는 ENABLE_COVERAGE=ON (Debug 계측) 으로 분리한다.
  #
  #  NON-BLOCKING observability (2026-07-11): merge gate 는 gated-test job 으로
  #  이전됐다. 이 job 은 coverage 추세 측정 전용 — gated+besteffort 테스트를 모두
  #  continue-on-error 로 돌려 .gcda 를 최대 수집하고 Codecov 에 올린다. 여기서
  #  test 가 red 여도 PR merge 는 차단하지 않는다 (branch protection 에서 이 job 을
  #  required 로 두지 말 것). 실 결함 신호는 gated-test job 이 담당한다.
  #  빌드 캐시: gated-test 와 분리된 키(coverage-v1, Debug+gcov), restore-keys 로 증분.
  #  캐시 복원분의 stale .gcda 는 build 직후·캐시 save 직전 정리 (카운트 오염 방지 +
  #  저장되는 캐시가 카운터를 물고 다니지 않게).
  # ============================================================
  coverage-cpp:
    name: C++ Coverage
    needs: [changes, packages, build-deps]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    # 예산 75 의 근거 (#388) — 웜 캐시 정상상태는 18~29분(실측 3회)이라 60% 이상 여유가
    # 남지만, 예산은 **콜드 경로**가 완주할 수 있어야 한다: 콜드 run 이 중간에 잘리면
    # 캐시를 못 채워 다음 run 도 콜드가 되기 때문이다. 콜드 실측 p100 은 기능 step 합
    # 59.3분(run 31188282031)이고 이제 비싼 post-step 이 없으므로(restore-only 는 post
    # 부재, save 는 build 직후 명시 step) 61분이 상한이다 → 75 는 그 위 19% 여유.
    # 60 이었을 때 그 여유가 -2% 여서 만료했다.
    timeout-minutes: 75
    # NOTE: job-level continue-on-error 는 의도적으로 두지 않는다. "non-blocking" 은
    # branch protection 에서 이 job 을 required 로 두지 않음으로 달성하고, coverage
    # 파이프라인 자체의 고장(계측 빌드 실패 / lcov 단계 오류 / 인프라 flake)은 run
    # status 로 계속 드러나야 한다 — continue-on-error 를 붙이면 그게 초록에 묻힌다.
    # 개별 test 실패만 non-blocking (아래 step-level continue-on-error).
    # ccache: Debug+gcov flavor 전용 디렉토리 — gated(RelWithDebInfo) 와 CCACHE_DIR·
    # 캐시 키 prefix 를 분리해 계측 산출물이 gated namespace 를 오염시키지 못하게 한다.
    # ccache 는 컴파일 산출(.o/.gcno)만 재사용하고, .gcda(실행 카운터)는 build 직후
    # 별도 reset 되므로 커버리지 카운트 오염 경로가 겹치지 않는다.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/coverage
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: "2G"
    steps:
      - uses: actions/checkout@v7

      # issue #210: Debug+gcov 오브젝트는 gated 의 RelWithDebInfo 보다 크므로 이 job 은
      # 아직 안 터졌더라도 헤드룸이 더 얇다. gated 와 동일하게 확보 + 계측한다.
      #
      # 아래 step-level timeout 들(#388)은 **단일 step 의 hang 상한**이지 가산 예산이
      # 아니다 — 합(119분)은 잡 예산(75분)을 넘고 그게 의도다. 각 값은 실측 p100 의
      # 1.3~3배로, 정상 run 에서는 절대 발화하지 않고 무한정 붙잡힌 step 만 잘라낸다.
      # 캐시 보전은 이 값들이 아니라 save step 의 위치가 보장한다 (build 직후).
      - name: Free disk space
        timeout-minutes: 5
        uses: ./.github/actions/free-disk-space

      - name: Disk report (after cleanup)
        uses: ./.github/actions/disk-report
        with:
          label: after-cleanup

      # id: setup — 아래 always() step 들이 이 outcome 을 보고 갈린다. setup 이 죽으면
      # lcov/colcon 자체가 없으므로 always() 가 "lcov: command not found"(exit 127) 와
      # 빈 coverage.info 업로드를 연쇄 생성한다 (2026-07-20 run 29717918811).
      # always() 의 의도는 "테스트가 실패해도 .gcda 는 수집" 이지 "환경이 없어도 강행" 이 아니다.
      - name: Setup environment
        timeout-minutes: 15
        id: setup
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: coverage-v2
          apt-packages: >-
            ccache
            lcov
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-xacro
            ros-jazzy-tinyxml2-vendor
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      - name: Download deps artifact
        uses: actions/download-artifact@v8
        with:
          name: rtc-deps-${{ env.ROS_DISTRO }}
          path: _rtc_ws/deps/install

      # gated-test 와 분리된 키 (Debug + gcov 계측이라 산출물이 다름). restore-keys
      # prefix 매치로 colcon 증분 빌드 → 변경 패키지만 재컴파일 (cold 33min 단축).
      # 정책은 gated-test 의 "캐시 정책 (#388)" 주석이 SSoT — 여기 복제하지 않는다.
      - name: Restore colcon workspace (coverage)
        id: colcon-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/
            install/
          key: colcon-${{ env.ROS_DISTRO }}-coverage-v1-${{ hashFiles('**/CMakeLists.txt', '**/package.xml', '**/*.hpp', '**/*.cpp') }}
          restore-keys: |
            colcon-${{ env.ROS_DISTRO }}-coverage-v1-

      # gated 와 분리된 flavor prefix(debug-gcov). ccache 는 -ftest-coverage 빌드의
      # .gcno 를 object 와 함께 캐시하므로 계측이 유지된다. 런타임 .gcda 는 아래
      # "Reset stale coverage counters" 가 build 직후·save 직전에 지우므로 카운트 오염과 무관.
      - name: Restore ccache (Debug + gcov)
        id: ccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache/coverage
          key: ccache-${{ runner.os }}-${{ env.ROS_DISTRO }}-debug-gcov-v1-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ROS_DISTRO }}-debug-gcov-v1-

      - name: Disk report (pre-build)
        uses: ./.github/actions/disk-report
        with:
          label: pre-build

      - name: Build packages (coverage-instrumented)
        timeout-minutes: 50
        uses: ./.github/actions/colcon-build
        with:
          packages: ${{ needs.packages.outputs.test_cpp }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          build-type: Debug
          enable-coverage: "true"
          use-ccache: "true"
          artifact-suffix: cpp-coverage-build

      # build 직후 · save 직전으로 올렸다 (#388): 복원분에 섞여 온 이전 run 의 .gcda 를
      # 지우고 저장해야 캐시가 카운터를 물고 다니지 않는다. 이번 run 의 coverage 는
      # 여전히 아래 test step 실행분만 반영한다 (baseline 은 --initial 이라 .gcno 만 읽어
      # 이 순서에 무관). .gcno(빌드 산출)는 보존하므로 instrumentation 은 유지된다.
      - name: Reset stale coverage counters (.gcda)
        if: always()
        shell: bash
        run: find build -name '*.gcda' -delete 2>/dev/null || true

      # build 직후 저장 (gated-test 의 정책 주석 ③). 이 job 이 #388 의 당사자다 —
      # 이전 구조에서는 여기서부터 잡 끝까지 ~15분을 더 간 뒤에야 post-step 이 3.5GB 를
      # 올리려다 만료에 잘렸다.
      - name: Save colcon workspace (coverage)
        if: always() && github.ref == 'refs/heads/main' && steps.colcon-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/
            install/
          key: ${{ steps.colcon-cache.outputs.cache-primary-key }}

      - name: Save ccache (Debug + gcov)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache/coverage
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Capture baseline (zero-coverage) lcov
        timeout-minutes: 8
        shell: bash
        run: |
          set -eo pipefail
          # 테스트가 한 번도 실행하지 않은 instrumented 라인을 0% 로 포함시켜
          # 미실행 코드가 커버리지 분모에 반영되도록 한다 (untested 파일 0% 노출).
          lcov --capture --initial \
            --directory build \
            --output-file coverage.base.info \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors mismatch,source,gcov,negative,unused,empty 2>&1 | tail -20 || true

      # COVERAGE-ONLY: merge gate 는 gated-test job 으로 이전됐다. 여기서는 동일
      # gated 패키지를 계측 빌드로 다시 돌려 coverage .gcda 를 얻되, continue-on-error
      # 로 job 은 실패시키지 않는다(non-blocking). 실 결함 차단은 gated-test 담당.
      - name: Run gated C++ tests (coverage only)
        timeout-minutes: 15
        if: always() && steps.setup.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/colcon-test-report
        with:
          packages: ${{ needs.packages.outputs.test_cpp_gated }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          summary-title: C++ Gated Test Results (coverage)
          artifact-suffix: cpp-coverage-test-gated

      # BEST-EFFORT: CI-fragile (rtc_tsid perf / integrated_bringup grasp). coverage 만
      # 수집하고 실패해도 PR 을 차단하지 않는다 (continue-on-error). 실패는 step red +
      # GITHUB_STEP_SUMMARY annotation 으로 계속 노출(가시성 유지). always() 로 gated
      # 실패 여부와 무관하게 실행해 coverage 를 최대한 수집한다.
      - name: Run best-effort C++ tests (coverage only)
        timeout-minutes: 15
        if: always() && steps.setup.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/colcon-test-report
        with:
          packages: ${{ needs.packages.outputs.test_cpp_besteffort }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          summary-title: C++ Best-Effort Test Results
          artifact-suffix: cpp-coverage-test-besteffort

      # lcov 이전에 찍는다: .gcda 까지 얹힌 build/ 가 이 job 의 disk peak 다.
      - name: Disk report (post-build)
        if: always()
        uses: ./.github/actions/disk-report
        with:
          label: post-build

      - name: Capture & filter lcov coverage
        timeout-minutes: 8
        if: always() && steps.setup.outcome == 'success'
        shell: bash
        env:
          COVERAGE_PATHS: ${{ needs.packages.outputs.coverage_paths }}
        run: |
          set -eo pipefail
          # 테스트 실행 후 .gcda → tracefile
          lcov --capture \
            --directory build \
            --output-file coverage.test.info \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors mismatch,source,gcov,negative,unused,empty 2>&1 | tail -20

          # baseline(0%) + test 합산 → 미실행 파일도 분모 포함
          COMBINE_ARGS="--add-tracefile coverage.test.info"
          if [ -s coverage.base.info ]; then
            COMBINE_ARGS="--add-tracefile coverage.base.info ${COMBINE_ARGS}"
          fi
          # shellcheck disable=SC2086
          lcov ${COMBINE_ARGS} \
            --output-file coverage.combined.info \
            --ignore-errors empty,unused 2>&1 | tail -10

          # ci-packages.yml 의 coverage_paths 글로브만 추출 (test/ 등은 codecov.yml ignore)
          # shellcheck disable=SC2086
          lcov --extract coverage.combined.info ${COVERAGE_PATHS} \
            --output-file coverage.info \
            --ignore-errors unused,empty 2>&1 | tail -20

          echo "=== Coverage summary ==="
          lcov --summary coverage.info --ignore-errors empty || true

          # 측정 무결성 게이트: coverage.info 가 없거나 SF(파일) 레코드가 0 이면
          # 빈/부분 리포트가 조용히 업로드되는 것이므로 annotation 으로 가시화한다.
          # (테스트 timeout/fail 로 .gcda 미생성 시 여기서 드러난다 — silent pass 방지.)
          SF_COUNT=$(grep -c '^SF:' coverage.info 2>/dev/null || echo 0)
          echo "coverage.info source files: ${SF_COUNT}"
          if [ ! -s coverage.info ] || [ "${SF_COUNT}" -eq 0 ]; then
            echo "::warning title=C++ coverage empty::coverage.info missing or has 0 source records — upload will be empty/partial"
          fi

      # 환경 부재로 coverage.info 가 아예 없을 때 빈 리포트를 올려 Codecov 추세를
      # 0% 로 오염시키지 않도록 setup 성공 시에만 업로드한다.
      - name: Upload C++ coverage to Codecov
        timeout-minutes: 8
        if: always() && steps.setup.outcome == 'success'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          flags: cpp
          name: rtc-framework-cpp
          fail_ci_if_error: false

  # CodeQL: 별도 워크플로우 (.github/workflows/codeql.yml) 로 분리 — weekly + manual.
  # PR/푸시마다 30-60분 빌드 instrumentation 을 돌릴 가치가 낮아 떼어냈다 (2026-04-28).
