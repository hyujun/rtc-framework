name: ROS2 Advanced CI

# 전면 재작성: 2026-04-27 (agent_docs/ci-rewrite-plan.md)
# 핵심 변경:
#   - build-deps job: fmt 11 / mimalloc / aligator 사전 빌드 → cache + artifact
#     (이전 실패의 root cause 해결: rtc_mpc 의 find_package(fmt 10) 실패)
#   - claude-review job 제거 (D-1)
#   - 패키지 목록 SSoT: .github/ci-packages.yml
#   - composite actions 활용 (.github/actions/*)
#   - coverage upload 분리 (build 실패에 묶이지 않음)
#   - paths-ignore 에 agent_docs/** 추가
#   - codeql 분리: .github/workflows/codeql.yml (weekly + manual, 2026-04-28)

on:
  push:
    branches: [main]
    # repo_scripts/** 는 통째로 ignore 하지 않는다: repo_scripts/scripts/build_deps.sh
    # 는 cpp 필터(changes job)의 트리거 입력이므로 ignore 하면 워크플로 자체가 시작되지
    # 않아 필터가 死한다. build 무관한 repo_scripts 변경은 트리거되되 cpp/python 필터가
    # 모두 false → heavy job 은 skip(changes/packages 만, 수 초).
    paths-ignore:
      - 'docs/**'
      - 'agent_docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'agent_docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

# 동일 브랜치 중복 실행 방지 — 새 push 시 이전 실행 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙 — 전 job 은 read-only GITHUB_TOKEN 을 상속. Codecov 는 별도 secret
# (CODECOV_TOKEN) 을 쓰므로 token write 불요. write 가 필요한 job 은 job-level override.
permissions:
  contents: read

env:
  ROS_DISTRO: jazzy
  # ros-tooling/setup-ros@v0.7 (latest 0.7.15) 는 아직 Node 20 사용 — 강제 Node 24
  # 으로 호환성 유지. 2026-06-02 부터 GitHub Actions 가 Node 24 강제 전환.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  #  Path filter — 후속 job 실행 여부 결정
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - '**/*.hpp'
              - '**/*.cpp'
              - '**/*.h'
              - '**/CMakeLists.txt'
              - '**/package.xml'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.xml'
              - '**/*.urdf'
              - '**/*.msg'
              - '**/*.srv'
              - '.github/actions/**'
              - '.github/ci-packages.yml'
              - 'deps.repos'
              - 'repo_scripts/scripts/build_deps.sh'
            python:
              - 'rtc_tools/**/*.py'
              - 'rtc_digital_twin/**/*.py'
              - 'rtc_tools/setup.py'
              - 'rtc_tools/setup.cfg'
              - 'rtc_digital_twin/setup.py'
              - 'rtc_digital_twin/setup.cfg'
              - 'rtc_msgs/msg/*.msg'
              - 'rtc_msgs/srv/*.srv'

  # ============================================================
  #  Package list loader — .github/ci-packages.yml 을 4개 output 으로 노출
  # ============================================================
  packages:
    name: Load Package Lists
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.load.outputs.build }}
      test_cpp: ${{ steps.load.outputs.test_cpp }}
      test_cpp_gated: ${{ steps.load.outputs.test_cpp_gated }}
      test_cpp_besteffort: ${{ steps.load.outputs.test_cpp_besteffort }}
      test_python: ${{ steps.load.outputs.test_python }}
      lint_cpp: ${{ steps.load.outputs.lint_cpp }}
      coverage_paths: ${{ steps.load.outputs.coverage_paths }}
    steps:
      - uses: actions/checkout@v5
      - name: Parse ci-packages.yml
        id: load
        run: |
          set -eo pipefail
          # ubuntu-24.04 image 는 yq 4.x preinstalled
          BUILD=$(yq -r '.build | join(" ")' .github/ci-packages.yml)
          TEST_CPP_GATED=$(yq -r '.test_cpp_gated | join(" ")' .github/ci-packages.yml)
          TEST_CPP_BESTEFFORT=$(yq -r '.test_cpp_besteffort | join(" ")' .github/ci-packages.yml)
          # test_cpp = gated + besteffort union — 빌드/커버리지 입력의 단일 유도
          TEST_CPP=$(yq -r '(.test_cpp_gated + .test_cpp_besteffort) | join(" ")' .github/ci-packages.yml)
          TEST_PY=$(yq -r '.test_python | join(" ")' .github/ci-packages.yml)
          LINT=$(yq -r '.lint_cpp | join(" ")' .github/ci-packages.yml)
          # coverage_paths: lcov --extract 의 다중 인자 — 한 줄에 공백 분리
          COV=$(yq -r '.coverage_paths | join(" ")' .github/ci-packages.yml)
          {
            echo "build=${BUILD}"
            echo "test_cpp=${TEST_CPP}"
            echo "test_cpp_gated=${TEST_CPP_GATED}"
            echo "test_cpp_besteffort=${TEST_CPP_BESTEFFORT}"
            echo "test_python=${TEST_PY}"
            echo "lint_cpp=${LINT}"
            echo "coverage_paths=${COV}"
          } >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"
          echo "test_cpp=${TEST_CPP}"
          echo "test_cpp_gated=${TEST_CPP_GATED}"
          echo "test_cpp_besteffort=${TEST_CPP_BESTEFFORT}"
          echo "test_python=${TEST_PY}"
          echo "lint_cpp=${LINT}"

  # ============================================================
  #  Build isolated deps — fmt 11 / mimalloc / aligator
  #  cache hit 시 skip, miss 시 ~15 min 빌드 후 artifact upload
  # ============================================================
  build-deps:
    name: Build Isolated Deps
    needs: [changes, packages]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: deps-v1
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            ros-jazzy-proxsuite
            libeigen3-dev

      - name: Build & cache deps
        uses: ./.github/actions/build-isolated-deps
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          cache-version: v1

  # ============================================================
  #  C++ Lint (cppcheck) — deps 불요
  # ============================================================
  lint-cpp:
    name: C++ Lint (cppcheck)
    needs: [changes, packages]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: lint-v1
          install-numpy: "false"
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-tinyxml2-vendor
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      - name: Run cppcheck
        env:
          AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: 1
          LINT_PACKAGES: ${{ needs.packages.outputs.lint_cpp }}
        run: |
          set -eo pipefail
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          read -ra PACKAGES <<< "$LINT_PACKAGES"
          ERRORS=0
          for pkg in "${PACKAGES[@]}"; do
            [ -d "$pkg" ] || continue
            DIRS=""
            [ -d "$pkg/include" ] && DIRS="$DIRS $pkg/include"
            [ -d "$pkg/src" ] && DIRS="$DIRS $pkg/src"
            if [ -z "$DIRS" ]; then
              echo "=== $pkg: no include/ or src/ — skipped"
              continue
            fi
            echo "=== Checking $pkg ==="
            ament_cppcheck $DIRS || ERRORS=$((ERRORS + 1))
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::cppcheck found errors in $ERRORS package(s)"
            exit 1
          fi

  # ============================================================
  #  Python Tests (rtc_tools, rtc_digital_twin) — deps 불요
  # ============================================================
  python-test:
    name: Python Test
    needs: [changes, packages]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: pytest-v1
          install-numpy: "false"

      - name: Install Python test dependencies
        run: pip install pytest pytest-cov coverage pandas numpy matplotlib

      - name: Build Python packages
        uses: ./.github/actions/colcon-build
        with:
          packages: ${{ needs.packages.outputs.test_python }}
          ros-distro: ${{ env.ROS_DISTRO }}
          enable-testing: "true"
          artifact-suffix: pybuild

      - name: Run Python tests with coverage
        uses: ./.github/actions/colcon-test-report
        with:
          packages: ${{ needs.packages.outputs.test_python }}
          ros-distro: ${{ env.ROS_DISTRO }}
          pytest-args: "--cov=rtc_tools --cov=rtc_digital_twin --cov-report=xml:coverage.xml"
          summary-title: Python Test Results
          artifact-suffix: pytest

      - name: Collect Python coverage
        if: always()
        run: |
          find build/ -name 'coverage.xml' -print 2>/dev/null | head -5 || true
          if [ ! -f coverage.xml ]; then
            FIRST=$(find build/ -name 'coverage.xml' | head -1 || true)
            [ -n "$FIRST" ] && cp "$FIRST" coverage.xml || true
          fi

      - name: Upload Python coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          name: rtc-framework-python
          fail_ci_if_error: false

  # ============================================================
  #  Build (C++) — fmt 11 deps 사용
  #
  #  단순화 (2026-04-28): colcon test / coverage / clang-tidy 모두 제거.
  #  ament_cmake_test 가 ctest child process 에서 module not found 로 깨짐
  #  (4 차례 fix 시도 후에도 미해결, agent_docs/ci-rewrite-plan.md §6 risk).
  #
  #  현재 신호: 빌드만 통과 → fmt 11 root cause fix 검증 충분.
  #  복원 예정: main 머지 후 별도 PR 에서 colcon test 환경 디버깅 + clang-tidy.
  # ============================================================
  build-test:
    name: Build (C++)
    needs: [changes, packages, build-deps]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: build-v3
          apt-packages: >-
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-xacro
            ros-jazzy-tinyxml2-vendor
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      - name: Download deps artifact
        uses: actions/download-artifact@v4
        with:
          name: rtc-deps-${{ env.ROS_DISTRO }}
          path: _rtc_ws/deps/install

      - name: Cache colcon workspace
        uses: actions/cache@v4
        with:
          path: |
            build/
            install/
          key: colcon-${{ env.ROS_DISTRO }}-build-v6-${{ hashFiles('**/CMakeLists.txt', '**/package.xml', '**/*.hpp', '**/*.cpp') }}
          restore-keys: |
            colcon-${{ env.ROS_DISTRO }}-build-v6-

      - name: Build packages
        uses: ./.github/actions/colcon-build
        with:
          packages: ${{ needs.packages.outputs.build }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          build-type: RelWithDebInfo
          enable-testing: "false"
          artifact-suffix: cpp-build

  # ============================================================
  #  C++ Coverage — gcov/lcov instrumented build + colcon test → Codecov
  #
  #  복원 (2026-05-31): build-test 단순화 (2026-04-28) 로 제거됐던 C++ coverage
  #  upload 를 별도 job 으로 분리 복원. colcon test 의 ModuleNotFoundError root
  #  cause 는 colcon-test-report action 의 PYTHONPATH 보강으로 해결됨 (python-test
  #  job 에서 검증됨). build-test 는 RelWithDebInfo 빌드 신호로 그대로 유지하고,
  #  여기서는 ENABLE_COVERAGE=ON (Debug 계측) 으로 분리한다.
  #
  #  Test 게이트 복원 (2026-06-03): test 를 2 tier 로 나눈다 (CI 실측 기반, ci-packages.yml).
  #    - test_cpp_gated      : CI 통과 패키지 → --return-code-on-test-failure 가 job 을
  #                            그대로 실패시킨다 (merge GATE). continue-on-error 없음.
  #    - test_cpp_besteffort : CI-fragile (rtc_tsid perf / integrated_bringup grasp) →
  #                            continue-on-error 로 coverage 만 수집, PR 차단 안 함.
  #  빌드 캐시: build-test 와 분리된 키(coverage-v1, Debug+gcov), restore-keys 로 증분.
  #  캐시 복원분의 stale .gcda 는 test 직전 정리 (커버리지 카운트 오염 방지).
  # ============================================================
  coverage-cpp:
    name: C++ Coverage
    needs: [changes, packages, build-deps]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-rtc-env
        with:
          ros-distro: ${{ env.ROS_DISTRO }}
          apt-cache-version: coverage-v1
          apt-packages: >-
            lcov
            ros-jazzy-pinocchio
            ros-jazzy-proxsuite
            ros-jazzy-behaviortree-cpp
            ros-jazzy-xacro
            ros-jazzy-tinyxml2-vendor
            ros-jazzy-hpp-fcl
            ros-jazzy-eigenpy
            libyaml-cpp-dev
            libtinyxml2-dev
            libeigen3-dev

      - name: Download deps artifact
        uses: actions/download-artifact@v4
        with:
          name: rtc-deps-${{ env.ROS_DISTRO }}
          path: _rtc_ws/deps/install

      # build-test 와 분리된 키 (Debug + gcov 계측이라 산출물이 다름). restore-keys
      # prefix 매치로 colcon 증분 빌드 → 변경 패키지만 재컴파일 (cold 33min 단축).
      - name: Cache colcon workspace (coverage)
        uses: actions/cache@v4
        with:
          path: |
            build/
            install/
          key: colcon-${{ env.ROS_DISTRO }}-coverage-v1-${{ hashFiles('**/CMakeLists.txt', '**/package.xml', '**/*.hpp', '**/*.cpp') }}
          restore-keys: |
            colcon-${{ env.ROS_DISTRO }}-coverage-v1-

      - name: Build packages (coverage-instrumented)
        uses: ./.github/actions/colcon-build
        with:
          packages: ${{ needs.packages.outputs.test_cpp }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          build-type: Debug
          enable-coverage: "true"
          artifact-suffix: cpp-coverage-build

      - name: Capture baseline (zero-coverage) lcov
        shell: bash
        run: |
          set -eo pipefail
          # 테스트가 한 번도 실행하지 않은 instrumented 라인을 0% 로 포함시켜
          # 미실행 코드가 커버리지 분모에 반영되도록 한다 (untested 파일 0% 노출).
          lcov --capture --initial \
            --directory build \
            --output-file coverage.base.info \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors mismatch,source,gcov,negative,unused,empty 2>&1 | tail -20 || true

      # 캐시 복원 시 이전 run 의 .gcda 가 남아 gcov 카운트를 오염시킬 수 있으므로
      # 테스트 직전 모두 제거 → coverage 는 이번 run 의 실행만 반영. .gcno(빌드 산출)
      # 는 보존하므로 instrumentation 은 유지된다.
      - name: Reset stale coverage counters (.gcda)
        shell: bash
        run: find build -name '*.gcda' -delete 2>/dev/null || true

      # GATE: CI 실측 통과 패키지. colcon-test-report 의 --return-code-on-test-failure
      # 가 job 을 그대로 실패시킨다 (continue-on-error 없음) → 여기 red 면 PR merge 차단.
      - name: Run gated C++ tests (merge gate)
        uses: ./.github/actions/colcon-test-report
        with:
          packages: ${{ needs.packages.outputs.test_cpp_gated }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          summary-title: C++ Gated Test Results
          artifact-suffix: cpp-coverage-test-gated

      # BEST-EFFORT: CI-fragile (rtc_tsid perf / integrated_bringup grasp). coverage 만
      # 수집하고 실패해도 PR 을 차단하지 않는다 (continue-on-error). 실패는 step red +
      # GITHUB_STEP_SUMMARY annotation 으로 계속 노출(가시성 유지). always() 로 gated
      # 실패 여부와 무관하게 실행해 coverage 를 최대한 수집한다.
      - name: Run best-effort C++ tests (coverage only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/colcon-test-report
        with:
          packages: ${{ needs.packages.outputs.test_cpp_besteffort }}
          ros-distro: ${{ env.ROS_DISTRO }}
          deps-install-path: ${{ github.workspace }}/_rtc_ws/deps/install
          summary-title: C++ Best-Effort Test Results
          artifact-suffix: cpp-coverage-test-besteffort

      - name: Capture & filter lcov coverage
        if: always()
        shell: bash
        env:
          COVERAGE_PATHS: ${{ needs.packages.outputs.coverage_paths }}
        run: |
          set -eo pipefail
          # 테스트 실행 후 .gcda → tracefile
          lcov --capture \
            --directory build \
            --output-file coverage.test.info \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors mismatch,source,gcov,negative,unused,empty 2>&1 | tail -20

          # baseline(0%) + test 합산 → 미실행 파일도 분모 포함
          COMBINE_ARGS="--add-tracefile coverage.test.info"
          if [ -s coverage.base.info ]; then
            COMBINE_ARGS="--add-tracefile coverage.base.info ${COMBINE_ARGS}"
          fi
          # shellcheck disable=SC2086
          lcov ${COMBINE_ARGS} \
            --output-file coverage.combined.info \
            --ignore-errors empty,unused 2>&1 | tail -10

          # ci-packages.yml 의 coverage_paths 글로브만 추출 (test/ 등은 codecov.yml ignore)
          # shellcheck disable=SC2086
          lcov --extract coverage.combined.info ${COVERAGE_PATHS} \
            --output-file coverage.info \
            --ignore-errors unused,empty 2>&1 | tail -20

          echo "=== Coverage summary ==="
          lcov --summary coverage.info --ignore-errors empty || true

      - name: Upload C++ coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          flags: cpp
          name: rtc-framework-cpp
          fail_ci_if_error: false

  # CodeQL: 별도 워크플로우 (.github/workflows/codeql.yml) 로 분리 — weekly + manual.
  # PR/푸시마다 30-60분 빌드 instrumentation 을 돌릴 가치가 낮아 떼어냈다 (2026-04-28).
