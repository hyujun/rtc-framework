name: Colcon Test + Report
description: |
  colcon test 실행 → GITHUB_STEP_SUMMARY 에 markdown 표 작성 →
  실패 시 ctest --output-on-failure 덤프 + log/latest_test/ artifact upload.

  Caller responsibility:
    - colcon-build 가 먼저 성공
    - install/setup.bash 가 존재 (build 산출물)

inputs:
  packages:
    description: Space-separated package list for `--packages-select`
    required: true
  ros-distro:
    description: ROS 2 distribution to source
    required: false
    default: jazzy
  deps-install-path:
    description: Path to deps/install (for runtime LD_LIBRARY_PATH)
    required: false
    default: ""
  pytest-args:
    description: Extra arguments forwarded via `--pytest-args`
    required: false
    default: ""
  ctest-args:
    description: |
      Extra arguments forwarded via `--ctest-args`, e.g. `-R <regex>` to run a
      named subset of a package's ctest registrations.

      Pair any `-R` with `--no-tests=error`. A regex that matches nothing makes
      ctest exit 0 by default, so a renamed test would leave the caller looking
      green while running nothing — the exact silent-skip this input exists to
      let callers avoid.

      Mutually exclusive with `pytest-args` in practice: both colcon options
      consume the remaining argv, so only the last one on the command line is
      parsed as intended.
    required: false
    default: ""
  summary-title:
    description: Heading shown in job summary
    required: false
    default: Test Results
  artifact-suffix:
    description: Suffix for failure log artifact name (must be unique per job)
    required: false
    default: test

runs:
  using: composite
  steps:
    - name: Run colcon test
      id: test
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ROS_DISTRO: ${{ inputs.ros-distro }}
        DEPS_INSTALL: ${{ inputs.deps-install-path }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        CTEST_ARGS: ${{ inputs.ctest-args }}
      run: |
        set -eo pipefail
        source "/opt/ros/${ROS_DISTRO}/setup.bash"
        source install/setup.bash

        # ament_cmake_test (ament_cmake_test, ament_cmake_gtest 등) 는
        # /opt/ros/<distro>/lib/python3.X/site-packages 에 설치됨. setup.bash 가
        # PYTHONPATH 에 추가하지만, colcon → ctest → /usr/bin/python3 child 가
        # 일부 환경에서 PYTHONPATH 를 lose → ModuleNotFoundError. 명시적 보강.
        ROS_PY_SITE=$(find "/opt/ros/${ROS_DISTRO}/lib" -maxdepth 2 -name 'site-packages' -type d | head -1)
        if [ -n "${ROS_PY_SITE}" ]; then
          export PYTHONPATH="${ROS_PY_SITE}:${PYTHONPATH:-}"
        fi

        if [ -n "${DEPS_INSTALL}" ] && [ -d "${DEPS_INSTALL}" ]; then
          export LD_LIBRARY_PATH="${DEPS_INSTALL}/lib:${LD_LIBRARY_PATH:-}"
        fi

        # Both options are nargs='*' and swallow the rest of argv, so at most
        # one may be appended — and it has to come last.
        EXTRA=""
        if [ -n "${PYTEST_ARGS}" ]; then
          EXTRA="--pytest-args ${PYTEST_ARGS}"
        fi
        if [ -n "${CTEST_ARGS}" ]; then
          if [ -n "${EXTRA}" ]; then
            echo "::error title=colcon-test-report misuse::pytest-args and ctest-args cannot both be set"
            exit 1
          fi
          EXTRA="--ctest-args ${CTEST_ARGS}"
        fi

        # shellcheck disable=SC2086
        colcon test \
          --packages-select ${PACKAGES} \
          --event-handlers console_cohesion+ \
          --return-code-on-test-failure \
          ${EXTRA}

    - name: Render test summary
      if: always()
      shell: bash
      env:
        ROS_DISTRO: ${{ inputs.ros-distro }}
        TITLE: ${{ inputs.summary-title }}
      run: |
        source "/opt/ros/${ROS_DISTRO}/setup.bash"
        {
          echo "## ${TITLE}"
          echo ""
          echo '```'
          colcon test-result --all --verbose 2>&1 || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        # Failed test → annotation (GitHub Checks API 노출). colcon test-result 의
        # 요약 라인은 "N tests, 0 errors, 0 failures, 0 skipped" 처럼 error/failure 를
        # 항상 단어로 포함하므로 "errors|failures" 매칭은 0 실패에도 오해성 "Test Failure"
        # annotation 을 만든다 (실제 실패 특정을 방해). 비-0 카운트("1 error", "4 failures")
        # 만 매칭해 실제 실패한 test-result 라인만 노출한다.
        colcon test-result --all --verbose 2>&1 \
          | grep -E "[1-9][0-9]* (errors?|failures?)" \
          | while IFS= read -r line; do
              echo "::error title=Test Failure::${line}"
            done || true

    - name: Dump failed test ctest output
      if: failure()
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        {
          echo "## Failed Test Details"
          # shellcheck disable=SC2086
          for pkg in ${PACKAGES}; do
            if [ -d "build/${pkg}" ]; then
              echo "### ${pkg}"
              echo '```'
              ( cd "build/${pkg}" && ctest --output-on-failure --no-tests=ignore 2>&1 | tail -200 ) || true
              echo '```'
            fi
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: colcon-test-logs-${{ inputs.artifact-suffix }}
        path: |
          log/latest_test/
          build/**/Testing/Temporary/LastTest.log
        if-no-files-found: warn
        retention-days: 7
