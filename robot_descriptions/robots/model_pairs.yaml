# MJCF ↔ URDF 비교 게이트의 대상 목록 (#392 acceptance criteria 5)
#
# `rtc_tools/test/test_real_model_pairs.py` 가 이 파일을 읽어 실제 모델 쌍에
# `compare_mjcf_urdf` 를 돌린다. 합성 픽스처 단위 테스트는 *툴의 로직*만
# 검증하므로, 이 게이트가 없으면 툴이 겨냥한 대상에 한 번도 발사되지 않는다.
#
# **왜 자동 탐지가 아니라 명시 목록인가** — 어떤 MJCF 가 어떤 URDF 와 짝인지는
# 그 자체가 판단이다. ur5e 는 `ur5e.xml` 과 `scene.xml` 두 MJCF 를 갖고
# (후자는 지면·조명을 더한 씬), `ur5e_assm_v1` 의 URDF 는 런타임 처리가 필요한
# xacro 라 직접 비교 대상이 아니다. 탐지로 추측하면 조용히 엉뚱한 쌍을 비교한다.
#
# 필드
#   mjcf / urdf   : `robots/` 기준 상대경로 (필수)
#   align_frames  : [<MJCF body|site|world>, <URDF link>] — 두 파일의 world
#                   frame 이 다를 때 물리적으로 같은 프레임을 선언
#   link_map      : `robots/` 기준 상대경로 — MJCF body ↔ URDF link 이름이
#                   엇갈릴 때. structured form 이면 `fuse:` 로 "MJCF 가 부모에
#                   접은 fixed joint 자식" 도 선언한다 (#412)
#   tip_frames    : [<MJCF body|site>, <URDF link>] — 마지막 관절 이후의
#                   오프셋(DH d6)은 축 직선에도 COM 에도 안 나타나므로 tool
#                   프레임을 직접 비교해야 잡힌다
#   expect_warnings: 정당한 warning 개수 (초과하면 실패)
#
# 선언이 필요 없는 쌍은 필드를 비워 둔다 — iiwa7·leap_hand 는 두 파일의
# world frame 과 링크 이름이 일치해 인자 없이 통과한다.

pairs:
  - name: ur5e
    mjcf: ur5e/mjcf/ur5e.xml
    urdf: ur5e/urdf/ur5e.urdf
    # MJCF world = UR "Base"(DH) 프레임, URDF world = REP-103 base_link.
    align_frames: [world, base]
    # MJCF body `base` 는 URDF `base` 가 아니라 `base_link_inertia` 다.
    link_map: ur5e/ur5e.link_map.yaml
    tip_frames: [attachment_site, tool0]
    # MJCF 가 링크당 visual mesh 를 쪼개고(20 vs 14) collision 을 capsule 로
    # 따로 둔다(29 vs 14) — 정당한 차이라 warning 으로 남긴다.
    expect_warnings: 2

  - name: iiwa7
    mjcf: iiwa7/mjcf/iiwa7.xml
    urdf: iiwa7/urdf/iiwa7.urdf
    # MJCF 가 mesh asset 을 쪼갠다 (URDF distinct 8 vs MJCF nmesh 16) — ur5e 와
    # 같은 부류의 정당한 차이다. 2026-08-16 에 실행해 warning 본문으로 확인했다.
    expect_warnings: 1

  - name: leap_hand_left
    mjcf: leap_hand/mjcf/leap_hand_left.xml
    urdf: leap_hand/urdf/leap_hand_left.urdf
    expect_warnings: 0

  - name: leap_hand_right
    mjcf: leap_hand/mjcf/leap_hand_right.xml
    urdf: leap_hand/urdf/leap_hand_right.urdf
    expect_warnings: 0

  # 팔+손 조합 모델. 부착 오프셋이 검사 대상에 들어오는 유일한 쌍들이다 —
  # 단독 모델만 게이트에 있으면 두 모델이 각각 맞으면서 결합부만 틀린 상태가
  # 통과한다.
  - name: iiwa7_with_leap_left
    mjcf: iiwa7_leap/mjcf/iiwa7_with_leap_left.xml
    urdf: iiwa7_leap/urdf/iiwa7_with_leap_left.urdf.xacro
    # 단독 iiwa7 과 같은 mesh asset count 차이 하나뿐 (19 vs 27). 2026-08-16 확인.
    expect_warnings: 1

  - name: iiwa7_with_leap_right
    mjcf: iiwa7_leap/mjcf/iiwa7_with_leap_right.xml
    urdf: iiwa7_leap/urdf/iiwa7_with_leap_right.urdf.xacro
    # 좌수와 동일 (18 vs 26). 2026-08-16 확인.
    expect_warnings: 1

  - name: assm_v1_hand
    mjcf: assm_v1/mjcf/hand.xml
    urdf: assm_v1/urdf/hand.urdf.xacro
    # MJCF body `hand_base` 는 URDF `hand_base_link`, 손끝 4개는 부모 distal 에
    # 접혀 있다 (#412 · #413).
    link_map: assm_v1/assm_v1.link_map.yaml
    # URDF 가 visual+collision 을 따로 두는데 MJCF 는 geom 하나씩(30 vs 15),
    # palm 의 URDF 관성이 등방 placeholder — 둘 다 정당한 차이라 warning.
    #
    # **placeholder 를 안 고치는 것은 의도적이다 (#413).** `hand_base_link` 는
    # `diag(1e-4, 1e-4, 1e-4)` 인데 균질 박스 계산값은
    # `diag(2.66e-4, 1.76e-4, 4.10e-4)` 다. 고치려면 SSoT 인 URDF 를 건드려야 하고
    # 다른 링크도 같은 상태일 가능성이 높은데, **어느 링크까지 물리값으로 갈지는
    # 실기 측정 없이는 확정할 수 없다.** 그동안 정보를 잃지는 않는다 — 툴의
    # plausibility warning 이 실행마다 이 링크를 이름으로 지목한다. 즉
    # `compare_mjcf_urdf` 의 *일치* 검사와 이것은 다른 축이다: 두 파일을
    # 일치시켜도 양쪽이 함께 틀릴 수 있고 여기가 그 상태다.
    expect_warnings: 2

  - name: ur5e_assm_v1
    mjcf: ur5e_assm_v1/mjcf/ur5e_with_hand.xml
    urdf: ur5e_assm_v1/urdf/ur5e_with_hand.urdf.xacro
    align_frames: [world, base]
    link_map: ur5e_assm_v1/ur5e_assm_v1.link_map.yaml
    tip_frames: [attachment_site, tool0]
    # MJCF 가 visual mesh 를 쪼개고(20 vs 14), palm placeholder 관성
    # (왜 안 고치는지는 위 assm_v1_hand 주석).
    expect_warnings: 2
