# Loop closures of g1_with_p1b_surrogate_fixed_base.urdf.xacro (the synthetic
# test hand on the G1's right wrist). Every loop is a point-on-point (contact_3d) pin of a planar four-bar,
# so each has rank 2 of its 3 rows; the frames coincide at q = 0.
name: g1_with_p1b_surrogate_fixed_base

closures:
  - name: index_tip_loop
    type: contact_3d
    frame_1: l_index_tip_constraint_ab
    frame_2: l_index_tip_constraint_ba
    reference_frame: LOCAL
    baumgarte: { Kp: 20.0, Kd: 5.0 }

  - name: ring_pip_loop
    type: contact_3d
    frame_1: l_ring_pip_b_constraint_ab
    frame_2: l_ring_pip_b_constraint_ba
    reference_frame: LOCAL
    baumgarte: { Kp: 20.0, Kd: 5.0 }

  - name: ring_tip_loop
    type: contact_3d
    frame_1: l_ring_tip_constraint_ab
    frame_2: l_ring_tip_constraint_ba
    reference_frame: LOCAL
    baumgarte: { Kp: 20.0, Kd: 5.0 }

  - name: thumb_tip_loop
    type: contact_3d
    frame_1: l_thumb_tip_constraint_ab
    frame_2: l_thumb_tip_constraint_ba
    reference_frame: LOCAL
    baumgarte: { Kp: 20.0, Kd: 5.0 }

  - name: middle_tip_loop
    type: contact_3d
    frame_1: l_middle_tip_constraint_ab
    frame_2: l_middle_tip_constraint_ba
    reference_frame: LOCAL
    baumgarte: { Kp: 20.0, Kd: 5.0 }

actuation:
  actuated_joints:
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
    - thumb_cmc_aa_joint
    - thumb_cmc_fe_joint
    - thumb_mcp_joint
    - thumb_dip_fe_joint
    - index_mcp_aa_joint
    - index_mcp_fe_joint
    - index_dip_fe_joint
    - middle_mcp_fe_joint
    - middle_dip_fe_joint
    - ring_mcp_fe_joint

joint_substitutions: []
