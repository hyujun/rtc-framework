# RTC thread / CPU layout manifest — the SINGLE source of truth (issue #153 M1).
#
# Every executable encoding of "which role sits on which slot at which policy"
# is GENERATED from this file. Before M1 the same table was re-encoded by hand
# in six places (C++ tier constants + SelectThreadConfigs, three rt_common.sh
# helpers, verify_rt_runtime.sh::build_expected_threads, and the Python launch
# mirror); five of them had no direct unit test, so a tier edit could land in
# one encoding and silently skip the others.
#
#   generator : repo_scripts/scripts/gen_thread_layout.py
#   check     : python3 repo_scripts/scripts/gen_thread_layout.py --check
#   write     : python3 repo_scripts/scripts/gen_thread_layout.py --write
#
# Generated artifacts are CHECKED IN — install.sh sources the shell helpers
# *before* the workspace is built, so build-time generation would break
# bootstrap. `--check` is the drift gate (CI + colcon test).
#
# ── What this file does NOT own ─────────────────────────────────────────────
# `cpu_core` here is a *slot index*, never a kernel logical CPU id. The
# slot -> logical translation (SlotToLogicalCpu / slot_to_logical_cpu /
# PHYSICAL_CORE_SLOTS) is a separate concern owned by the #151/#152/#163 layer
# and is deliberately out of scope. `-1` is the "do not pin" sentinel.
#
# ── Editing ─────────────────────────────────────────────────────────────────
# Changing a value here changes the runtime layout on every tier. That is an
# E-7 (thread model) decision, not a refactor — see CLAUDE.md §6. After any
# edit run the generator with --write and commit the regenerated artifacts in
# the same commit.
#
# ── v5: slot 2 is the aux slot (issue #349) ─────────────────────────────────
# Up to v4.1 the three CFS lanes (nrt_logging / nrt_callback / nrt_publish) each
# owned a slot of their own on tiers >= 8. Slot 2 already hosts rt_callback
# (FIFO 70) plus the co-pinned DDS receive threads, and NUC13 12-core telemetry
# put that slot at ~1.5% duty while the three nrt lanes together drew ~5.6%
# (/proc/<tid>/stat differencing — the CSV timing scopes read ~6x low because
# they cover only the callback body, not rmw_wait/take/deserialize).
#
# v5 folds all three onto slot 2, so the shield shrinks to the RT cluster and
# the nrt slots return to the system cpuset (NUC13: "2-9,12-13" -> "2-9";
# #380 then reclaimed the mpc_worker slots, taking it to "2-7").
# SCHED_FIFO preempts SCHED_OTHER unconditionally, so rt_callback keeps its
# latency contract; the residual risk is cache pollution and DDS-side (CFS)
# delay, which the on-robot AC watches via the drop counters, not via t_total.
#
# Tier 4 is deliberately NOT folded: its nrt lanes already share the OS slot, so
# moving them to slot 2 would return no core while loading the most constrained
# tier's RT slot. "Fold" only pays where it hands a slot back.

# ── v6: the drivers move down into the reclaimed slots (issue #383) ─────────
# #380 removed the mpc_worker frames, which had reserved slot 4 on the 10-core
# tier and slots 4-5 on 12 and above. It left arm/hand where they were, calling
# the shift a separate placement decision (D3) rather than part of reclaiming a
# dead slot. v6 is that decision: arm_driver -> 4 and hand_driver -> 5 on every
# tier from 8 up, which is where the 8-core tier already had them.
#
# This restores one rule instead of inventing one: OS slot 0, RT cluster 1-3,
# drivers on the lowest free slots above it (alphabetical, so arm < hand), and
# everything above that is spare. The tier axis then goes flat -- nothing moves
# between 8 and 16 any more, where before both drivers shifted at 8->10 and
# again at 10->12 -- and the spare region becomes one contiguous block from 6 up
# instead of a {4,5} hole plus a tail.
#
# What this does NOT touch, measured rather than assumed (issue #383):
#   * the cset shield and GRUB nohz_full/rcu_nocbs. get_cm_shield_cpus is
#     RT u nrt - OS and excludes the drivers by construction (see rt_common.sh);
#     get_rt_cores_with_siblings is RT-only; the IRQ mask is OS-only. A full
#     tier x profile sweep of all five derived values is byte-identical.
#   * the core *class* on the primary target. On NUC13 (4P+8E, HT on) the
#     drivers go from logical 10,11 to 8,9 -- still E-cores, still the same
#     L2 module, still outside the shield. That neutrality is a property of
#     4P+8E, not of the change: a topology whose P/E boundary falls between
#     slots 4 and 7 would move hand_driver across it.
#
# Side effect worth knowing about: test_thread_layout_tiers.cpp skips any tier
# whose highest slot the running host cannot represent, and that highest slot is
# hand_driver's. Dropping it from 7 to 5 lets a 6-core box validate every tier
# instead of only 4/6/8.

layout_version: "v6"

# Slot reserved for OS / DDS / NIC IRQ. Never shielded, never a pin target for
# user-space RT threads (v4.1: the RT cluster starts at slot 1).
os_slot: 0

# ── Roles ───────────────────────────────────────────────────────────────────
# Declaration order here IS the emission order: C++ constants within a tier,
# and the verifier's expected-thread table. Do not reorder casually — the C++
# ordering convention is documented in rtc_base/README.md (priority descending,
# alphabetical tie-break).
#
#   key                 manifest/shell/Python identifier
#   thread_name         pthread_setname_np name (max 15 chars) == C++ .name
#   cpp_symbol          k<cpp_symbol><tier suffix>  (e.g. kRtControlConfig8Core)
#   kind                thread  = ApplyThreadConfig target inside the controller
#                       process = external process pin applied by launch taskset
#                       mpc     = the MpcThreadConfig aggregate
#   in_controller_process  appears in verify_rt_runtime.sh's expected table
#   map_note            annotation appended to the generated core-map comment
#
# There was a `verifier_optional` field ("missing thread => SKIP instead of
# WARN"). Its only producer was mpc_worker_*, whose threads applied a config
# and exited, and it went with those slots in #380 -- generator reader and the
# verifier's 5th expected-table field included. Every row is required now. A
# future role that may legitimately be absent needs the field re-implemented,
# not just re-declared here, plus the reason it may be absent recorded below.
roles:
  - key: rt_control
    thread_name: rt_control
    cpp_symbol: RtControlConfig
    kind: thread
    in_controller_process: true

  - key: rt_callback
    thread_name: rt_callback
    cpp_symbol: RtCallbackConfig
    kind: thread
    in_controller_process: true
    map_note: "DDS recv co-pin (CFS) via launch taskset"

  - key: mpc
    cpp_symbol: MpcConfig
    kind: mpc
    # Single thread. A worker sub-role existed until #380: its jthreads applied
    # a ThreadConfig and returned immediately, so nothing ever ran on the two
    # slots they reserved, and no solver could have used them either — Aligator
    # parallelises through OpenMP, which owns and spawns its own threads and
    # takes no external handles. Reintroducing parallel MPC means pinning that
    # OpenMP pool, not handing out std::jthread.
    #
    # `kind: mpc` therefore wraps a single sub-role. That is deliberate, not
    # leftover: #382 costed the collapse (this axis, cpp_suffix_mpc, 8 branches
    # in gen_thread_layout.py, 6 non-test C++ consumers) and kept it. The
    # reasoning lives above `struct MpcThreadConfig` in
    # rtc_base/include/rtc_base/threading/thread_config.hpp; reopen #382 rather
    # than collapsing this axis here.
    main:
      key: mpc_main
      thread_name: mpc_main
      in_controller_process: true

  - key: arm_driver
    thread_name: arm_driver
    cpp_symbol: ArmDriverConfig
    kind: process
    in_controller_process: false
    map_note: "external process; CM cpu_affinity param (#343)"

  - key: hand_driver
    thread_name: hand_driver
    cpp_symbol: HandDriverConfig
    kind: process
    in_controller_process: false
    map_note: "external process; in-process self-pin (#345)"

  - key: nrt_callback
    thread_name: nrt_callback
    cpp_symbol: NrtCallbackConfig
    kind: thread
    in_controller_process: true

  - key: nrt_publish
    thread_name: nrt_publish
    cpp_symbol: NrtPublishConfig
    kind: thread
    in_controller_process: true
    map_note: "controller-owned publish jthread; shares the nrt_callback slot"

  - key: nrt_logging
    thread_name: nrt_logging
    cpp_symbol: NrtLoggingConfig
    kind: thread
    in_controller_process: true

  - key: sim_thread
    thread_name: sim_thread
    cpp_symbol: SimThreadConfig
    kind: process
    in_controller_process: false

  - key: viewer
    thread_name: viewer
    cpp_symbol: ViewerConfig
    kind: process
    in_controller_process: false

# ── Launch profiles (issue #350) ────────────────────────────────────────────
# A profile is the SECOND axis of the layout: the tier says *where* every role
# sits, the profile says *which roles run at all* on this launch. It exists
# because MPC activation is not a host property — `mpc.enabled` lives in the
# controller YAML and the thread is spawned in on_activate, so a session can
# turn it on by switching controllers. Nothing can detect that from the host,
# hence an explicit launch-level opt-out.
#
# Dropping a role removes it from the RT core set (so the cset shield hands
# those cores back to the system cpuset), from the verifier's expected table,
# and adds it to the verifier's *forbidden* list — a thread that must not exist
# is a FAIL, not a missing row, otherwise "MPC is off" and "MPC is running on an
# unshielded core" look identical to the verifier.
#
# What a profile does NOT touch: the tier table itself. Every role keeps its
# slot, policy and priority on every tier, so the C++ constants, the Python
# launch mirror and SelectThreadConfigs() are profile-independent and stay
# byte-identical to the pre-#350 artifacts. The C++ side already gates the
# actual spawn on `mpc_enabled_` (DemoWbcController::SpawnMpcThreadIfNeeded);
# the profile is what makes the *reservation* follow that decision.
#
# GRUB (nohz_full / rcu_nocbs, setup_grub_rt.sh) deliberately ignores profiles:
# those are boot-static kernel parameters and a profile switch must not require
# a reboot, so they keep marking the widest (default-profile) RT set. Leaving a
# core marked nohz_full while CFS runs on it is not free — the scheduler tick
# resumes for multiple runnable tasks and RCU/housekeeping work is offloaded —
# but it is correct, which a per-profile GRUB entry would not be at the moment
# the two disagree.
#
#   id       profile identifier used by the shell helpers and the launch args
#   default  the profile assumed when no caller says otherwise (exactly one)
#   drops    role keys that do not run under this profile
profiles:
  - id: mpc_on
    default: true
    label: "MPC enabled — the historical layout, MPC cores reserved"
    drops: []

  - id: mpc_off
    label: "MPC disabled — MPC cores return to the system cpuset"
    drops:
      - mpc

# Emission order of verify_rt_runtime.sh's expected-thread table. Only roles
# with in_controller_process: true may appear — arm/hand/sim/viewer are external
# processes discovered by PID, and listing them here always false-WARNed (#353).
# Rows for roles a profile drops are emitted under that profile's *forbidden*
# table instead.
verifier_order:
  - rt_control
  - rt_callback
  - mpc_main
  - nrt_logging
  - nrt_callback
  # Same slot as nrt_callback, separate row on purpose: the verifier stores one
  # TID per name, so while both threads answered to "nrt_callback" it checked
  # only whichever it walked last and the other's policy/affinity went
  # unverified (#349 D15).
  - nrt_publish

# ── Markdown rendering ──────────────────────────────────────────────────────
# Decoration only. Every *number* in a generated table is derived from the tier
# data above; these strings carry the footnote markers whose prose lives in the
# hand-written text below each generated block.
doc:
  unpinned_cell: "-1³"
  tier_header_suffixes:
    4: "¹"
    6: "²"
  role_label_suffixes:
    arm_driver: "⁴"
  cell_suffixes:
    "4|mpc_main": " (CFS¹)"

# ── Tiers ───────────────────────────────────────────────────────────────────
# Listed in ASCENDING min_cores (C++ emission order). Dispatch selects the
# highest tier whose min_cores <= physical core count; below the lowest
# min_cores the first tier is the fallback.
#
#   cpp_suffix       k<cpp_symbol><cpp_suffix>
#   cpp_suffix_mpc   override for kMpcConfig* only. The 6-core tier is a
#                    historical irregularity: every other symbol is unsuffixed
#                    there (kRtControlConfig) but the MPC aggregate is
#                    kMpcConfig6Core. Preserved verbatim — those symbols are
#                    referenced by rtc_base/test/test_mpc_thread_config.cpp.
#   notes            free prose emitted under the generated core map
#
# policy: FIFO | RR | OTHER.  priority: 1-99 for FIFO/RR, 0 otherwise.
# nice: -20..19, honoured only for OTHER.  slot: -1 = do not pin.
tiers:
  - id: 4
    min_cores: 1
    label: "4-core fallback"
    cpp_suffix: "4Core"
    notes:
      - "degraded — no deterministic RT guarantee."
      - "Only 4 slots exist, so nrt_* and both driver processes collapse onto"
      - "the OS slot and mpc_main is demoted to CFS."
    roles:
      rt_control:   {slot: 1,  policy: FIFO,  priority: 90, nice: 0}
      rt_callback:  {slot: 2,  policy: FIFO,  priority: 70, nice: 0}
      mpc_main:     {slot: 3,  policy: OTHER, priority: 0,  nice: -5}
      arm_driver:   {slot: 0,  policy: OTHER, priority: 0,  nice: 0}
      hand_driver:  {slot: 0,  policy: OTHER, priority: 0,  nice: 0}
      nrt_callback: {slot: 0,  policy: OTHER, priority: 0,  nice: 0}
      nrt_publish:  {slot: 0,   policy: OTHER, priority: 0,  nice: 0}
      nrt_logging:  {slot: 0,  policy: OTHER, priority: 0,  nice: -5}
      sim_thread:   {slot: -1, policy: OTHER, priority: 0,  nice: 0}
      viewer:       {slot: -1, policy: OTHER, priority: 0,  nice: 0}

  - id: 6
    min_cores: 6
    label: "6-core"
    cpp_suffix: ""
    cpp_suffix_mpc: "6Core"
    notes:
      - "degraded mode — no deterministic RT guarantee."
      - "Trade-off: arm/hand share one slot."
    roles:
      rt_control:   {slot: 1,  policy: FIFO,  priority: 90, nice: 0}
      rt_callback:  {slot: 2,  policy: FIFO,  priority: 70, nice: 0}
      mpc_main:     {slot: 3,  policy: FIFO,  priority: 60, nice: 0}
      arm_driver:   {slot: 4,  policy: OTHER, priority: 0,  nice: 0}
      hand_driver:  {slot: 4,  policy: OTHER, priority: 0,  nice: 0}
      nrt_callback: {slot: 2,  policy: OTHER, priority: 0,  nice: 0}
      nrt_publish:  {slot: 2,   policy: OTHER, priority: 0,  nice: 0}
      nrt_logging:  {slot: 2,  policy: OTHER, priority: 0,  nice: -5}
      sim_thread:   {slot: -1, policy: OTHER, priority: 0,  nice: 0}
      viewer:       {slot: -1, policy: OTHER, priority: 0,  nice: 0}

  - id: 8
    min_cores: 8
    label: "8-core"
    cpp_suffix: "8Core"
    notes:
      - "First tier where arm_driver and hand_driver get dedicated slots."
      - "Slots 4-5. Every tier above uses the same pair since v6 (#383), so"
      - "this is where the driver placement stops depending on the tier."
    roles:
      rt_control:   {slot: 1,  policy: FIFO,  priority: 90, nice: 0}
      rt_callback:  {slot: 2,  policy: FIFO,  priority: 70, nice: 0}
      mpc_main:     {slot: 3,  policy: FIFO,  priority: 60, nice: 0}
      arm_driver:   {slot: 4,  policy: OTHER, priority: 0,  nice: 0}
      hand_driver:  {slot: 5,  policy: OTHER, priority: 0,  nice: 0}
      nrt_callback: {slot: 2,  policy: OTHER, priority: 0,  nice: 0}
      nrt_publish:  {slot: 2,   policy: OTHER, priority: 0,  nice: 0}
      nrt_logging:  {slot: 2,  policy: OTHER, priority: 0,  nice: -5}
      sim_thread:   {slot: -1, policy: OTHER, priority: 0,  nice: 0}
      viewer:       {slot: -1, policy: OTHER, priority: 0,  nice: 0}

  - id: 10
    min_cores: 10
    label: "10-core"
    cpp_suffix: "10Core"
    notes:
      - "Slot 4 held mpc_worker_0 until #380 and stood empty until #383, which"
      - "made the placement decision #380 deferred: arm/hand move down into it."
      - "Same pair as every tier from 8 up; slots 6+ are spare."
    roles:
      rt_control:   {slot: 1,  policy: FIFO,  priority: 90, nice: 0}
      rt_callback:  {slot: 2,  policy: FIFO,  priority: 70, nice: 0}
      mpc_main:     {slot: 3,  policy: FIFO,  priority: 60, nice: 0}
      arm_driver:   {slot: 4,  policy: OTHER, priority: 0,  nice: 0}
      hand_driver:  {slot: 5,  policy: OTHER, priority: 0,  nice: 0}
      nrt_callback: {slot: 2,  policy: OTHER, priority: 0,  nice: 0}
      nrt_publish:  {slot: 2,   policy: OTHER, priority: 0,  nice: 0}
      nrt_logging:  {slot: 2,  policy: OTHER, priority: 0,  nice: -5}
      sim_thread:   {slot: -1, policy: OTHER, priority: 0,  nice: 0}
      viewer:       {slot: -1, policy: OTHER, priority: 0,  nice: 0}

  - id: 12
    min_cores: 12
    label: "12-core (primary target)"
    cpp_suffix: "12Core"
    notes:
      - "Primary deployment tier."
      - "Slots 4-5 held mpc_worker_0/1 until #380 and are now the driver pair"
      - "(#383). On NUC13 (4P+8E, HT on) that is logical 8,9 — E-cores in the"
      - "same L2 module as the 10,11 they replace, and outside the shield."
    roles:
      rt_control:   {slot: 1,  policy: FIFO,  priority: 90, nice: 0}
      rt_callback:  {slot: 2,  policy: FIFO,  priority: 70, nice: 0}
      mpc_main:     {slot: 3,  policy: FIFO,  priority: 60, nice: 0}
      arm_driver:   {slot: 4,  policy: OTHER, priority: 0,  nice: 0}
      hand_driver:  {slot: 5,  policy: OTHER, priority: 0,  nice: 0}
      nrt_callback: {slot: 2,  policy: OTHER, priority: 0,  nice: 0}
      nrt_publish:  {slot: 2,   policy: OTHER, priority: 0,  nice: 0}
      nrt_logging:  {slot: 2,  policy: OTHER, priority: 0,  nice: -5}
      sim_thread:   {slot: -1, policy: OTHER, priority: 0,  nice: 0}
      viewer:       {slot: -1, policy: OTHER, priority: 0,  nice: 0}

  - id: 14
    min_cores: 14
    label: "14-core"
    cpp_suffix: "14Core"
    notes:
      - "Same assignment as the 12-core tier; slots 6+ stay free."
    roles:
      rt_control:   {slot: 1,  policy: FIFO,  priority: 90, nice: 0}
      rt_callback:  {slot: 2,  policy: FIFO,  priority: 70, nice: 0}
      mpc_main:     {slot: 3,  policy: FIFO,  priority: 60, nice: 0}
      arm_driver:   {slot: 4,  policy: OTHER, priority: 0,  nice: 0}
      hand_driver:  {slot: 5,  policy: OTHER, priority: 0,  nice: 0}
      nrt_callback: {slot: 2,  policy: OTHER, priority: 0,  nice: 0}
      nrt_publish:  {slot: 2,   policy: OTHER, priority: 0,  nice: 0}
      nrt_logging:  {slot: 2,  policy: OTHER, priority: 0,  nice: -5}
      sim_thread:   {slot: -1, policy: OTHER, priority: 0,  nice: 0}
      viewer:       {slot: -1, policy: OTHER, priority: 0,  nice: 0}

  - id: 16
    min_cores: 16
    label: "16-core"
    cpp_suffix: "16Core"
    notes:
      - "Highest tier — 16+ core machines all use this assignment."
      - "v4.1 removed the prior cset shield \"user\" on slots 4-8 for RT cluster"
      - "cache locality; v5 folded the nrt lanes onto slot 2 and v6 pulled the"
      - "drivers down to 4-5, so slots 6+ are one contiguous free block."
    roles:
      rt_control:   {slot: 1,  policy: FIFO,  priority: 90, nice: 0}
      rt_callback:  {slot: 2,  policy: FIFO,  priority: 70, nice: 0}
      mpc_main:     {slot: 3,  policy: FIFO,  priority: 60, nice: 0}
      arm_driver:   {slot: 4,  policy: OTHER, priority: 0,  nice: 0}
      hand_driver:  {slot: 5,  policy: OTHER, priority: 0,  nice: 0}
      nrt_callback: {slot: 2,  policy: OTHER, priority: 0,  nice: 0}
      nrt_publish:  {slot: 2,   policy: OTHER, priority: 0,  nice: 0}
      nrt_logging:  {slot: 2,  policy: OTHER, priority: 0,  nice: -5}
      sim_thread:   {slot: -1, policy: OTHER, priority: 0,  nice: 0}
      viewer:       {slot: -1, policy: OTHER, priority: 0,  nice: 0}

# ── Generated artifacts ─────────────────────────────────────────────────────
# Paths are repo-relative. Each is fully generated; hand edits are rejected by
# --check. The hand-written adapters that consume them (thread_config.hpp,
# rt_common.sh, thread_layout.py, verify_rt_runtime.sh) keep their prose and
# are NOT generated.
outputs:
  cpp: rtc_base/include/rtc_base/threading/thread_config_generated.hpp
  shell: repo_scripts/scripts/lib/thread_layout_generated.sh
  python: rtc_tools/rtc_tools/launch/thread_layout_generated.py

# Markdown tables regenerated in place between the marker pair
#   <!-- BEGIN GENERATED: <block> --> ... <!-- END GENERATED: <block> -->
# Docs that only mention core numbers in prose are NOT listed here; they stay
# hand-maintained under PROC-1.
doc_blocks:
  - file: rtc_base/README.md
    block: thread-layout-matrix
  - file: repo_scripts/README.md
    block: thread-layout-tiers
