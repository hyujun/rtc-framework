# Byte budgets for the README corpus -- validate_docs.py D14.
#
# One "path: bytes" entry per git-tracked file named exactly README.md. A README
# over its budget, a tracked README with no entry, and an entry whose README is
# gone all fail the docs gate (repo_scripts/scripts/validate_docs.py).
#
# A budget goes DOWN, in the change that shrinks its README. It does not go up
# to make room for an edit: a README is the front door for a human reader, and
# content that does not fit usually belongs in the document that owns it
# (docs/, agent_docs/, a header or hook comment, an issue, git log). When a
# section really was added and nothing can come out, the raise is stated on the
# entry's own line:
#
#     rtc_base/README.md: 20480  # raised from 20000: <why>
#
# The docs gate compares this file against the pull request's base and fails a
# raise that lacks that note (validate_docs.py --budget-base <rev>; before
# pushing: --budget-base origin/main).
#
# An entry may be followed by the word `strict`:
#
#     rtc_base/README.md: 20480 strict  # <comment>
#
# `strict` turns on the shape checks for that README (table cell and prose line
# length, file-tree width and depth, heading skeleton, no issue numbers in the
# body). A README is marked strict in the change that rewrites it to that shape;
# it does not go back.
#
# Keep the "path: bytes" shape, one per line: the validator reads this file by
# regex so that it runs on a host without PyYAML.

