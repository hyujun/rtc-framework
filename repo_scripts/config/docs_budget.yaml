# Byte budgets for the constitutional corpus -- validate_docs.py D12.
#
# One "path: bytes" entry per document an agent is told to treat as a rule
# source: the two constitutions, agent_docs/*.md and .claude/rules/*.md -- and
# one per .claude/skills/**.md, since a skill is loaded whole when invoked. A
# document over its budget, a corpus document with no entry, and an entry whose
# document is gone all fail the docs gate (repo_scripts/scripts/validate_docs.py).
#
# A budget goes DOWN, in the change that shrinks its document. It does not go up
# to make room for an edit: content that does not fit is usually not a rule, and
# belongs in the document that owns it (docs/, docs/reference/, a header or hook
# comment, an issue; a package README only for what its user runs or sets). A judgement an agent must apply IS a rule, though, and does not move
# out to save bytes -- docs/reference/ keeps the why of a rule, not the rule, and
# agents are not told to obey it (#851 moved such rules back). When a
# rule really was added and nothing can come out, the raise is stated on the
# entry's own line:
#
#     agent_docs/x.md: 9200  # raised from 9000: <why>
#
# The docs gate compares this file against the pull request's base and fails a
# raise that lacks that note (validate_docs.py --budget-base <rev>; before
# pushing: --budget-base origin/main).
#
# Keep the "path: bytes" shape, one per line: the validator reads this file by
# regex so that it runs on a host without PyYAML.

