# MuJoCo Simulator — TEMPLATE / EXAMPLE ONLY (NOT LOADED BY ANY LAUNCH)
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️  이 파일은 어떤 launch에도 로드되지 않습니다.
#
# 용도: 새 robot bringup 패키지를 만들 때 자신의 mujoco_simulator.yaml
#       (예: integrated_bringup/config/<robot>/mujoco_simulator.yaml) 의
#       시작점으로 쓰기 위한 robot-agnostic 키 목록 / 기본값 / 주석 reference.
#
# 실사용 파일:
#   - rtc_mujoco_sim/config/solver_param.yaml  ← 모든 sim launch가 항상 로드
#     (agnostic 기본값 + solver SSoT)
#   - integrated_bringup/config/<robot>/mujoco_simulator.yaml ← robot-specific
#     override (model_path, robot_response.*, servo gains 등)
#
# Required externally (no agnostic default):
#   model_path                       ← path to MJCF scene
#   robot_response.groups            ← list of actuator groups
#   robot_response.<group>.command_joint_names + topics
# ─────────────────────────────────────────────────────────────────────────────

mujoco_simulator:
  ros__parameters:
    # ── Sync timeout (controller command wait per step) ──────────────────────
    sync_timeout_ms: 50.0

    # ── Real-Time Factor (1.0 = real-time, 0.0 = unlimited) ──────────────────
    max_rtf: 1.0

    # ── Viewer ───────────────────────────────────────────────────────────────
    enable_viewer: true
    viewer_refresh_rate: 60.0  # Hz

    # ── Physics timestep ─────────────────────────────────────────────────────
    physics_timestep: 0.002  # seconds (control period)
    n_substeps: 3            # physics substeps per control cycle

    # ── Position servo gains (override per robot) ────────────────────────────
    use_yaml_servo_gains: false
    # servo_kp: [...]   # set per robot in robot-specific YAML
    # servo_kd: [...]

    # ── Control rate (used by physics_timestep validator) ────────────────────
    control_rate: 500.0  # Hz

    # ── Object pool (randomised object spawning) ─────────────────────────────
    # Attaches every object found under `directory` into the scene at load
    # time; the viewer's 'o' key then parks the current one and spawns another.
    # Disabled here: with `enabled: false` the compiled model is byte-for-byte
    # what it would be without this block.
    #
    # The four usual modes are the product of the two axes below:
    #   selection: fixed  + pose: fixed   -> same object, same pose
    #   selection: fixed  + pose: random  -> same object, random pose
    #   selection: random + pose: fixed   -> random object, same pose
    #   selection: random + pose: random  -> random object, random pose
    #
    # COST scales with the candidate count, because every candidate is compiled
    # into the scene. Measured (MuJoCo 3.7.0, ur5e scene, 500 Hz / n_substeps 3):
    #   off        0.014 ms/step
    #   1 object   0.037 ms/step
    #   57 objects 0.086 ms/step, +0.14 s compile, ~+0.5 GB RSS
    # Narrow the list with `objects:` when memory matters.
    object_pool:
      enabled: false

      # Directory holding one subdirectory per object, each with `object_file`.
      # "package://" is resolved through ament.
      # e.g. "package://robot_descriptions/object_sim"
      directory: ""

      # Allowlist of subdirectory names; unset = every object found. A name
      # that is not present is a startup error, never a silent skip.
      #
      # KEEP THIS KEY COMMENTED OUT to take the whole directory. Do NOT write
      # `objects: []`: a ROS 2 params YAML cannot express an empty sequence —
      # rcl_yaml_param_parser cannot infer the element type, so it yields
      # PARAMETER_NOT_SET and rclcpp throws InvalidParameterValueException
      # ("No parameter value set") while the *node is being constructed*,
      # before on_configure, so none of the pool's own validation is reached.
      # An absent key takes the declare_parameter default, which is already {}.
      # objects: ["apple", "banana", "coffeemug"]

      # Which object to use when selection is "fixed". Empty = first candidate
      # in sorted order.
      fixed_object: ""

      selection: "fixed"   # "fixed" | "random"  — which object
      pose: "fixed"        # "fixed" | "random"  — where it lands

      # Spawn pose. position is metres (world frame); rpy is ZYX Euler in
      # RADIANS (SI — CLAUDE.md §10; there is no degree spelling of these keys).
      # The *_variation entries are HALF-WIDTHS: each axis is drawn uniformly
      # from [centre - variation, centre + variation], and are ignored when
      # pose is "fixed". Yaw-only is the usual case: rpy_variation [0, 0, 3.14].
      position:           [0.0, 0.0, 0.2]
      position_variation: [0.0, 0.0, 0.0]
      rpy:                [0.0, 0.0, 0.0]
      rpy_variation:      [0.0, 0.0, 0.0]

      # Where inactive objects wait. Must be clear of the robot workspace and
      # below/away from the floor; it is compiled into qpos0, so it is also
      # where a reset (R) puts every object that is not active.
      park_position: [0.0, 0.0, -50.0]

      # 0 = seed from the OS (different every run). Non-zero = reproducible.
      seed: 0

      avoid_repeat: true    # never spawn the same object twice in a row
      spawn_on_start: true  # spawn once during on_configure

      # Layout of the object directory. Defaults match the object_sim
      # convention; override for a dataset that names things differently.
      object_file: "object.xml"
      body_name: "object"
      prefix: "pool_"       # keeps pool names clear of objects already in the scene

    # ── Object state publishing ──────────────────────────────────────────────
    # One tf2_msgs/TFMessage per sim tick carrying every object in the scene:
    # header.frame_id = `reference_body` (or `frame_id` when set),
    # child_frame_id = the MJCF body name, transform = its pose.
    #
    # WHICH BODIES. Every body with a freejoint, minus the object_pool
    # candidates that are currently parked. That is the whole rule — there is
    # no name list to keep in step with the scene. Robot links (hinge joints)
    # and static props such as a work table (no joint) never appear; a parked
    # pool candidate is in the compiled model but sits 50 m under the floor, so
    # publishing it would put a phantom object in the consumer's frame set. The
    # park test is re-evaluated every tick, so the viewer's 'o' key is reflected
    # immediately.
    #
    # NOT /tf. This is a plain topic carrying the TF message type, not a TF
    # broadcast: sim ground truth does not belong in the same tree a real robot
    # publishes. Point a re-broadcaster at it if RViz should see the frames.
    object_state:
      enabled: false

      # Relative names resolve under the node namespace.
      topic: "object_transforms"

      # MJCF body whose frame the poses are expressed in. Empty = the MuJoCo
      # world frame.
      #
      # SET THIS whenever the scene mounts its robot base with anything but the
      # identity — a 180 deg yaw on the base is common, and then world
      # coordinates put every object mirrored through the base. That is a
      # perfectly plausible-looking pose, so nothing downstream can catch it.
      # A name that is not in the model is a startup failure, not a fallback.
      reference_body: ""

      # header.frame_id to publish. Empty = the reference body's MJCF name
      # (or "world" when reference_body is empty). Override only when the MJCF
      # body name and the URDF link name for the same frame differ.
      frame_id: ""
