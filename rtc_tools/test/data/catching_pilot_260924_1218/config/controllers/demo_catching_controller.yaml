# Cut by make_fixture.py from ur5e_p1b/controllers/demo_catching_controller.yaml
demo_catching_controller:
  catching:
    core:
      ball:
        diameter: 0.067
        mass: 0.057
        restitution: 0.75
        provisional: true
  topics:
    ur5e:
      subscribe:
      - topic: ur5e/joint_goal
        role: target
    p1b:
      subscribe:
      - topic: p1b/joint_goal
        role: target
  logs:
  - msg_type: rtc_msgs/DeviceStateLog
    instance: ur5e_state
  - msg_type: rtc_msgs/DeviceStateLog
    instance: p1b_state
  - msg_type: integrated_bringup/CatchingDiagLog
    instance: catching_diag
