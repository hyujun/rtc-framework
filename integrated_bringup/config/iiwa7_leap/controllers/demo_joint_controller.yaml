# demo_joint_controller — iiwa7 + LEAP variant
# Pure joint-space trajectory tracking. Grasp controller deactivated via
# demo_shared.yaml (grasp_controller_type: "none"); hand stream is plain
# joint passthrough — no sensor / motor / grasp topics in/out.
demo_joint_controller:
  # ── Arm DoF (required) ─────────────────────────────────────────────────────
  # Authoritative arm joint count at LoadConfig time (#340). The length of
  # `estop.arm_safe_position` is validated against this key — not the reverse,
  # which is what used to make that cross-check vacuous.
  arm_dof: 7

  # ── Trajectory speed ───────────────────────────────────────────────────────
  robot_trajectory_speed: 0.78
  hand_trajectory_speed: 3.14

  # ── Trajectory velocity limits ─────────────────────────────────────────────
  robot_max_traj_velocity: 1.71  # iiwa7 A1/A2/A3 datasheet limit
  hand_max_traj_velocity: 6.28

  # ── FSM tuning (required by LoadConfig) ───────────────────────────────────
  fsm:
    contact_stop_release_eps: 0.005
    contact_stop_lpf_cutoff_hz: 20.0
    # Per-axis LPF on the fingertip force contact_stop thresholds. Higher cutoff
    # than the hold LPF above on purpose: the 4th-order Bessel's DC group delay
    # is ~2.11/(2*pi*fc), so 20 Hz would delay the freeze by ~17 ms out of the
    # 50 ms BT tick this latch covers; 50 Hz costs ~6.7 ms.
    contact_stop_force_lpf_cutoff_hz: 50.0

  # ── E-STOP ─────────────────────────────────────────────────────────────────
  estop:
    arm_safe_position:           # rad, 7 values (must equal arm_dof); iiwa7 home pose
      - 0.0
      - 0.7
      - 0.0
      - -1.4
      - 0.0
      - 0.7
      - 0.0

  # ── Output type ────────────────────────────────────────────────────────────
  command_type: "position"

  # ── Topic configuration ────────────────────────────────────────────────────
  # Phase 4: device-wire lanes (state / joint_command) moved to
  # devices.<group>.backend in sim.yaml/robot.yaml. Controller YAML keeps
  # target / robot_transforms.
  topics:
    iiwa7:
      subscribe:
        - topic: "iiwa7/joint_goal"
          role: "target"
      publish:
        # Per-controller TF (single publisher → entry on first group).
        - topic: "transforms"
          role: "robot_transforms"
    leap:
      subscribe:
        - topic: "leap/joint_goal"
          role: "target"

  # ── Controller-owned CSV logs ──────────────────────────────────────────────
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: iiwa7_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: leap_state
    - msg_type: integrated_bringup/PullEstimatorLog
      instance: pull_estimator

    # Per-tick Force-PI servo + stiffness-estimator diagnostics (#428).
    # Controller-private POD (no rtc_msgs) — see logging/grasp_diag_log_pod.hpp.
    # Registered only when demo_shared.yaml carries a `force_pi_grasp` block;
    # otherwise on_configure logs an INFO naming the absent file.
    - msg_type: integrated_bringup/GraspDiagLog
      instance: grasp_diag