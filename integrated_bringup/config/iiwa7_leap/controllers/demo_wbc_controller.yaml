# DemoWbcController — iiwa7 + LEAP variant
# TSID QP → Position integration with FSM. Four point-contact fingertips
# (thumb / index / middle / ring) declared to align with the MPC
# contact_frames schema; force/tactile sensing is still absent on this
# platform so ForceReferenceUpdater runs open-loop on f_des_default and
# object_frame.mass=0 keeps ObjectWrenchTask inert — the kinematic contact
# Jacobian + friction cone + object_se3 chain are exercised end-to-end.
# MPC disabled by default; enable via launch arg `enable_mpc:=true` after
# verifying TSID self-hold.
demo_wbc_controller:
  command_type: "position"

  # ── Trajectory speeds ──────────────────────────────────────────────────────
  arm_trajectory_speed: 0.5
  hand_trajectory_speed: 1.0
  arm_max_traj_velocity: 1.71
  hand_max_traj_velocity: 4.0

  # ── Topic routing ──────────────────────────────────────────────────────────
  # Phase 4: device-wire lanes (state / joint_command) moved to
  # devices.<group>.backend in sim.yaml/robot.yaml. Only controller-owned
  # lanes (target / robot_transforms / wbc_state) remain here.
  topics:
    iiwa7:
      subscribe:
        - topic: "iiwa7/joint_goal"
          role: "target"
          ownership: "controller"
      publish:
        - topic: "transforms"
          role: "robot_transforms"
          ownership: "controller"
    leap:
      subscribe:
        - topic: "leap/joint_goal"
          role: "target"
          ownership: "controller"
      # WbcState publisher is controller-owned and created in on_configure
      # (SetupWbcStatePublisher); it no longer has a YAML role mapping.

  # ── Controller-owned CSV logs ──────────────────────────────────────────────
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: iiwa7_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: leap_state

  # ── TSID QP configuration ─────────────────────────────────────────────────
  tsid:
    formulation_type: "wqp"

    wqp:
      solver:
        max_iter: 20
        eps_abs: 1.0e-6
        eps_rel: 0.0
        verbose: false

    tasks:
      posture:
        type: "posture"
        weight: 1.0
        priority: 0
        kp: 10.0
        kd: 6.0
      se3_tcp:
        type: "se3"
        # iiwa7 end-effector relative to its base.
        frame: "ee_link"
        base_frame: "link_0"
        mask: [1, 1, 1, 1, 1, 1]
        kp: [100, 100, 100, 50, 50, 50]
        kd: [20, 20, 20, 10, 10, 10]
        weight: 100.0
        priority: 0
      # Contact force tracking: active in closure/hold phases. LEAP has no
      # tactile sensing → ForceReferenceUpdater output stays at f_des_default
      # (open-loop), but the task still couples QP λ to the desired normal.
      force:
        type: "force"
        weight: 10.0
        priority: 1
      # Stage A-2: soft contact acceleration consistency — penalises
      # ‖J_c·a + dotJ_c·v‖². Activated in closure/hold; off during pre_grasp.
      contact_consistency:
        type: "contact_consistency"
        weight: 100.0
        priority: 1
      # Stage B-5: object-level tasks. With object_frame.mass=0 the
      # ObjectWrenchTask residual is zero (no-op); InternalForceTask uses
      # λ_squeeze_des ≡ 0 (rank-based nullity gate). ObjectSE3Task drives
      # the object pose through the kinematic chain of active contacts —
      # identity provider keeps the reference static for Stage B-5.
      object_wrench:
        type: "object_wrench"
        weight: 100.0
        priority: 1
      internal_force:
        type: "internal_force"
        weight: 50.0
        priority: 1
      object_se3:
        type: "object_se3"
        mask: [1, 1, 1, 1, 1, 1]
        kp: [100, 100, 100, 50, 50, 50]
        kd: [20, 20, 20, 10, 10, 10]
        weight: 50.0
        priority: 0

    constraints:
      eom:
        type: "eom"
      joint_limit:
        type: "joint_limit"
        dt: 0.002
        position_margin: 0.05
        velocity_margin: 0.1
      # Friction cone: linearised n-face pyramid per contact.
      friction_cone:
        type: "friction_cone"
        n_faces: 8
      # Stage A-1: actuator torque envelope τ = S(M·a + h - Jcᵀ·λ) bounded by
      # URDF effort_limit. tau_scale=1.0 → raw URDF bound (no margin).
      torque_limit:
        type: "torque_limit"
        tau_scale: 1.0

    # Stage A-3: per-contact PI on normal-force error. LEAP has no tactile
    # measurement so |f_meas|=0 and the integrator winds against f_des_default
    # until clamped at i_max — that's the intended open-loop fallback until a
    # sensing stack is added (see ForceReferenceUpdater defaults).
    force_pi:
      kp: 0.5
      ki: 2.0
      i_max: 2.0
      lambda_min: 0.0
      lambda_max: 20.0
      f_des_default: 2.0

    # Stage B-5: object frame seed. mass=0 keeps w_obj_des=0 → ObjectWrenchTask
    # is a no-op. Tune mass once a concrete grasp target / vision provider
    # arrives.
    object_frame:
      p_w: [0.0, 0.0, 0.0]
      mass: 0.0

    # Four LEAP fingertip point contacts (cdim=3 each). Order + frame names
    # match the MPC contact_frames schema (mpc/contact_light.yaml).
    contacts:
      - name: "thumb_tip"
        frame: "thumb_tip_head"
        type: "point"
        mu: 0.5
      - name: "index_tip"
        frame: "index_tip_head"
        type: "point"
        mu: 0.5
      - name: "middle_tip"
        frame: "middle_tip_head"
        type: "point"
        mu: 0.5
      - name: "ring_tip"
        frame: "ring_tip_head"
        type: "point"
        mu: 0.5

    phase_presets:
      pre_grasp:
        tasks:
          posture:   { active: true,  weight: 1.0,   priority: 0 }
          se3_tcp:   { active: true,  weight: 200.0, priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          torque_limit:  { active: true }

      closure:
        tasks:
          posture:             { active: true,  weight: 0.1,   priority: 0 }
          se3_tcp:             { active: true,  weight: 50.0,  priority: 0 }
          force:               { active: true,  weight: 10.0,  priority: 1 }
          contact_consistency: { active: true,  weight: 100.0, priority: 1 }
          object_wrench:       { active: true,  weight: 100.0, priority: 1 }
          internal_force:      { active: true,  weight: 50.0,  priority: 1 }
          object_se3:          { active: true,  weight: 50.0,  priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: true }
          torque_limit:  { active: true }

      hold:
        tasks:
          posture:             { active: true,  weight: 0.1,   priority: 0 }
          se3_tcp:             { active: true,  weight: 50.0,  priority: 0 }
          force:               { active: true,  weight: 20.0,  priority: 1 }
          contact_consistency: { active: true,  weight: 100.0, priority: 1 }
          object_wrench:       { active: true,  weight: 100.0, priority: 1 }
          internal_force:      { active: true,  weight: 50.0,  priority: 1 }
          object_se3:          { active: true,  weight: 50.0,  priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: true }
          torque_limit:  { active: true }

  # ── Integration safety ─────────────────────────────────────────────────────
  integration:
    position_margin: 0.02
    velocity_scale: 0.95
    force_rate_alpha: 0.1

  # ── FSM thresholds ─────────────────────────────────────────────────────────
  # Force/contact thresholds retained for schema compliance but the contact
  # detection edge will rarely fire without tactile sensing — FSM tends to
  # stay in pre_grasp on iiwa7+LEAP sim unless |λ| from QP solution crosses
  # force_contact_threshold via the friction cone bound.
  fsm:
    epsilon_approach: 0.01
    epsilon_pregrasp: 0.005
    force_contact_threshold: 0.2
    force_hold_threshold: 1.0
    min_contacts_for_hold: 2
    slip_rate_threshold: 5.0
    deformation_threshold: 0.015
    max_qp_fail_before_fallback: 5
    approach_speed: 0.5

  # ── E-STOP target ──────────────────────────────────────────────────────────
  estop:
    arm_safe_position:           # rad, 7 values = iiwa7 DoF (home pose)
      [0.0, 0.7, 0.0, -1.4, 0.0, 0.7, 0.0]

  # ── MPC integration ────────────────────────────────────────────────────────
  # Start with MPC disabled; flip via launch arg `enable_mpc:=true` once
  # TSID-only self-hold is verified. iiwa7_leap-specific MPC phase YAMLs:
  # base_frame=link_0, end_effector_frame=ee_link, 4 contact frames
  # (thumb/index/middle/ring), 23-vec q_posture_ref, 12-vec F_target.
  mpc:
    enabled: false
    engine: "handler"
    max_stale_solutions: 5
    target_frequency_hz: 10.0
    phase_config_path:  "config/iiwa7_leap/controllers/mpc/phase_config.yaml"
    contact_light_path: "config/iiwa7_leap/controllers/mpc/contact_light.yaml"
    contact_rich_path:  "config/iiwa7_leap/controllers/mpc/contact_rich.yaml"

    riccati:
      enabled: true
      gain_scale: 1.0
      accel_only: true
      max_delta_x_norm: 100.0
