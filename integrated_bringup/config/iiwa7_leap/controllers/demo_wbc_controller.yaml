# DemoWbcController — iiwa7 + LEAP variant
# TSID QP → Position integration with FSM. Four point-contact fingertips
# (thumb / index / middle / ring) declared to align with the MPC
# contact_frames schema; force/tactile sensing is still absent on this
# platform so ForceReferenceUpdater runs open-loop on f_des_default and
# object_frame.mass=0 keeps ObjectWrenchTask inert — the kinematic contact
# Jacobian + friction cone + object_se3 chain are exercised end-to-end.
# MPC disabled by default; enable via launch arg `enable_mpc:=true` after
# verifying TSID self-hold.
demo_wbc_controller:
  command_type: "position"

  # ── Trajectory speeds ──────────────────────────────────────────────────────
  arm_trajectory_speed: 0.5
  hand_trajectory_speed: 1.0
  arm_max_traj_velocity: 1.71
  hand_max_traj_velocity: 4.0

  # ── TCP SE3 trajectory (MPC-disabled SE3 ramp on phase entry) ────────────
  # Quintic rest-to-rest from current FK pose to tcp_goal_; mid-pose split
  # when ang_dist > π - pi_rotation_margin. Active only when MPC is disabled
  # and the new phase has se3_tcp.active=true in phase_presets.
  tcp_trajectory_speed: 0.1            # m/s, TCP translational
  tcp_trajectory_angular_speed: 0.5    # rad/s, TCP angular
  tcp_max_traj_velocity: 0.5           # m/s, quintic peak = 1.875·d/T
  tcp_max_traj_angular_velocity: 1.0   # rad/s, quintic peak
  pi_rotation_margin: 0.15             # rad, split threshold (π - margin)

  # ── Topic routing ──────────────────────────────────────────────────────────
  # Phase 4: device-wire lanes (state / joint_command) moved to
  # devices.<group>.backend in sim.yaml/robot.yaml. Only controller-owned
  # lanes (target / robot_transforms / wbc_state) remain here.
  topics:
    iiwa7:
      subscribe:
        - topic: "iiwa7/joint_goal"
          role: "target"
          ownership: "controller"
      publish:
        - topic: "transforms"
          role: "robot_transforms"
          ownership: "controller"
    leap:
      subscribe:
        - topic: "leap/joint_goal"
          role: "target"
          ownership: "controller"
      # WbcState publisher is controller-owned and created in on_configure
      # (SetupWbcStatePublisher); it no longer has a YAML role mapping.

  # ── Controller-owned CSV logs ──────────────────────────────────────────────
  # WBC arm/hand state use the WBC-specific superset channel (DeviceWbcLog):
  # adds TSID a_opt acceleration, SE3 trajectory (arm), fingertip force (hand).
  # wbc_diag is the per-tick TSID/QP solution (solve time, λ, convergence).
  # Path A — integrated_bringup-private POD channels, no rtc_msgs ABI change.
  logs:
    - msg_type: integrated_bringup/DeviceWbcLog
      instance: iiwa7_state
    - msg_type: integrated_bringup/DeviceWbcLog
      instance: leap_state
    - msg_type: integrated_bringup/WbcDiagLog
      instance: wbc_diag

  # ── TSID QP configuration ─────────────────────────────────────────────────
  tsid:
    formulation_type: "wqp"

    wqp:
      solver:
        max_iter: 20
        # Inner Newton iterations per outer step. ProxQP default (1500) lets an
        # infeasible QP grind ~0.5–1.4 s (fatal at 500 Hz); bound it so a bad
        # solve fails fast. This is the Dynamic (TSID) QP — a failure is
        # non-critical (hand τ_ff dropped that tick), not a kFallback.
        max_iter_in: 100
        eps_abs: 1.0e-6
        eps_rel: 0.0
        verbose: false

    tasks:
      posture:
        type: "posture"
        weight: 1.0
        priority: 0
        # PD gains split by body group, assembled per-DoF in
        # DemoWbcController::ApplyPostureGains via the joint reorder map (the
        # generic PostureTask stores gains in Pinocchio order, where arm/hand
        # are not contiguous — so the grouping is mapped controller-side,
        # keeping rtc_tsid robot-agnostic). Both groups critically damped
        # (ζ=1, Kd=2√Kp). ωn is set below each group's joint-position-controller
        # inner-loop dominant pole (servo kp/kd, see mujoco_simulator.yaml
        # robot_response.{iiwa7,leap}):
        #   arm  servo 3000/600 = 750/150 = 5 rad/s  → posture ωn=6 (matches se3_tcp)
        #   hand servo 2.5/0.125 → posture ωn=4. NOTE: the binding limit is not
        #   the kp/kd pole but the inner-servo damping kd_s, which is the s³
        #   coefficient of the carry-forward loop char. eq.
        #   (I·s⁴ + kd_s·s³ + kp_s·s² + kp_s·kd_p·s + kp_s·kp_p). The hand's tiny
        #   kd_s=0.125 barely damps the double-integrator phase lag, so ωn=7 self-
        #   excited a ~9 rad/s limit cycle under disturbance; ωn=4 restores margin.
        # The old single kp=1.0/kd=0.10 was ζ=0.05 (effectively undamped), which
        # made idle posture oscillate/diverge under external force. Falls back
        # to a scalar/vector `kp`/`kd` here if `arm`/`hand` are omitted.
        arm:
          kp: 36.0    # ωn=6 rad/s, ζ=1
          kd: 12.0
        hand:
          kp: 16.0    # ωn=4 rad/s, ζ=1 (lowered from ωn=7: weak hand servo
          kd: 8.0     # kd_s=0.125 can't damp the carry-forward double-integrator
                      # phase lag at ωn=7 → self-sustained ~9 rad/s limit cycle)
      se3_tcp:
        type: "se3"
        # SE3Task reads its identity from this `name` field (default "se3").
        # It MUST equal the YAML key — phase_presets, the per-tick SE3 reference
        # push (GetTask("se3_tcp")), and the se3_task_active_in_phase cache all
        # look the task up by "se3_tcp". Without it the task is named "se3",
        # GetTask("se3_tcp") returns null, so the task is never deactivated by a
        # preset and never receives a reference — it tracks identity and fights
        # every phase.
        name: "se3_tcp"
        # iiwa7 end-effector relative to its base.
        frame: "ee_link"
        base_frame: "link_0"
        mask: [1, 1, 1, 1, 1, 1]
        kp: [36, 36, 36, 16, 16, 16]
        kd: [12.5, 12.5, 12.5, 8.2, 8.2, 8.2]
        weight: 100.0
        priority: 0
      # Contact force tracking: active in closure/hold phases. LEAP has no
      # tactile sensing → ForceReferenceUpdater output stays at f_des_default
      # (open-loop), but the task still couples QP λ to the desired normal.
      force:
        type: "force"
        weight: 10.0
        priority: 1
      # Stage A-2: soft contact acceleration consistency — penalises
      # ‖J_c·a + dotJ_c·v‖². Activated in closure/hold; off during pre_grasp.
      contact_consistency:
        type: "contact_consistency"
        weight: 100.0
        priority: 1
      # Stage B-5: object-level tasks. With object_frame.mass=0 the
      # ObjectWrenchTask residual is zero (no-op); InternalForceTask uses
      # λ_squeeze_des ≡ 0 (rank-based nullity gate). ObjectSE3Task drives
      # the object pose through the kinematic chain of active contacts —
      # identity provider keeps the reference static for Stage B-5.
      object_wrench:
        type: "object_wrench"
        weight: 100.0
        priority: 1
      internal_force:
        type: "internal_force"
        weight: 50.0
        priority: 1
      object_se3:
        type: "object_se3"
        mask: [1, 1, 1, 1, 1, 1]
        kp: [50, 50, 50, 20, 20, 20]
        kd: [2.5, 2.5, 2.5, 1, 1, 1]
        weight: 50.0
        priority: 0

    constraints:
      eom:
        type: "eom"
      joint_limit:
        type: "joint_limit"
        dt: 0.002
        position_margin: 0.05
        velocity_margin: 0.1
      # Friction cone: linearised n-face pyramid per contact. Face count
      # (n_faces) and μ (mu) live per-contact under `contacts:` — this block
      # only toggles the constraint per phase preset (FrictionConeConstraint
      # reads no params; a stray `n_faces` here is ignored and WARN-flagged).
      friction_cone:
        type: "friction_cone"
      # Stage A-1: actuator torque envelope τ = S(M·a + h - Jcᵀ·λ) bounded by
      # URDF effort_limit. tau_scale=1.0 → raw URDF bound (no margin).
      torque_limit:
        type: "torque_limit"
        tau_scale: 1.0

    # Stage A-3: per-contact PI on normal-force error. LEAP has no tactile
    # measurement so |f_meas|=0 and the integrator winds against f_des_default
    # until clamped at i_max — that's the intended open-loop fallback until a
    # sensing stack is added (see ForceReferenceUpdater defaults).
    force_pi:
      kp: 0.5
      ki: 2.0
      i_max: 2.0
      lambda_min: 0.0
      lambda_max: 20.0
      f_des_default: 2.0

    # Stage B-5: object frame seed. mass=0 keeps w_obj_des=0 → ObjectWrenchTask
    # is a no-op. Tune mass once a concrete grasp target / vision provider
    # arrives.
    object_frame:
      p_w: [0.0, 0.0, 0.0]
      mass: 0.0

    # Four LEAP fingertip point contacts (cdim=3 each). Order + frame names
    # match the MPC contact_frames schema (mpc/contact_light.yaml).
    contacts:
      - name: "thumb_tip"
        frame: "thumb_tip_head"
        type: "point"
        mu: 0.5
        n_faces: 8
      - name: "index_tip"
        frame: "index_tip_head"
        type: "point"
        mu: 0.5
        n_faces: 8
      - name: "middle_tip"
        frame: "middle_tip_head"
        type: "point"
        mu: 0.5
        n_faces: 8
      - name: "ring_tip"
        frame: "ring_tip_head"
        type: "point"
        mu: 0.5
        n_faces: 8

    # ApplyPreset is reset-style (touches only tasks/constraints named in the
    # preset). Every phase preset must therefore list the full task and
    # constraint set so that transitions reliably deactivate prior tasks —
    # active=false toggles, not omission.
    phase_presets:
      # idle = pure joint-space hold (posture only; se3_tcp off, eom on). This
      # now takes effect: the se3_tcp `name` fix (above) lets the preset actually
      # deactivate the SE3 task, and DrainTargetSlot applies this preset on the
      # initial enable (kIdle's OnPhaseEnter does not fire without a transition
      # edge). SE3 hold resumes on the idle→approach edge (Se3TaskActiveInPhase).
      idle:
        tasks:
          posture:             { active: true,  weight: 1.0,   priority: 0 }
          se3_tcp:             { active: false, weight: 50.0,   priority: 0 }
          force:               { active: false, weight: 0.0,   priority: 1 }
          contact_consistency: { active: false, weight: 0.0,   priority: 1 }
          object_wrench:       { active: false, weight: 0.0,   priority: 1 }
          internal_force:      { active: false, weight: 0.0,   priority: 1 }
          object_se3:          { active: false, weight: 0.0,   priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: false }
          torque_limit:  { active: true }

      approach:
        tasks:
          posture:             { active: true,  weight: 1.0,   priority: 0 }
          se3_tcp:             { active: true,  weight: 200.0, priority: 0 }
          force:               { active: false, weight: 0.0,   priority: 1 }
          contact_consistency: { active: false, weight: 0.0,   priority: 1 }
          object_wrench:       { active: false, weight: 0.0,   priority: 1 }
          internal_force:      { active: false, weight: 0.0,   priority: 1 }
          object_se3:          { active: false, weight: 0.0,   priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: false }
          torque_limit:  { active: true }

      pre_grasp:
        tasks:
          posture:             { active: true,  weight: 1.0,   priority: 0 }
          se3_tcp:             { active: true,  weight: 200.0, priority: 0 }
          force:               { active: false, weight: 0.0,   priority: 1 }
          contact_consistency: { active: false, weight: 0.0,   priority: 1 }
          object_wrench:       { active: false, weight: 0.0,   priority: 1 }
          internal_force:      { active: false, weight: 0.0,   priority: 1 }
          object_se3:          { active: false, weight: 0.0,   priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: false }
          torque_limit:  { active: true }

      closure:
        tasks:
          posture:             { active: true,  weight: 0.1,   priority: 0 }
          se3_tcp:             { active: true,  weight: 50.0,  priority: 0 }
          force:               { active: true,  weight: 10.0,  priority: 1 }
          contact_consistency: { active: true,  weight: 100.0, priority: 1 }
          object_wrench:       { active: true,  weight: 100.0, priority: 1 }
          internal_force:      { active: true,  weight: 50.0,  priority: 1 }
          object_se3:          { active: true,  weight: 50.0,  priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: true }
          torque_limit:  { active: true }

      hold:
        tasks:
          posture:             { active: true,  weight: 0.1,   priority: 0 }
          se3_tcp:             { active: true,  weight: 50.0,  priority: 0 }
          force:               { active: true,  weight: 20.0,  priority: 1 }
          contact_consistency: { active: true,  weight: 100.0, priority: 1 }
          object_wrench:       { active: true,  weight: 100.0, priority: 1 }
          internal_force:      { active: true,  weight: 50.0,  priority: 1 }
          object_se3:          { active: true,  weight: 50.0,  priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: true }
          torque_limit:  { active: true }

      # Release: SE3 hold at current TCP, posture damping, contact-related
      # tasks deactivated. Contact activation_target ramps to 0 via
      # ContactState; friction_cone stays active during the brief ramp to
      # keep the in-progress contacts feasible.
      release:
        tasks:
          posture:             { active: true,  weight: 1.0,   priority: 0 }
          se3_tcp:             { active: true,  weight: 50.0,  priority: 0 }
          force:               { active: false, weight: 0.0,   priority: 1 }
          contact_consistency: { active: false, weight: 0.0,   priority: 1 }
          object_wrench:       { active: false, weight: 0.0,   priority: 1 }
          internal_force:      { active: false, weight: 0.0,   priority: 1 }
          object_se3:          { active: false, weight: 0.0,   priority: 0 }
        constraints:
          eom:           { active: true }
          joint_limit:   { active: true }
          friction_cone: { active: true }
          torque_limit:  { active: true }

  # ═══════════════════════════════════════════════════════════════════════════
  # Kinematic WBC — arm command path (CLIK primary + integrator fallback).
  # Implemented by ComputeKinematicWbc() in src/controllers/wbc/compute.cpp.
  # ═══════════════════════════════════════════════════════════════════════════

  # Command-limit margins + force-rate filter. position_margin/velocity_scale
  # set the CLIK-QP position/velocity box; force_rate_alpha is the df/dt EMA.
  integration:
    position_margin: 0.02
    velocity_scale: 0.95
    force_rate_alpha: 0.1

  # Kinematic WBC (CLIK-QP) — the sole position backbone. damping_sq/v_limit/w_*
  # are structural (fixed at clik_.Init()); kx_*/ka/kh are runtime ROS params.
  clik:
    damping_sq: 1.0e-4   # μ² of the damped right-inverse J♯ (structural, > 0)
    v_limit: 1.5         # per-joint |v_ref| clamp [rad/s] (≤ 0 → off)
    kx_pos: 5.0          # TCP position task gain (runtime; ROS param clik_kx_pos)
    kx_rot: 2.0          # TCP rotation task gain (runtime; ROS param clik_kx_rot)
    ka: 1.0              # arm nullspace posture gain (runtime; clik_ka)
    kh: 1.0              # hand posture gain (runtime; clik_kh)
    anchor_drift_max: 0.5  # rad; carry-forward anti-windup clamp on |q_ref−q_meas|
                           # per joint. q_ref integrates from the previous desired
                           # (re-anchored to measured on a new target / kIdle·kRelease
                           # entry); this bounds how far it may lead/lag the robot
                           # under tracking lag. ≤ 0 → disabled (pure carry-forward).

  # ═══════════════════════════════════════════════════════════════════════════
  # Dynamic WBC — hand feedforward-torque overlay (kPdFeedforward).
  # Model-based hand τ_ff on top of the Kinematic-WBC position backbone, active
  # only in closure/hold. Flat ROS params (live-tunable via ros2 param / GUI).
  # Implemented by ComputeDynamicWbc() in src/controllers/wbc/compute.cpp.
  # ═══════════════════════════════════════════════════════════════════════════
  hand_tauff_enable: false           # opt-in: drive hand via pd_feedforward
  hand_tauff_source: "gravity_comp"  # "gravity_comp" (g[nv]) | "tsid_tau" (QP τ)
  hand_tauff_gravity_gain: 1.0       # scale on the τ_ff source [-]
  hand_tauff_closure_bias: 0.0       # uniform additive τ bias [Nm]
  hand_tauff_max: 5.0                # per-joint |τ_ff| clamp [Nm]

  # ── FSM thresholds ─────────────────────────────────────────────────────────
  # Force/contact thresholds retained for schema compliance but the contact
  # detection edge will rarely fire without tactile sensing — FSM tends to
  # stay in pre_grasp on iiwa7+LEAP sim unless |λ| from QP solution crosses
  # force_contact_threshold via the friction cone bound.
  fsm:
    epsilon_approach: 0.01
    epsilon_pregrasp: 0.005
    force_contact_threshold: 0.2
    min_contacts_for_hold: 2
    slip_rate_threshold: 5.0
    deformation_threshold: 0.015
    # Consecutive Kinematic (CLIK) QP failures before kFallback. CLIK is the
    # position backbone, so its failure is critical; the Dynamic (TSID) QP fail
    # is non-critical (τ_ff drop only) and does not use this threshold.
    max_qp_fail_before_fallback: 5
    approach_speed: 0.5
    # kRelease stage 0: contact activation_target → 0 ramp duration before
    # finger-open trajectory starts (stage 1). Tune to balance object-drop
    # latency vs. contact-deactivation jerk.
    release_ramp_sec: 0.03

  # ── E-STOP target ──────────────────────────────────────────────────────────
  estop:
    arm_safe_position:           # rad, 7 values = iiwa7 DoF (home pose)
      [0.0, 0.7, 0.0, -1.4, 0.0, 0.7, 0.0]

  # ── MPC integration ────────────────────────────────────────────────────────
  # Start with MPC disabled; flip via launch arg `enable_mpc:=true` once
  # TSID-only self-hold is verified. iiwa7_leap-specific MPC phase YAMLs:
  # base_frame=link_0, end_effector_frame=ee_link, 4 contact frames
  # (thumb/index/middle/ring), 23-vec q_posture_ref, 12-vec F_target.
  mpc:
    enabled: false
    engine: "handler"
    max_stale_solutions: 5
    target_frequency_hz: 10.0
    phase_config_path:  "config/iiwa7_leap/controllers/mpc/phase_config.yaml"
    contact_light_path: "config/iiwa7_leap/controllers/mpc/contact_light.yaml"
    contact_rich_path:  "config/iiwa7_leap/controllers/mpc/contact_rich.yaml"

    riccati:
      enabled: true
      gain_scale: 1.0
      accel_only: true
      max_delta_x_norm: 100.0
