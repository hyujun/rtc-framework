# demo_catching_controller — the closed_form planner law (iiwa7_leap)
#
# A fragment of ../demo_catching_controller.yaml (its `include:` list). The CM
# merges it into that file's tree; every key keeps its full path.
#
# The law: the soft-catch reference (SoftCatchTranslation) up to t_c, then the
# constant-deceleration target (DecelTarget). Followed when
# `planner.segment.mode: closed_form` (the main file).
#
# The search ranks candidates by this law's rollout under every mode, on its
# own copy of these five values (planner.search.grid.reference.*,
# planner.search.grid.stop.a_dec in search_grid.yaml). Under closed_form the
# copy must equal what is written here, or the controller parks.
demo_catching_controller:
  catching:
    # ── Soft-catch reference (SoftCatchTranslation) ─────────────────────────────
    # See the ur5e_p1b profile for why the block is `provisional: true`.
    reference:
      provisional: true
      omega: 10.0
      zeta: 1.0
      # m/s. Derived for this robot (eta_v = 0.9).
      v_max: 1.8
      # m/s^2. Provisional. Measured torque-limited median 79, 35-36 under a
      # 10x rotor-inertia assumption; 35 is the conservative end.
      a_max: 35.0

    # ── Deceleration (DecelTarget) ──────────────────────────────────────────────
    # The closed_form DECEL target's constant deceleration. The search's
    # stopping-point reservation reads its own copy,
    # planner.search.grid.stop.a_dec. Requires a_dec <= reference.a_max.
    supervisor:
      decel:
        a_dec: 10.0
