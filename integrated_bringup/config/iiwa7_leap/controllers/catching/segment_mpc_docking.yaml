# demo_catching_controller — the mpc_docking segment planner (iiwa7_leap)
#
# A fragment of ../demo_catching_controller.yaml (its `include:` list). The CM
# merges it into that file's tree; every key keeps its full path.
#
# The segment planner that solves the docking problem per segment (MPC ·
# dual-arm plan E1-F13, #739; wired in E1-F16, #742): the RT follows its joint
# segments from APPROACH through the catch to the end of the stop. Read only
# when `planner.segment.mode: mpc_docking` (the main file). Every key here is
# under planner.segment.mpc_docking, and the planner reads its design values
# from here alone.
#
# PROVISIONAL, SIM ONLY. E1-F19 (#745) set, in sim, the chance rows (off),
# publish.slack_c_max, the stop grid and the SQP's tol_kkt and mu_max; the
# other values are starting values, not tuned. The QP solver allocates inside a solve (#654), so this planner must
# not run on a SCHED_FIFO planner thread on hardware until that is closed.
demo_catching_controller:
  catching:
    planner:
      segment:
        mpc_docking:
          # rho_max of the RT's segment-switch gate, per joint:
          # |dqd| + K_p |dq| <= rho_max (1 - eta_v) qd_max (MD-39).
          switch_margin: 1.0
          # The speed margin on the joint ratings: the cores' velocity box is
          # eta_v * qd_max and the RT's switch gate keeps (1 - eta_v) of the
          # rating as its headroom, so it must stay below 1. Under
          # planner.search.mode nlp the search's cores take the same margin.
          eta_v: 0.9
          # ── The grid ────────────────────────────────────────────────────────
          # A segment has up to n_pre_max intervals of dt_pre_s before the catch
          # node (one core per count) and the stop part after it; every segment
          # runs to the end of the stop. Under planner.search.mode nlp this
          # grid has to be the search's: dt_pre_s and the stop part equal,
          # planner.search.nlp.n_pre.max no more than n_pre_max (it is 5 there:
          # the search's window is shorter) — else it parks.
          approach:
            n_pre_max: 9
            dt_pre_s: 0.1
            # max |q_dot_cmd| that counts as "at rest" for a plan's first
            # segment [rad/s].
            rest_tol: 0.05
          # The stop part: 4 nodes of 0.0875 s in three move blocks — the 0.35 s
          # it had as 7 x 0.05 s (E1-F19 part 2, #745). A solve's time is QP time
          # and follows the node count, and the stop part was 7 of the nodes:
          # mapped offline on the D-2 tuning set with no deadline, a solve the
          # nlp search accepts needed 40.7 ms (median, 9 of the 12 throws the
          # set labels) with the values shipped before and 17.1 ms (8 of 12)
          # with this file's and the search's.
          # A coarser grid leaves more room between two nodes: a segment whose
          # joint speed passes the rating there is withheld (outcome `speed`).
          stop:
            n_nodes: 4
            dt_s: 0.0875
            blocks: [1, 1, 2]
          # A first segment's and a replan's budget [s] — also the core's
          # deadline. Nothing is published after the catch: the last segment
          # published before it carries the arm to rest.
          budget:
            first_s: 0.035
            replan_s: 0.025
          replan:
            # Re-solve at a grid point the followed segment already starts at.
            same_point: true
          # The corridor and the speed envelope are soft in the problem: the
          # largest slack a published segment may lean on — the corridor's in
          # [m], the envelope's in the units of its row (c^2, [m^2/s^2]).
          # slack_c_max (E1-F19, #745): 0.06 m is the value the units of this
          # arm ran with. It is 2.7 times the corridor's entrance radius
          # (robot.hand.docking.corridor.r_ent 22.1 mm), so the corridor gate
          # is as good as open. What it has let through is little: the 26
          # segments those units published (7 units) leaned on the corridor by
          # exactly nothing. At 0 a converged solve that leans on it by a few
          # millimetres is withheld — in the one unit run at 0, a first solve
          # leaning 6.4 mm and on nothing else. No value between the two was
          # tried. slack_v_max stays 0: the
          # envelope slacks of the segments withheld on the D-2 tuning set run
          # from 0.3 to 8 m^2/s^2 (most past the 2.5 m/s the hand was flown
          # to), and 1.5 published no more in a unit.
          publish:
            slack_c_max: 0.06
            slack_v_max: 0.0
          # The docking core's tuning (MpcDockingSegmentCoreParams) — what is NOT
          # a property of the hand. The hand's identified values (the entrance
          # plane, the corridor, the lateral set, the speed band, the closure
          # window, the contact point) are robot.hand.docking in the main file
          # and reach every core from there; the grid is this map's own keys
          # above. A per-joint weight is one number for every joint.
          # Starting values: the weights the core's own suites solve with
          # (E1-F13). E1-F19 (#745) did not tune them — it set the switches,
          # the grid and the keys noted where they stand.
          core:
            u_scale: 1.0e+3
            cost:
              r_tau: 1.0e-4
              r_acc: 1.0e-3
              r_jerk: 1.0
              # Posture cost toward planner.wait_pose (the nominal posture).
              w_q_nom: 0.1
              w_manip: 0.0
            catch:
              q_p: [20.0, 20.0, 20.0]
              q_v: [1.0, 1.0, 1.0]
              sigma_T: 0.1
              # Reference relative velocity at the catch node, catch frame
              # [m/s]: straight down the approach axis at the middle of the
              # hand's closing-speed band (robot.hand.docking.speed, c
              # 1.6 – 1.7 m/s). on_configure parks when it leaves the band.
              nu_ref: [0.0, 0.0, -1.65]
              q_rho_f: [1.0e+3, 1.0e+3]
              q_nu_f: [5.0, 5.0, 5.0]
              w_impact: 0.0
              e_ref: 1.0
            approach:
              window: 0.12
              lambda1_c: 1.0
              lambda2_c: 0.0
              lambda1_v: 1.0
              lambda2_v: 0.0
            capture:
              # Chance rows OFF (E1-F19, #745), as on the other shipped arm.
              # `true` tightens the lateral, speed and timing rows by the
              # ball's covariance at the catch node. In a sim unit on the D-2
              # tuning set with the values shipped before (chance on among
              # them) the nlp search started no solve (27 throws: every
              # candidate refused before one — too far, reach, and on 107
              # wakes the speed window); these are the values this arm's
              # units were tuned with.
              # Off also means the catch node's covariance is not CHECKED: a
              # wake whose covariance is not valid yet is planned on the mean.
              chance: false
              face_eps: 0.0125
              speed_faces: 8
              eps_nu: 0.01
              eps_sigma: 1.0e-4
            timing:
              # The closure-timing row is one of the chance rows: with
              # capture.chance off it is not built whatever this says.
              row: false
              eps_t: 0.05
            stop:
              w_perp: 0.0
            rows:
              accel_box: false
              jerk_box: false
            sqp:
              max_iterations: 50
              tol_violation: 1.0e-6
              # tol_kkt and mu_max (E1-F19 part 2, #745). mu_max is the cap of
              # the elastic penalty; at the initial penalty (1e2, the code
              # default of mu_init) no penalty probe runs. A probe is one more
              # QP per iteration, and it is the solves that END REFUSED that
              # ran them: mapped offline on the D-2 tuning set with no deadline
              # their median went from 71 to 11 ms with the stop grid above
              # (the accepted throws: 9 to 8 of 12, all the changes together).
              # The QP solver's own tolerances (solver.*) and the other
              # penalty keys were swept on the other shipped arm only, where
              # they moved neither time.
              # Under planner.search.mode grid there is no offline map: one
              # same-seed unit a robot with the code default 1e6 instead
              # published as many throws (0 and 0 of 27) and converged as
              # often (0 and 0 first solves), and cut more of them at the
              # deadline (33 to 38 %).
              # mu_init is written beside it (its value is the code
              # default) so that "no probe" does not rest on a default:
              # mu_max may not be under mu_init (the core refuses the
              # pair), so an overlay that raises mu_init raises it too.
              # (catch_time's two start penalties, read only with
              # continuous_tc, are still the code's and checked the same.)
              tol_kkt: 1.0e-2
              mu_init: 1.0e+2
              mu_max: 1.0e+2
            solver:
              eps_abs: 1.0e-7
              eps_rel: 1.0e-9
              max_iter: 400
