# demo_shared.yaml — iiwa7+LEAP variant
# Grasp controller is intentionally disabled (no sensor stack on LEAP);
# demo_joint/task controllers run as pure trajectory tracking + hand joint
# passthrough. demo_wbc runs TSID posture+SE3 only (no contacts/force).
demo_shared:
  # ── Virtual TCP ───────────────────────────────────────────────────────────
  # WBC SE3 task drives ee_link directly; virtual TCP overlay disabled.
  virtual_tcp_mode: "disabled"
  virtual_tcp_offset: [0.0, 0.0, 0.0]
  virtual_tcp_orientation: [0.0, 0.0, 0.0]

  # ── Grasp detection ─────────────────────────────────────────────────────────
  # Capability-aware: controllers branch on
  # devices.<hand>.sensor_layout.has_native_contact (set in robot/sim yaml):
  #   key                      | sensor A (native contact) | sensor B (force-only)
  #   grasp_contact_threshold  | required (AND with force) | unconsumed
  #   grasp_force_threshold    | required (AND with prob)  | required (only check)
  #   grasp_min_fingertips     | active_count ≥ N (common across types)
  grasp_contact_threshold: 0.5   # [sensor A only] native sigmoid prob threshold (0..1)
  grasp_force_threshold: 1.0     # [common]  |F| threshold [N]
  grasp_min_fingertips: 2        # [common]  grasp_detected = active_count ≥ N

  # ── Grasp controller disabled ─────────────────────────────────────────────
  # demo_shared_config.cpp:234-239 → grasp_controller_ = nullptr when
  # type != "force_pi". demo_joint/task hot paths gate on nullptr.
  grasp_controller_type: "none"

  # ── In-plane pull-force estimator (#167) ────────────────────────────────────
  # Quasi-static external pull on a pinched flat object, from per-fingertip
  # 3-axis forces:  F̂ = -P∥(Σ R_i·C_i(f_i - b_i)·sign + m·g),  P∥ = I - n·nᵀ.
  # Reference frame = robot base (fingertip FK rotations are T_base_fingertip).
  # Key names mirror rtc::grasp::{PullEstimatorParams, PullContactConfig};
  # sample_rate_hz is set from the controller's control_rate at build time.
  #
  # SIM-ONLY: the real LEAP hand has no fingertip force/tactile stack; the
  # 3-axis force here comes from MuJoCo contact wrench (sim.yaml
  # fingertip_wrench_topics). On real hardware the force lane is invalid, so
  # the estimate stays invalid and bounded-decays — safe, just inert.
  # The wrench-lane order was reordered to thumb→index→middle→ring (sim.yaml)
  # so sensor-lane slot f pairs with tip_links[f] FK (Stage A-3 contract);
  # a naive lane order would attribute one finger's force to another's pose.
  pull_estimator:
    enabled: true

    # Operating envelope (#234 P-19): the estimate is quasi-static — it assumes
    # the grasped object is in equilibrium, so any in-plane m·a of the object
    # is reported as external pull. The baseline snapshot only cancels a
    # constant offset captured at one instant, and arming it mid-lift bakes
    # that instant's inertia in. Trust the magnitude during slow/steady motion;
    # during arm acceleration treat it as an upper bound. There is no
    # acceleration validity gate yet — the physically correct correction needs
    # the object COM acceleration in the common frame, not the TCP's.

    # Filtering / validity
    filter_cutoff_hz: 5.0        # [Hz] Bessel LPF on the in-plane estimate
    min_valid_contacts: 2        # 2 suffice for [Fx,Fy]; 3rd adds averaging
    decay_time_constant_s: 0.1   # [s] bounded decay on invalid ticks (no hard zero)

    # Diagnostics
    slip_risk_threshold: 1.0     # friction utilization ≥ this ⇒ slip_risk
    # NOTE (#234 P-18): friction_utilization is |f_t| / (μ·f_n) with the μ
    # *assumed* per tip below — not a measured one. Read it as a relative trend
    # indicator ("this tip is closer to sliding than it was"), not an absolute
    # safety margin; the true μ is object- and condition-dependent and none of
    # the values pinned here have been identified experimentally.
    alignment_error_rad: 0.035   # [rad] δθ for grip→in-plane leakage bound (~2°)

    # Gravity model: m·g in base frame [N]. Keep zero while
    # use_baseline_subtraction is on — the grasp-time baseline snapshot removes
    # in-plane gravity AND constant calibration residual in one shot.
    gravity_force: [0.0, 0.0, 0.0]

    # In-plane x axis reference (base frame) — names the force_inplane pair.
    # e_x = this direction projected into the pinch plane, e_y = n x e_x, so
    # [0] reads as the anti-gravity (vertical) pull component and [1] as the
    # horizontal one. Default +Z assumes an upright base; set the true
    # anti-gravity direction otherwise. Falls back to basis continuity when the
    # pinch axis turns parallel to it.
    inplane_x_reference: [0.0, 0.0, 1.0]
    # Do NOT leave this parallel to plane_normal when plane_normal_source is
    # "fixed" (#234 P-17): the projection collapses, the basis silently falls
    # back to a world-axis seed and force_inplane[0] stops being the
    # reference-direction component. on_configure warns, and the published
    # basis_source reports SEED instead of REFERENCE when it happens.
    use_baseline_subtraction: true

    # Plane normal source: "fixed" (plane_normal below, base frame) or
    # "pinch_geometry" — n = (centroid of the non-thumb tips *currently
    # touching* − p_thumb)/‖·‖, recomputed per tick. "Touching" is a hysteresis
    # on |f| alone, deliberately independent of n, so the shape is observed
    # rather than declared: thumb+index, thumb+middle, tripod and four-finger
    # each yield their own axis. Switch to "fixed" if a full-grasp normal is
    # known.
    plane_normal_source: "pinch_geometry"
    plane_normal: [0.0, 0.0, 1.0]   # consumed only when source is "fixed"

    # Optional known pull direction (base frame) → directional scalar F_d
    # output; more noise-robust than |F̂| for force-gauge experiments.
    # pull_direction: [1.0, 0.0, 0.0]

    # Grasp-mode required roles: these tips must be in contact (post-hysteresis)
    # for a valid estimate — index+middle without thumb is NOT a pinch.
    required_roles: ["thumb"]

    # Per-tip contact model. Order = PullContactInput order in the controllers.
    # link resolves the FK slot against the tree-model tip_links (sim.yaml:
    # <finger>_tip_head). The per-contact gate/diagnostic normal is derived per
    # tick from pinch geometry (±plane normal, thumb opposing) — no per-tip
    # normal here, so it tracks the grasp axis rather than a body-fixed fingertip
    # axis. force_bias / force_calibration keep their defaults (0 / I).
    #
    # force_sign: -1.0 per tip — LEAP is the one robot that needs it. The
    # estimator sums *finger-on-object* forces (PullContactConfig::force_sign
    # default +1), which is what the real fingertip sensors report
    # (FingertipSensor.msg: proto-1b firmware, 1a ONNX). LEAP has no such
    # sensor: mujoco_native packs the sim's contact-wrench WrenchStamped into
    # inference slots 1..3 (sim.yaml), and that lane is deliberately
    # **env-on-link** — rtc_mujoco_sim negates MuJoCo's geom1-on-environment
    # netforce to the ROS wrench convention (mujoco_sim_loop.cpp ReadContactWrenches,
    # asserted by ContactWrench.HangingArmContactProducesPositiveZForce). So the
    # inversion belongs here, per contact, not in the sim: flipping the sim would
    # break the ROS wrench convention for every other consumer of /leap/*.
    #
    # tip_names lists every tip that can *physically* participate, not the tips
    # one grasp is expected to use — a tip that is not touching is excluded by
    # its own force hysteresis, both from the sum and from the axis. LEAP's ring
    # is included here because it is a tsid contact as well (the WBC controller
    # resolves these links against tsid.contacts, not just tip_links).
    # Role names must be unique: the role keys the block below and picks the
    # thumb, so a repeat is an on_configure FAILURE rather than a silent
    # double-count. Under the WBC controller a tip additionally needs its tsid
    # contact *active* in the current phase preset to supply a fingertip pose
    # (that is the only pose source there) — so on a phase that deactivates the
    # ring, the ring is excluded from the axis under wbc but not under
    # joint/task, which read hand FK directly.
    # Optional per-tip touch hysteresis (#234 P-16): touch_on_threshold /
    # touch_off_threshold split the axis-selection gate (on |f_obj|) from the
    # force-sum gate (on f_n). Omit both — as every tip below does — and the
    # contact pair drives both, which keeps the historical `touch ⊇ contact`
    # containment. Set both (a half-set pair is an on_configure FAILURE) when a
    # tip with large shear reads as "touching" and drags the pinch axis around
    # without contributing to the sum.
    tips:
      tip_names: ["thumb", "index", "middle", "ring"]
      thumb:
        link: "thumb_tip_head"
        friction_coeff: 0.7
        force_saturation: 25.0     # [N] per-axis |raw| ≥ this ⇒ contact gated out
        contact_on_threshold: 0.5  # [N] normal-force hysteresis ON
        contact_off_threshold: 0.2 # [N] normal-force hysteresis OFF
        force_sign: -1.0           # sim contact-wrench lane is env-on-link
      index:
        link: "index_tip_head"
        friction_coeff: 0.7
        force_saturation: 25.0
        contact_on_threshold: 0.5
        contact_off_threshold: 0.2
        force_sign: -1.0           # sim contact-wrench lane is env-on-link
      middle:
        link: "middle_tip_head"
        friction_coeff: 0.7
        force_saturation: 25.0
        contact_on_threshold: 0.5
        contact_off_threshold: 0.2
        force_sign: -1.0           # sim contact-wrench lane is env-on-link
      ring:
        link: "ring_tip_head"
        friction_coeff: 0.7
        force_saturation: 25.0
        contact_on_threshold: 0.5
        contact_off_threshold: 0.2
        force_sign: -1.0           # sim contact-wrench lane is env-on-link

  # ── Generalized-momentum observer (#135 Layer 1b) ──────────────────────────
  # Joint-space residual r = LPF(tau_ext) from the arm's own proprioception
  # (encoder + joint torque), with no wrist F/T sensor. Runs on the ARM
  # sub-model (open chain) inside the controller tick, before the control law,
  # and gates on the position/velocity/effort lanes being readable — a tick
  # whose torque lane is missing HOLDS the residual instead of reading the
  # absent torque as 0 N·m, which would drive r towards g(q) and read as a
  # payload the size of the arm.
  #
  # Costs one arm-sized dynamics pass per tick (crba + computeCoriolisMatrix +
  # gravity): 2.13-2.17 us measured on a 7-DoF arm, ~0.11 % of a 500 Hz tick.
  #
  # Output goes to controllers/<ctrl>/momentum_observer.csv only — there is no
  # topic for it yet, because what a PayloadEstimate message exists to carry
  # (mass / CoM / confidence) is Layer 2A's output and does not exist at this
  # layer.
  #
  # PRECONDITION on the effort lane: DeviceState::efforts must be JOINT TORQUE
  # in N.m and must account for every generalized force on the joints. Nothing
  # downstream can check either half — a lane in the wrong unit, or one missing
  # a term, is fresh and full and wrong, and the residual absorbs the
  # difference as an external torque.
  momentum_observer:
    enabled: true
    # K_I [1/s], per arm joint. A scalar broadcasts to every joint; a list must
    # be exactly the arm's dof (anything else is refused at configure rather
    # than padded). Larger converges faster and passes more sensor noise; the
    # residual's first-order time constant is 1/K_I, so 10 /s settles in ~0.3 s.
    # Not identified on hardware — expect to retune per robot.
    gains: 10.0

    # ── Layer 2A: quasi-static payload estimation (#135) ───────────────────
    # Inverts the residual above into a Cartesian wrench and a payload mass:
    #   w_ext = argmin ||J_p(q)^T w - r||^2 + mu||w||^2      [WRENCH-A]
    #   m     = (f_ext . Wg) / ||Wg||^2                      [MASS-A]
    # Wg is the MODEL's gravity, so a URDF with non-Z gravity needs no change.
    #
    # SHIPPED OFF ON PURPOSE. The gate thresholds below are derived from sim
    # logs, and the sim has no way to hang a known mass (no object in the
    # shipped scene, and MuJoCoSimulator::SetExternalForce has no ROS surface),
    # so the ACCURACY of m has never been measured against a positive control.
    # The algebra is pinned by unit tests; the number is not yet trusted.
    # Turning this on also costs a frame Jacobian plus a 6x6 solve per tick.
    payload_estimator:
      enabled: false
      # Frame the payload hangs from, resolved against the ARM sub-model.
      # A name the model does not carry is refused at configure — pinocchio
      # returns frame 0 (universe) for an unknown name, which would otherwise
      # project onto an all-zero Jacobian for the life of the run.
      frame: ee_link

      # ── Validity gates ──────────────────────────────────────────────────
      # Measured on session-67 sim_iiwa7_leap logs, binning the residual by
      # what was moving (n = 35285 valid ticks):
      #   arm still, hand still    max ||r||inf = 0.048 N.m   <- gates below
      #   hand at 2e-4 rad/s       max ||r||inf = 0.224 N.m   (5x worse)
      #   hand moving freely       max ||r||inf = 104.1 N.m   (2000x worse)
      # The HAND axis dominates: the observer runs on an arm sub-model whose
      # hand joints are pinned at a reference posture, so real hand motion is
      # an external torque BY CONSTRUCTION and is indistinguishable from a
      # payload. The arm axis is flat anywhere below 1e-2.
      # At 1e-4 rad/s the surviving residual is ~0.048 N.m, i.e. ~10 g of
      # payload at a 0.5 m lever arm, on 63 % of ticks.
      # These are SIM numbers: real encoder velocity noise is larger, so
      # hardware must re-tune both rather than inherit them.
      max_arm_velocity: 1.0e-3         # [rad/s]
      max_peripheral_velocity: 1.0e-4  # [rad/s] — every non-arm device
      # Observer time constants (1/K_I) that must pass after a re-seed before
      # the residual is believed. r restarts at zero and re-converges, so an
      # early read measures the filter, not the load. 5 tau ~ 99.3 % settled.
      settle_time_constants: 5.0

      # ── Numerical guards ────────────────────────────────────────────────
      # sigma0 / lambda_max parameterise the same section 6.5 adaptive damping
      # law the controllers use (NUM-1). Damping stays ADAPTIVE rather than
      # floored at a constant mu: a floor would bias m toward zero at every
      # pose, always under-reporting the payload.
      sigma0: 1.0e-3
      lambda_max: 0.05
      # sigma_min(J) below this rejects the tick: at least one wrench
      # direction is unobservable, so a payload could be present and leave no
      # trace in r.
      min_sigma: 1.0e-3
      # ||J^T w - r||inf ceiling [N.m]. THE gate that separates a payload from
      # an unmodelled joint-level torque (armature / damping / frictionloss,
      # #135 [MO-1u]): those do not lie in the range of J^T, so no wrench
      # explains them and the leftover is large.
      #
      # UNLIKE THE VELOCITY GATES ABOVE, THIS VALUE IS NOT MEASURED. Deriving it
      # needs the reconstruction error itself, which the session-67 logs cannot
      # give (they carry r, not the per-tick Jacobian). 5.0 is deliberately
      # permissive so it does not silently reject valid ticks before anyone has
      # looked; with the gates above it will essentially never fire, since the
      # surviving ||r||inf is ~0.048 N.m in the first place. Tune it DOWN once
      # payload_fit_error has been observed on the target robot -- a ceiling
      # that never fires is not a guard.
      max_fit_error: 5.0
      # ||Wg|| floor [m/s^2]. [MASS-A] divides by ||Wg||^2, so a gravity-free
      # model has no mass map at all (NUM-2 / NUM-4).
      min_gravity: 1.0e-3
