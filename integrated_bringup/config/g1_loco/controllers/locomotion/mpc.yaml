# locomotion_controller — mpc.* (g1_loco)
#
# A fragment of ../locomotion_controller.yaml (its `include:` list). The
# whole-body MPC's OCP: rtc_mpc's MPCFactory reads `ocp_type`, and
# `kinodynamic:` is the OCP's static configuration — schema, units and checks in
# rtc_mpc ocp/kinodynamic_ocp_config.hpp (every key required, an unknown key
# refused, every joint of the MPC model named, a name the model lacks ignored).
# `solver:` is the factory's (rtc_mpc handler/mpc_factory.hpp — key meanings and
# the values Init refuses).
#
# The controller's own keys (integrated_bringup controllers/locomotion_controller.hpp,
# every one required when `mpc:` is present):
#   enabled           the controller follows the MPC's plan; false = the latched
#                     pose only. The launches set it from enable_mpc (default false).
#   period_nodes      the MPC thread's period in node intervals (2 → 1 / 0.070 s).
#   max_policy_age_s  a plan whose observation is older than this is dropped:
#                     five periods. At 3 node intervals + one period (0.175 s)
#                     the plan was lost on the sim when the online solves just
#                     after a contact switch were withheld two to four periods
#                     in a row (their first nodes over publish_prim_tol).
#   riccati.enabled   the plan's feedback gain added to the acceleration
#                     reference — on (the manager reads an absent key as on),
#                     scaled by gain_scale 0.25: in the W8-F05 campaign (#1155,
#                     truth input, the three shipped-off options on) 0.25 tracked
#                     and survived the walk better than 1.0 but rejects a forward
#                     push less well; against the options-off profile it walks
#                     longer and tracks 0.03 slower (the v_ratio non-inferiority
#                     it was held to, -0.02, was not met);
#                     the other riccati keys are the manager's (rtc_mpc
#                     manager/mpc_solution_manager.hpp).
#   sync              optional. mode free_run: the MPC thread runs on the wall
#                     clock at 1 / (period_nodes · dt) — the real robot. mode
#                     lockstep (simulation only; the controller manager must run
#                     in sim lock-step, else configure is refused): the RT tick
#                     requests a solve every period_nodes · dt / tick ticks and
#                     waits for it delivery_ticks later, so the plan's age at
#                     delivery is exactly that many ticks whatever the host's
#                     speed; the simulator's real-time factor follows. The
#                     launch sets the mode (mpc_sync).
#   activation_height optional (absent = config). measured: the activation's
#                     first reference latch puts the commanded base height at
#                     the measured one (clamped into command.h_min..h_max), so
#                     the robot keeps the height the controller before this one
#                     stood it at — on this profile demo_joint_controller's
#                     stand pose, which reference.q_default's legs are.
#   sanity            the plausibility check of a sampled plan (a plan that fails
#                     is dropped, never followed): |q_ref − q| per joint and the
#                     joint range widened by joint_delta_rad [rad]; base speed
#                     [m/s]; the total normal force at most wrench_scale × the
#                     weight. The plan's accelerations are not judged (why:
#                     LocomotionController::Plausible).
#
# solver: the tolerances the OCP's tests solve to, and the one budget every
# solve runs on — the first after the build, a rebuild or a rejected solve
# (cold-seeded) as much as a warm one. The budget is fixed so a solve fits
# the period: six iterations and one AL iteration, whose solve time is
# bounded, where the AL loop's is not. Such a solve never reports
# convergence, so the publish rules are what hold it: a cold solve is not
# published until it converges (the next solve warm-starts from it), a solve
# whose tick ran past publish_deadline_ms (one period) is not published, nor
# is one whose first nodes — those read before the next plan — have a primal
# residual above publish_prim_tol. rtc_mpc's receding test holds this budget
# to its registered bounds from a cold start (stance, a moving base, the walk
# window, a mid-walk re-seed: the plan after the cold one is publishable). The
# budget was chosen in real-time sim on a development PC with two solver
# threads (launch mpc_threads 2); one thread (num_threads below) was not
# checked. The control PCs' soak checks it on their hardware. An unknown
# solver key is refused at configure.
#
# The weights: the reference whole-body task's Q · R structure, rescaled for
# this plant on the sim (stand, a base-height command and stepping in place,
# 2026-11-25). Against the reference's own values they follow a −0.15 m height
# command to 83 % (the reference's 30 %: its joint weights hold the legs at
# q_default against the height) and keep the stance width while stepping
# (0.21 m of 0.24 after 23 s; the reference's 0.11). Their absolute size is
# tied to the solver's constants (AL μ, barriers, tolerances): the same ratios
# a factor 10 lower never produced a publishable plan.
#   - hip_yaw (running and terminal) is ten times the other leg joints'. In
#     single support the stance foot's yaw rate is held by the contact
#     equality, so the plan turns the body through the stance hip yaw; at the
#     common weight a yaw-rate command wound the hips, and the stop that
#     followed unwound them, turning the body on the fixed feet. At ten times
#     the drift at the stop stays small, for a yaw-rate tracking about 0.02
#     lower (sim walk evaluation, 2026-11-28).
#   - state / terminal: the base orientation is in this OCP's tangent order
#     (roll, pitch, yaw); the base angular entries weigh the LOCAL angular
#     velocity. terminal_scaling 1: the terminal weights are written out.
#   - contact_tracking: per foot; the CoP rectangle is 0.07 × 0.02 (inside the
#     whole-body QP's 0.08 × 0.025).
# The running cost is integrated over each node interval (× dt); the terminal
# cost is terminal_scaling × terminal_weights. The joints are the body's 23 —
# the MPC model is the floating body with the hand locked (it has no MPC weight
# in the reference).
#
#
# constraints: the reference task's contact constraints — as hard rows the
# stance foot's stabilised acceleration and the swing foot's vertical motion
# (its foot_constraint gains); as soft barriers, as in the reference, the
# friction cone (mu, grip, its regularisation) and the CoP rectangle, each
# with its relaxed log barrier (barrier_mu, barrier_delta: the reference's
# values; the friction margin in N, the CoP margins in N·m). As hard rows
# those two stall a walking window: the solver drops the rear foot's normal
# force of a double-support node to zero. The joint-limit and foot / knee
# collision barriers are the reference's (its code's piecewise-polynomial
# form; mu from its task). Collision delta is 0.06 (the reference's 0.04):
# nothing else in either layer holds the feet apart, and a planned pair
# settles about 0.015 – 0.02 m inside delta, so the barrier's reach sets the
# planned touchdown spacing — at 0.04 straight walking stepped 0.10 m apart
# (standing 0.24) and the touchdowns just after a yaw-rate step came close to
# crossing; 0.06 steps about 0.13 apart. 0.08 widened more but, with the
# hip_yaw weight, drifted backwards in stepping in place past its gate (sim
# walk evaluation, 2026-11-28). The 16 sphere pairs are its foot centre, the
# two points ±0.054 (0.6 of its half length) along the sole and the ankle (r 0.05), and the knees
# (r 0.075), in the ankle-roll / knee joint frames; collision ships on (W8-F05).
#
# 32 nodes × 0.035 s = 1.12 s (the reference: 1.1 s, its last interval 0.015 s).
# The reference integrates with RK4; the two offered here are semi-implicit
# Euler (the starting value) and RK2.
locomotion_controller:
  mpc:
    enabled: true                     # the launches override it from enable_mpc
    period_nodes: 2
    max_policy_age_s: 0.35            # [s] 5 periods (0.070)
    activation_height: measured
    sync:
      mode: free_run                  # the robot's clock; sim_g1_loco defaults to lockstep (mpc_sync)
      delivery_ticks: 0               # 0 = one period (35 ticks at 500 Hz)
      wait_timeout_s: 2.0             # [s] a tick's wait for a solve past this is the fault mpc_wait
    riccati:
      enabled: true
      gain_scale: 0.25                # W8-F05 (#1155), see the header
      accel_only: true
      max_delta_blocks:               # the Δx cap per state block
        base_position: 0.05           # [m]
        base_orientation: 0.1         # [rad]
        joint_position: 0.2           # [rad]
        base_linear_velocity: 0.5     # [m/s]
        base_angular_velocity: 1.0    # [rad/s]
        joint_velocity: 2.0           # [rad/s]
    sanity:
      joint_delta_rad: 0.5            # [rad]
      base_speed: 3.0                 # [m/s] (command v_max 2.0)
      wrench_scale: 3.0               # × m·g
    ocp_type: "kinodynamic"
    solver:
      prim_tol: 1.0e-4
      dual_tol: 1.0e-4
      mu_init: 1.0e-2
      max_iters: 6
      max_al_iters: 1
      publish_deadline_ms: 70.0       # [ms] one period
      publish_prim_tol: 0.05
      require_fresh_state: true       # one solve per state snapshot
      num_threads: 1                  # > 1 needs a worker layout profile (launch mpc_threads)
    kinodynamic:
      horizon_nodes: 32
      dt: 0.035                      # [s]
      integrator: "semi_implicit_euler"
      terminal_scaling: 1.0
      state_weights:
        base_position: [0.0, 0.0, 32.0]
        base_orientation: [100.0, 40.0, 0.0]
        joints:
          left_hip_pitch_joint: 0.056
          left_hip_roll_joint: 0.056
          left_hip_yaw_joint: 0.56
          left_knee_joint: 0.056
          left_ankle_pitch_joint: 0.056
          left_ankle_roll_joint: 0.056
          right_hip_pitch_joint: 0.056
          right_hip_roll_joint: 0.056
          right_hip_yaw_joint: 0.56
          right_knee_joint: 0.056
          right_ankle_pitch_joint: 0.056
          right_ankle_roll_joint: 0.056
          waist_yaw_joint: 20.0
          waist_roll_joint: 20.0
          waist_pitch_joint: 20.0
          left_shoulder_pitch_joint: 0.125
          left_shoulder_roll_joint: 0.125
          left_shoulder_yaw_joint: 0.125
          left_elbow_joint: 0.125
          right_shoulder_pitch_joint: 0.125
          right_shoulder_roll_joint: 0.125
          right_shoulder_yaw_joint: 0.125
          right_elbow_joint: 0.125
        base_linear_velocity: [3.0, 3.0, 1.15]
        base_angular_velocity: [1.0, 0.5, 0.5]
        joint_velocities:
          left_hip_pitch_joint: 0.0011
          left_hip_roll_joint: 0.0011
          left_hip_yaw_joint: 0.0011
          left_knee_joint: 0.0011
          left_ankle_pitch_joint: 0.0011
          left_ankle_roll_joint: 0.0011
          right_hip_pitch_joint: 0.0011
          right_hip_roll_joint: 0.0011
          right_hip_yaw_joint: 0.0011
          right_knee_joint: 0.0011
          right_ankle_pitch_joint: 0.0011
          right_ankle_roll_joint: 0.0011
          waist_yaw_joint: 0.4
          waist_roll_joint: 0.4
          waist_pitch_joint: 0.4
          left_shoulder_pitch_joint: 0.0026
          left_shoulder_roll_joint: 0.0026
          left_shoulder_yaw_joint: 0.0026
          left_elbow_joint: 0.0026
          right_shoulder_pitch_joint: 0.0026
          right_shoulder_roll_joint: 0.0026
          right_shoulder_yaw_joint: 0.0026
          right_elbow_joint: 0.0026
      terminal_weights:
        base_position: [0.0, 0.0, 10.0]
        base_orientation: [16.0, 8.0, 0.0]
        joints:
          left_hip_pitch_joint: 0.0168
          left_hip_roll_joint: 0.0168
          left_hip_yaw_joint: 0.168
          left_knee_joint: 0.0168
          left_ankle_pitch_joint: 0.0168
          left_ankle_roll_joint: 0.0168
          right_hip_pitch_joint: 0.0168
          right_hip_roll_joint: 0.0168
          right_hip_yaw_joint: 0.168
          right_knee_joint: 0.0168
          right_ankle_pitch_joint: 0.0168
          right_ankle_roll_joint: 0.0168
          waist_yaw_joint: 6.0
          waist_roll_joint: 6.0
          waist_pitch_joint: 6.0
          left_shoulder_pitch_joint: 0.0375
          left_shoulder_roll_joint: 0.0375
          left_shoulder_yaw_joint: 0.0375
          left_elbow_joint: 0.0375
          right_shoulder_pitch_joint: 0.0375
          right_shoulder_roll_joint: 0.0375
          right_shoulder_yaw_joint: 0.0375
          right_elbow_joint: 0.0375
        base_linear_velocity: [5.5, 3.5, 0.2]
        base_angular_velocity: [0.15, 0.15, 0.05]
        joint_velocities:
          left_hip_pitch_joint: 0.00033
          left_hip_roll_joint: 0.00033
          left_hip_yaw_joint: 0.00033
          left_knee_joint: 0.00033
          left_ankle_pitch_joint: 0.00033
          left_ankle_roll_joint: 0.00033
          right_hip_pitch_joint: 0.00033
          right_hip_roll_joint: 0.00033
          right_hip_yaw_joint: 0.00033
          right_knee_joint: 0.00033
          right_ankle_pitch_joint: 0.00033
          right_ankle_roll_joint: 0.00033
          waist_yaw_joint: 0.12
          waist_roll_joint: 0.12
          waist_pitch_joint: 0.12
          left_shoulder_pitch_joint: 0.00078
          left_shoulder_roll_joint: 0.00078
          left_shoulder_yaw_joint: 0.00078
          left_elbow_joint: 0.00078
          right_shoulder_pitch_joint: 0.00078
          right_shoulder_roll_joint: 0.00078
          right_shoulder_yaw_joint: 0.00078
          right_elbow_joint: 0.00078
      input_weights:
        contact_force: [0.00011, 0.00011, 1.8e-5]
        contact_moment: [0.02, 0.0022, 0.125]
        joint_accelerations:
          left_hip_pitch_joint: 2.3e-5
          left_hip_roll_joint: 2.3e-5
          left_hip_yaw_joint: 2.3e-5
          left_knee_joint: 2.3e-5
          left_ankle_pitch_joint: 2.3e-5
          left_ankle_roll_joint: 2.3e-5
          right_hip_pitch_joint: 2.3e-5
          right_hip_roll_joint: 2.3e-5
          right_hip_yaw_joint: 2.3e-5
          right_knee_joint: 2.3e-5
          right_ankle_pitch_joint: 2.3e-5
          right_ankle_roll_joint: 2.3e-5
          waist_yaw_joint: 0.0008
          waist_roll_joint: 0.0008
          waist_pitch_joint: 0.0008
          left_shoulder_pitch_joint: 5.0e-5
          left_shoulder_roll_joint: 5.0e-5
          left_shoulder_yaw_joint: 5.0e-5
          left_elbow_joint: 5.0e-5
          right_shoulder_pitch_joint: 5.0e-5
          right_shoulder_roll_joint: 5.0e-5
          right_shoulder_yaw_joint: 5.0e-5
          right_elbow_joint: 5.0e-5
      contact_tracking:              # per contact; zero rows are not tracked
        position: [0.0, 0.0, 0.0]
        orientation: [5000.0, 5000.0, 0.0]
        linear_velocity: [0.0035, 0.0035, 0.0]
        angular_velocity: [4.0, 4.0, 4.0]
        linear_acceleration: [0.003, 0.003, 0.003]
        angular_acceleration: [0.002, 0.002, 0.002]
      constraints:
        foot_constraint:
          position_z: 100.0
          orientation: 80.0
          linear_velocity_xy: 20.0
          linear_velocity_z: 10.0
          angular_velocity: 20.0
          linear_acceleration_xy: 1.0
          linear_acceleration_z: 1.0
          angular_acceleration: 1.0
        friction:
          mu: 0.4                    # [-]
          grip_force: 0.0            # [N]
          regularization: 25.0       # [N²]
          barrier_mu: 0.2
          barrier_delta: 5.0         # [N]
        contact_rectangle:
          x_min: -0.07               # [m]
          x_max: 0.07
          y_min: -0.02
          y_max: 0.02
          barrier_mu: 0.6
          barrier_delta: 0.03        # [N·m]
        joint_limits: {mu: 1200.0, delta: 0.1}
        collision:
          enabled: true
          mu: 1500.0
          delta: 0.06                # [m] (the reference's 0.04; see the header)
          pairs:
          - {frame_a: left_ankle_roll_joint, offset_a: [0.089, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [0.089, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [0.089, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [-0.019, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [-0.019, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [0.089, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [-0.019, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [-0.019, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [0.035, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [0.089, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [0.035, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [-0.019, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: right_ankle_roll_joint, offset_a: [0.035, 0.0, -0.035], radius_a: 0.05,
             frame_b: left_ankle_roll_joint, offset_b: [0.089, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: right_ankle_roll_joint, offset_a: [0.035, 0.0, -0.035], radius_a: 0.05,
             frame_b: left_ankle_roll_joint, offset_b: [-0.019, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [0.035, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [0.035, 0.0, -0.035], radius_b: 0.05}
          - {frame_a: left_knee_joint, offset_a: [0.0, 0.0, 0.0], radius_a: 0.075,
             frame_b: right_knee_joint, offset_b: [0.0, 0.0, 0.0], radius_b: 0.075}
          - {frame_a: left_ankle_roll_joint, offset_a: [0.035, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [0.0, 0.0, 0.0], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [0.089, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [0.0, 0.0, 0.0], radius_b: 0.05}
          - {frame_a: left_ankle_roll_joint, offset_a: [-0.019, 0.0, -0.035], radius_a: 0.05,
             frame_b: right_ankle_roll_joint, offset_b: [0.0, 0.0, 0.0], radius_b: 0.05}
          - {frame_a: right_ankle_roll_joint, offset_a: [0.035, 0.0, -0.035], radius_a: 0.05,
             frame_b: left_ankle_roll_joint, offset_b: [0.0, 0.0, 0.0], radius_b: 0.05}
          - {frame_a: right_ankle_roll_joint, offset_a: [0.089, 0.0, -0.035], radius_a: 0.05,
             frame_b: left_ankle_roll_joint, offset_b: [0.0, 0.0, 0.0], radius_b: 0.05}
          - {frame_a: right_ankle_roll_joint, offset_a: [-0.019, 0.0, -0.035], radius_a: 0.05,
             frame_b: left_ankle_roll_joint, offset_b: [0.0, 0.0, 0.0], radius_b: 0.05}
