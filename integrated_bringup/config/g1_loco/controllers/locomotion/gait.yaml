# locomotion_controller — gait.* (g1_loco)
#
# A fragment of ../locomotion_controller.yaml (its `include:` list). The gait
# table: schema, units, the transition rule and checks in rtc_mpc
# reference/gait_table.hpp (LoadGaitTable — every key required, an unknown key
# refused); contact names are model.contacts[*].name, whose order sets the bits.
#
# Gaits and thresholds are the original whole-body MPC's (gait.info,
# ProceduralMpcMotionManager): stance → slow_walk → walk. Its stance slower
# bound (−0.1) is unused at the bottom of the sequence and reads 0 here (a
# threshold is ≥ 0). switch_lead ≈ 0.7 of the walk period. trot / run values
# and retuning belong to the sim evaluation (W8).
locomotion_controller:
  gait:
    sequence: [stance, slow_walk, walk]
    min_dwell: 0.2      # [s]
    switch_lead: 1.0    # [s]
    gaits:
      stance:
        modes: [[left_foot, right_foot]]
        switching_times: [0.0, 0.5]
        faster_above: [0.1, 0.1]          # [m/s, rad/s]
        slower_below: [0.0, 0.0]
        measured_tolerance: [10.0, 10.0]  # leaves stance by command alone
      slow_walk:
        modes: [[left_foot], [left_foot, right_foot], [right_foot], [left_foot, right_foot]]
        switching_times: [0.0, 0.65, 0.85, 1.5, 1.7]
        faster_above: [0.3, 0.2]
        slower_below: [0.05, 0.05]
        measured_tolerance: [0.05, 0.05]
      walk:
        modes: [[left_foot], [left_foot, right_foot], [right_foot], [left_foot, right_foot]]
        switching_times: [0.0, 0.6, 0.7, 1.3, 1.4]
        faster_above: [0.5, 0.35]
        slower_below: [0.25, 0.15]
        measured_tolerance: [0.05, 0.05]
