# locomotion_controller — whole_body_qp.* (g1_loco)
#
# A fragment of ../locomotion_controller.yaml (its `include:` list). The
# whole-body QP the controller solves each tick: schema, units and checks in
# rtc_tsid locomotion/locomotion_formulation.hpp (LocomotionFormulationBuilder —
# an unknown key is refused). The contact set and the torso frame are model.*'s;
# this file only parameterises them (contact_overrides.<contact name> per foot).
#
# Task gains follow one rule per task (2026-11-25 initial-gain bring-up):
# kd = 2 ζ √kp with ζ ≈ 0.7 for the CoM, torso and posture tasks and ζ ≈ 1
# for the feet and the contact Baumgarte (kd = 2 √kp). The CoM task is the
# slowest loop (√14 ≈ 3.7 rad/s, below the MPC's replanning rate) and, with
# weight 100, as hard as the feet; the torso and posture tasks only shape
# what is left (weights 5 and 0.2). The posture weight is also the only
# regularisation of joints no other task reaches (the hand joints of the
# actuated model): at 0.1 that model's QP stopped converging within 200 outer
# steps (test_humanoid_model_config; 0.2 converges, inside the caps below).
# The force task (0.04) keeps λ near
# the MPC's without overruling the CoM. The CoP bound is 10 mm inside the sole's
# length and 5 mm inside its width (0.09 × 0.03). On the sim (lock-step, n = 2
# per arm, 2026-11-24) these values against the previous set — CoM 50 / 14 ·
# weight 10, torso 80 / 20 · 10, posture 50 / 10 · 1, feet 400 / 40, force 0.1,
# CoP 0.09 × 0.02 — stood as well and, stepping in place for 26 s, survived
# 2 of 2 (previous 1 of 2) with a quarter of the horizontal drift (0.45 m vs
# 1.3–2.1 m), at posture weight 0.05; on the plant with joint armature
# (2026-11-25) 0.2 stepped as 0.05 did (2 of 2) and 1.0 fell after 25–33 s.
# Walking was not re-evaluated with them.
#
# solver.warm_start / constraints.contact.inactive_lambda: each solve starts
# from the previous result with ProxQP's proximal step reset (from the
# equality-constrained solution after a miss), and a released foot's force is
# pinned to zero in the QP itself. With the library default (the previous
# result and its proximal step, regularised released forces) this QP misses on
# a few percent of the ticks of a gait, in chains, and can return SOLVED at a
# non-optimal point on a support change.
#
# constraints.friction_cone.zero_torsion_equality: with torsional_friction_coeff
# 0 each sole's yaw moment is held at 0 by one equality row instead of the pair
# ±m_z ≤ 0 (rtc_tsid friction_cone_constraint.hpp) — the same QP, fewer
# iterations. On the sim (lock-step, the matched plant, stand / height / step /
# walk × 4 against the pair at 25 × 25, 2026-11-27, 230 k ticks each) every
# unit finished as the pair's did, with no failed solve; the inner iterations
# of a step / walk tick fell from a median of 5 to 4 and the solve's median
# from 121 to 97 µs. The most a solve took was 13 inner iterations (pair: 14).
#
# solver.max_iter / max_iter_in bound what a miss costs, not what a solve
# needs. With the equality, on a stand / release / return trace of this QP a
# solve took at most 5 outer steps and 6 inner iterations in one of them, the
# tick after a forced miss solved from the equality-constrained start, and all
# 390 of 600 off-nominal ticks that solve under 200 × 500 solved (at most 13
# outer steps). 20 × 20 leaves twice the trace's need. What it changes is the
# tick that cannot be solved: a QP contradictory through the dynamics runs to
# the caps with the equality (ProxQP's approximate infeasibility certificate
# does not fire on it, rtc_tsid friction_cone_constraint.hpp) and ended after
# 3.4 – 3.8 ms (the pair refused it in 8 outer steps, 1.2 ms); a tolerance out
# of reach ended after 0.2 ms (dev PC). That is still more than a control
# period: the caps shorten a miss, they do not fit it into the tick.
# A non-finite reference or state is refused before the solver (qp_status −3).
locomotion_controller:
  whole_body_qp:
    formulation_type: wqp
    solver:
      eps_abs: 1.0e-6
      max_iter: 20                     # outer (proximal) steps
      max_iter_in: 20                  # inner iterations of one outer step
      dense_backend: PrimalDualLDLT
      warm_start: previous_result_reset_mu
    contact:
      friction_coeff: 0.4
      friction_faces: 4
      patch_half_length_x: 0.08        # [m] CoP bound, inside the sole half length (0.09)
      patch_half_length_y: 0.025       # [m] CoP bound, inside the sole half width (0.03)
      torsional_friction_coeff: 0.0
      t_ramp: 0.0                      # [s] force ramp on a support change
    tasks:
      posture: {kp: 55.0, kd: 10.4, weight: 0.2}
      feet:                            # [lin; ang], world axes
        kp: [320, 320, 320, 320, 320, 320]
        kd: [36, 36, 36, 36, 36, 36]
        weight: 100.0
      torso:
        kp: [0, 0, 0, 40, 40, 40]
        kd: [0, 0, 0, 9, 9, 9]
        mask: [0, 0, 0, 1, 1, 1]
        weight: 5.0
      force: {weight: 0.04}
      # The CoM over its reference in the horizontal plane (the height is the
      # posture's). Without it nothing holds the base's horizontal position
      # against the plant: on the sim the stance rocked from foot to foot at
      # ~5.6 Hz and the feet slid ~0.1 m in 10 s.
      com: {kp: [14, 14, 0], kd: [5.2, 5.2, 0], weight: 100.0}
    constraints:
      eom: {}
      contact:                         # Baumgarte on the stance feet, [lin; ang]
        baumgarte: {kp: [0, 0, 100, 100, 100, 100], kd: [20, 20, 20, 20, 20, 20]}
        inactive_lambda: zero
      friction_cone: {zero_torsion_equality: true}
      joint_limit: {position_margin: 0.05, velocity_margin: 0.1}
      torque_limit: {tau_scale: 1.0}
    # Solve health: a run of more than 5 ticks without a valid torque (or with
    # the margins below their floors) is a Fault and latches the controller;
    # 50 good ticks in a row return Degraded to Nominal.
    health:
      max_invalid_ticks: 5
      recover_valid_ticks: 50
