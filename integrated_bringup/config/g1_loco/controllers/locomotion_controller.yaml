# locomotion_controller — the humanoid whole-body locomotion controller (g1_loco)
#
# Registered (integrated_bringup controllers/locomotion_controller.hpp): every
# profile that ships this file runs it, so this file must configure. It is not
# the initial controller — sim.yaml starts demo_joint_controller, and the
# operator switches to this one (/rtc_cm/switch_controller) once the robot
# stands. The CM loader merges the fragments below (`include:`).
#
# What each part of the controller is configured with lives in a fragment under
# locomotion/ (rtc_controller_manager README, `include:`):
#   locomotion/model.yaml     which frames and device groups it works on (model.*)
#   locomotion/runtime.yaml   gains, fault, state source, topics, logs
#   locomotion/command.yaml   the operator velocity command filter (command.*)
#   locomotion/gait.yaml      the gait table and its transition thresholds (gait.*)
#   locomotion/swing.yaml     the swing foot reference and the support surface (swing.* · terrain.*)
#   locomotion/reference.yaml the stage reference the OCP tracks (reference.*)
#   locomotion/whole_body_qp.yaml the whole-body QP it solves each tick (whole_body_qp.*)
#   locomotion/mpc.yaml       the whole-body MPC's OCP, its weights and solver budgets (mpc.*)
# command / gait / swing / terrain / reference are the planner's: read when mpc.enabled is
# true (the controller then follows the MPC's plan — controllers/locomotion_controller.hpp).
include:
  - locomotion/model.yaml
  - locomotion/runtime.yaml
  - locomotion/command.yaml
  - locomotion/gait.yaml
  - locomotion/swing.yaml
  - locomotion/reference.yaml
  - locomotion/whole_body_qp.yaml
  - locomotion/mpc.yaml
locomotion_controller: {}
