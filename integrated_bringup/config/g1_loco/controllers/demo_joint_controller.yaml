# DemoJointController — g1_loco (Unitree G1 whole body, floating base in sim,
# + synthetic p1b_surrogate right hand)
#
# Per-device joint-space quintic trajectories with hand fingertip FK. On this
# robot the primary group `g1` is the whole body (legs 12 + waist 3 + arms
# 4 + 4), so "arm" below means that 23-joint group. The controller holds the
# measured pose; what keeps the robot standing is the simulator's position
# servos (mujoco_simulator.yaml), fed the hold through `pd_feedforward`.
#
# Shared demo parameters (virtual TCP, grasp, force-PI) live in demo_shared.yaml.
demo_joint_controller:
  # Primary group width. Must equal devices.g1.joint_state_names (23) and the
  # length of estop.arm_safe_position. Capacity: 32.
  arm_dof: 23

  # ── Trajectory generation ─────────────────────────────────────────────────
  # Quintic rest-to-rest. Duration = max joint distance / speed, then extended
  # until the peak velocity (15/8 × Δq / T) is within the max below.
  robot_trajectory_speed: 0.78      # rad/s, > 0
  hand_trajectory_speed: 3.14       # rad/s, > 0
  robot_max_traj_velocity: 3.14     # rad/s — well under the 20–37 rad/s joint ratings
  hand_max_traj_velocity: 6.28      # rad/s

  # ── Hand contact-stop (required block — LoadConfig throws on a missing key) ─
  # Same hand layout as g1_p1b, same values. The sim hand has no sensors, so
  # the guard never fires here.
  fsm:
    contact_stop_release_eps: 0.005 # rad, hand contact-stop release hysteresis
    contact_stop_lpf_cutoff_hz: 15.0 # Hz, Bessel LPF cutoff for latched hold
    contact_stop_force_lpf_cutoff_hz: 50.0 # Hz, Bessel LPF on the fingertip force
    contact_stop_force_guard_delta_n: 4.0 # N, per-axis |Δ| reject threshold, (0, 1000]
    contact_stop_force_guard_max_hold_ticks: 6 # ticks, [0, 1000]

  # ── E-STOP ────────────────────────────────────────────────────────────────
  estop:
    # rad, 23 values in devices.g1.joint_state_names order; the length must
    # equal arm_dof. The MJCF `stand` keyframe — the pose the robot stands in,
    # so an E-STOP ramps toward standing rather than toward a straight-leg
    # pose the servos would have to catch.
    arm_safe_position:
      - -0.3  # left_hip_pitch
      - 0.0   # left_hip_roll
      - 0.0   # left_hip_yaw
      - 0.6   # left_knee
      - -0.3  # left_ankle_pitch
      - 0.0   # left_ankle_roll
      - -0.3  # right_hip_pitch
      - 0.0   # right_hip_roll
      - 0.0   # right_hip_yaw
      - 0.6   # right_knee
      - -0.3  # right_ankle_pitch
      - 0.0   # right_ankle_roll
      - 0.0   # waist_yaw
      - 0.0   # waist_roll
      - 0.0   # waist_pitch
      - 0.0   # left_shoulder_pitch
      - 0.0   # left_shoulder_roll
      - 0.0   # left_shoulder_yaw
      - 0.0   # left_elbow
      - 0.0   # right_shoulder_pitch
      - 0.0   # right_shoulder_roll
      - 0.0   # right_shoulder_yaw
      - 0.0   # right_elbow

  # PD position target + per-joint feedforward torque (zero from this
  # controller). The simulator switches the body group to its PD-feedforward
  # mode on the first such command and turns that group's gravity compensation
  # off, so the servos carry the full weight — the plant the walking MPC will
  # drive. Anything but position | torque | pd_feedforward is refused.
  command_type: "pd_feedforward"

  # ── Topics ────────────────────────────────────────────────────────────────
  # Both groups are claimed (each has a target subscription): the sim waits
  # for a command from the body every step and the fake hand echoes its own.
  topics:
    g1:
      subscribe:
        - topic: "g1/joint_goal"
          role: "target"
      publish:
        # One TF publisher per controller. Frames (parent `pelvis`):
        #   base_adapter_actual           — the right arm's end / hand mount
        #   l_<finger>_tip_bracket_actual — the four fingertips
        #   virtual_tcp_actual
        - topic: "transforms"
          role: "robot_transforms"
    p1b:
      subscribe:
        - topic: "p1b/joint_goal"
          role: "target"

  # ── Controller-owned CSV logs ─────────────────────────────────────────────
  # Instance = <device group>_state; the files land in the session directory.
  # g1_state carries all 23 joints. No p1b_sensor: the fake hand has no lane.
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: g1_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: p1b_state
