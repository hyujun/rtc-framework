# sim overlay — locomotion_controller's velocity command from a gamepad (sensor_msgs/Joy)
#
#   ros2 launch integrated_bringup sim_g1_loco.launch.py enable_mpc:=true teleop:=virtual
#   (teleop:=pad for a real pad; teleop picks this file through command_input)
#
# command_input:=joy applies this file right after the enable_mpc mapping and
# before any sim_overlay:=, so a user overlay still wins. It replaces the
# Twist path (runtime.yaml velocity_command) with a Joy in the standard gamepad
# layout (rtc_teleop_input config/standard_gamepad.yaml): left stick up = +v_x,
# left = +v_y, right stick left = +yaw rate, each axis × command.v_max, right
# stick up = +pelvis height rate × command.hdot_max (integrated, clamped to
# [h_min, h_max]); the command is zero unless LB (leftshoulder) is held. The
# triggers stay unmapped: rtc_teleop_input's help combination is LT+RT
# (teleop_input.yaml). Schema: controllers/locomotion/joy_command.hpp.
#
# The controller YAML has no `type` / `joy` keys (a `joy:` map under type twist
# is refused), so at configure the controller manager WARNs, one line per key,
# that these override paths are not in the YAML — expected for this overlay.
integrated_rt_controller:
  ros__parameters:
    locomotion_controller:
      velocity_command:
        type: "joy"
        topic: "g1/joy"
        joy:
          linear_x: "lefty"
          linear_y: "leftx"
          angular_z: "rightx"
          height_rate: "righty"
          deadman: "leftshoulder"
