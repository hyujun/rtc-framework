# b7_p2/hand_joint_command_gui.yaml -- joint_command_gui (rtc_tools) 설정, b7 proto2 두 손
#
# ROS 파라미터 파일이 아니라 GUI 가 직접 읽는 YAML 이다 (`config` 파라미터로 경로를 준다).
# 손 노드 (udp_hand_node_p2.yaml, namespace:=/p2) 와 같은 DDS 도메인의 아무 PC 에서:
#
#   ros2 run rtc_tools joint_command_gui --ros-args -p config:=$(ros2 pkg prefix integrated_bringup)/share/integrated_bringup/config/b7_p2/hand_joint_command_gui.yaml
#
# 키 · 기본값 · 안전 규칙의 SSoT 는 rtc_tools/gui/joint_command_model.py 의 docstring 이다.
# 사용 조건 (손 노드의 이름 대응표) 은 rtc_tools/README.md 의 joint_command_gui 절.

# 손 노드의 namespace. 손마다 <namespace>/<side>/{joint_states, joint_command, link_status}
namespace: /p2
sides: [right, left]

publish_rate_hz: 50.0    # 활성 손마다 JointCommand 발행 주기 [Hz] (1 ~ 1000)
slew_rate_deg_s: 90.0    # 명령이 목표를 따라가는 최대 속도 [deg/s] (0 = 제한 없음)
stale_timeout_ms: 100.0  # joint_states 가 이보다 오래되면 그 손을 자동 Disable [ms]

# 손별 · 관절별 슬라이더 초기 범위 [deg] — {관절 이름: [min, max]}, 절대 상한 ±180.
# 관절 이름은 손 노드의 joint_states 이름이다 (udp_hand_node_p2.yaml 의 offsets 주석 순서).
# 적지 않은 관절은 GUI 가 처음 받은 측정 위치 ±10 deg 로 시작한다. GUI 에서 바꾼 범위는
# 저장되지 않는다 (Reset ranges 로 이 값으로 돌아간다).
ranges_deg:
  right: {}
  left: {}
