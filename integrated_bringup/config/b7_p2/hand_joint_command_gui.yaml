# b7_p2/hand_joint_command_gui.yaml -- joint_command_gui (rtc_tools) 설정, b7 proto2 두 손
#
# ROS 파라미터 파일이 아니라 GUI 가 직접 읽는 YAML 이다 (`config` 파라미터로 경로를 준다).
# 손 노드 (udp_hand_node_p2.yaml, namespace:=/p2) 와 같은 DDS 도메인의 아무 PC 에서:
#
#   ros2 run rtc_tools joint_command_gui --ros-args -p config:=$(ros2 pkg prefix integrated_bringup)/share/integrated_bringup/config/b7_p2/hand_joint_command_gui.yaml
#
# 키 · 기본값 · 안전 규칙의 SSoT 는 rtc_tools/gui/joint_command_model.py 의 docstring 이다.
# 사용 조건 (손 노드의 이름 대응표) 은 rtc_tools/README.md 의 joint_command_gui 절.

# 손 노드의 namespace. 손마다 <namespace>/<side>/{joint_states, joint_command, link_status}
namespace: /p2
sides: [right, left]

publish_rate_hz: 50.0    # 활성 손마다 JointCommand 발행 주기 [Hz] (1 ~ 1000)
slew_rate_deg_s: 360.0  # 명령이 목표를 따라가는 최대 속도 [deg/s] (0 = 제한 없음)
stale_timeout_ms: 100.0  # joint_states 가 이보다 오래되면 그 손을 자동 Disable [ms]

# 손별 · 관절별 슬라이더 초기 범위 [deg] — {관절 이름: [min, max]}, 절대 상한 ±180.
# 관절 이름은 손 노드의 joint_states 이름이다 (udp_hand_node_p2.yaml 의 손별 joint_state_names).
# 적지 않은 관절은 GUI 가 처음 받은 측정 위치 ±10 deg 로 시작한다. GUI 에서 바꾼 범위는
# 저장되지 않는다 (Reset ranges 로 이 값으로 돌아간다).
#
# right: 2026-10-29 PC#3 run 두 번 (hand_gui_261029_114329 · hand_gui2_261029_151906) 에서
# 측정 위치가 실제로 간 구간을 기준으로 정한 값.
# left: right 와 같은 크기, 부호는 hand_gui2_261029_151906 의 왼손 측정 —
# right_ · left_active_thumb_pip_link02_joint 만 같고 나머지 9 개는 반대다. 오른손 값을 그대로
# 옮기지 않는다.
# 상한이 기구 끝단 너머일 수 있다: right_active_ring_mcp_joint 는 첫 run 에서 82.7 deg 에 멈추고
# ~1 A 를 유지했다 (명령 88.9). 끝단에 닿으면 전류가 포화된 채 남으니 목표를 끝단 안쪽으로 둔다.
# Enable 순간의 측정 위치가 범위 밖이면 Enable 이 거부된다 — Disable 상태에서 그 관절을 넓힌다.
ranges_deg:
  right:
    right_cmc_01_joint: [-120.0, -5.0]
    right_cmc_02_joint: [-85.0, -5.0]
    right_thumb_mcp_joint: [5.0, 175.0]
    right_active_thumb_pip_link02_joint: [5.0, 85.0]
    right_index_mcp_rotate_joint: [2.0, 14.0]
    right_index_mcp_joint: [-85.0, -5.0]
    right_active_index_pip_joint: [-85.0, -5.0]
    right_middle_mcp_joint: [-85.0, -5.0]
    right_active_middle_pip_joint: [-85.0, -5.0]
    right_active_ring_mcp_joint: [5.0, 85.0]
  left:
    left_cmc_01_joint: [5.0, 120.0]
    left_cmc_02_joint: [5.0, 85.0]
    left_thumb_mcp_joint: [-175.0, -5.0]
    left_active_thumb_pip_link02_joint: [5.0, 85.0]
    left_index_mcp_rotate_joint: [-14.0, -2.0]
    left_index_mcp_joint: [5.0, 85.0]
    left_active_index_pip_link02_joint: [5.0, 85.0]
    left_middle_mcp_joint: [5.0, 85.0]
    left_active_middle_pip_link02_joint: [5.0, 85.0]
    left_active_ring_mcp_joint: [-85.0, -5.0]
