# demo_compliance_controller (#469 S2) — the sibling demo_task_controller.yaml
# with its top-level key renamed, plus the blocks this controller owns outright.
#
# It began as a copy, and most of it still is: outside the blocks this
# controller owns and the renamed gains below, the two files must stay key-for-
# key identical, and test_compliance_task_equivalence.cpp compares them that
# way. Editing any other value here breaks that comparison, which is the
# intended way to find out that the copy has started to drift.
#
# The BEHAVIOURAL half of that equivalence is now narrower: since S3 coupled the
# §7 admittance law, the two controllers agree only while the wrench source is
# withheld. What the law does is asserted by
# test_compliance_admittance_coupling.cpp instead.
#
# THE TASK GAINS ARE SPELLED DIFFERENTLY FROM THE SIBLING'S (#469 D-A13):
# `ik_kp_pos` / `ik_kp_rot` / `nullspace_kp` here vs `kp_translation` /
# `kp_rotation` / `null_kp` there. Same quantity, same value — the §7 parser
# reads THIS node, and carrying both spellings would ship a key that is parsed
# and never read. The values must still match the sibling's; a separate test
# asserts that pairwise.
#
# The rest of the §7 schema (desired_inertia / damping / stiffness, the §7.4
# displacement box, the §7.5 velocity caps, §10.6 staleness) is READ from this
# node and currently takes the core defaults in
# rtc_controllers/include/rtc_controllers/params/task_admittance_params.hpp.
# Values are chosen against hardware in S5; writing numbers here before they are
# measured would ship a tuning nobody validated.
#
# S3 adds the admittance gains HERE, not in the sibling, and moves each newly
# owned block into that test's exclusion list as it does so.
demo_compliance_controller:
  # ── Arm DoF (required) ─────────────────────────────────────────────────────
  # Authoritative arm joint count at LoadConfig time (#340). The length of
  # `estop.arm_safe_position` is validated against this key — not the reverse,
  # which is what used to make that cross-check vacuous.
  arm_dof: 6

  # ── CLIK gains (robot arm task-space control) ──────────────────────────────
  ik_kp_pos: [5.0, 5.0, 5.0]         # Translation proportional gain (x, y, z) [1/s]
  ik_kp_rot: [2.0, 2.0, 2.0]            # Rotation proportional gain (rx, ry, rz) [1/s]
  # §6.5 σ_min-adaptive DLS (#282). These replaced a single constant λ
  # (`damping`), which is retired: a constant λ and the ceiling of a ramp are
  # not the same quantity, so it is reported and ignored rather than mapped.
  singularity_threshold: 0.02         # σ₀ — damping engages below this σ_min(J)
  max_damping: 0.05                   # λ_max — ceiling of the §6.5 ramp
  # σ₀ is read by whichever branch `control_6dof` selects, and σ_min does not
  # mean the same thing in the two: the 6-DOF branch feeds the mixed-unit 6×n J
  # (m/rad rows plus dimensionless axis rows, so σ_min is dominated by the O(1)
  # rotational part), the 3-DOF branch feeds the translation-only 3×n J, whose
  # σ_min scales with link length. This value is tuned for the 6-DOF lane below;
  # flipping `control_6dof` at runtime reinterprets it and it must be retuned.

  # ── Null-space configuration ────────────────────────────────────────────────
  enable_null_space: false            # Enable null-space joint centering
  nullspace_kp: 0.5                       # Null-space proportional gain

  # ── 6-DOF mode ──────────────────────────────────────────────────────────────
  control_6dof: true                # false=3-DOF (position only), true=6-DOF (position+orientation)

  # ── Trajectory speed ───────────────────────────────────────────────────────
  # Desired speed for trajectory duration calculation.
  # Duration = max_dist / trajectory_speed.
  trajectory_speed: 0.01              # TCP max translational speed [m/s]
  trajectory_angular_speed: 0.08727   # TCP max rotational speed [rad/s] (6-DOF mode)
  hand_trajectory_speed: 3.14         # Hand motor trajectory speed [rad/s]

  # ── Trajectory velocity limits ──────────────────────────────────────────────
  # Max peak velocity during quintic trajectory.
  # Duration is extended so that peak velocity ≤ this limit.
  # (quintic rest-to-rest peak = 15/8 × Δ / T)
  max_traj_velocity: 0.1              # Max TCP translational velocity [m/s]
  max_traj_angular_velocity: 0.7854   # Max TCP angular velocity [rad/s] (6-DOF mode)
  hand_max_traj_velocity: 6.28       # Max hand motor velocity [rad/s]

  # ── E-STOP ──────────────────────────────────────────────────────────────────
  # Joint position the E-STOP path drives the arm toward (rad, length = arm DoF).
  # Required — LoadConfig throws if missing or wrong length.
  estop:
    arm_safe_position:           # rad, 6 values (must equal arm_dof); UR5e home pose
      - 0.0
      - -1.57
      - 1.57
      - -1.57
      - -1.57
      - 0.0

  # ── FSM / trajectory tuning (required) ─────────────────────────────────────
  fsm:
    pi_rotation_margin: 0.15        # rad, split quintic trajectory when
                                    # |angle| > π - margin (stability near θ=π)
                                    # Range: [0, π/2]
    contact_stop_release_eps: 0.005 # rad, hand contact-stop release hysteresis
    contact_stop_lpf_cutoff_hz: 20.0 # Hz, Bessel LPF cutoff for latched hold
    # Per-axis LPF on the fingertip force contact_stop thresholds. Higher cutoff
    # than the hold LPF above on purpose: the 4th-order Bessel's DC group delay
    # is ~2.11/(2*pi*fc), so 20 Hz would delay the freeze by ~17 ms out of the
    # 50 ms BT tick this latch covers; 50 Hz costs ~6.7 ms.
    contact_stop_force_lpf_cutoff_hz: 50.0
                                    # (target↔actual delta to reject sensor noise)
                                    # Range: [0, 0.1]

  # ── Shared parameters ───────────────────────────────────────────────────────
  # Virtual TCP, grasp detection, and force-PI grasp parameters are loaded from
  # config/ur5e_p1a/controllers/demo_shared.yaml. To override any shared key locally,
  # add it under this section — per-controller values take precedence.

  # ── Output type ─────────────────────────────────────────────────────────────
  command_type: "position"

  # ── Topic configuration ─────────────────────────────────────────────────────
  # All controller-YAML topics are controller-owned (issue #138): the
  # per-controller LifecycleNode owns each sub/pub; relative paths resolve
  # under namespace /<config_key>/.
  # Phase 4: device-wire lanes moved to devices.<group>.backend.
  topics:
    ur5e:
      subscribe:
        - topic: "ur5e/joint_goal"
          role: "target"
      publish:
        # Per-controller TF (Phase 3): see demo_joint_controller.yaml.
        - topic: "transforms"
          role: "robot_transforms"
    p1a:
      subscribe:
        - topic: "p1a/joint_goal"
          role: "target"
      # GraspState / ToFSnapshot publishers are controller-owned and created
      # in on_configure (SetupGraspStatePublisher / SetupToFSnapshotPublisher);
      # they no longer have a YAML role mapping.

  # ── Controller-owned CSV logs (Phase C) ────────────────────────────────────
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: ur5e_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: p1a_state
    - msg_type: rtc_msgs/DeviceSensorLog
      instance: p1a_sensor
    - msg_type: integrated_bringup/PullEstimatorLog
      instance: pull_estimator
    - msg_type: integrated_bringup/MomentumObserverLog
      instance: momentum_observer
    # §6.5 singularity diagnostics (#310): sigma_min / lambda^2 per tick.
    # Controller-private POD (no rtc_msgs) — see logging/task_diag_log_pod.hpp.
    - msg_type: integrated_bringup/TaskDiagLog
      instance: task_diag

    # Per-tick Force-PI servo + stiffness-estimator diagnostics (#428).
    # Controller-private POD (no rtc_msgs) — see logging/grasp_diag_log_pod.hpp.
    # Registered only when demo_shared.yaml carries a `force_pi_grasp` block;
    # otherwise on_configure logs an INFO naming the absent file.
    - msg_type: integrated_bringup/GraspDiagLog
      instance: grasp_diag

    # Per-tick §7 task-admittance diagnostics (#469 S4): the wrench the law
    # actually consumed, the source verdict that gated it, the §10.7 ramp, the
    # FSM state, x̃/ν_c and the K_p/K_d/Λ_d snapshot that makes a stored row
    # decodable without this file. Controller-private POD (no rtc_msgs) — see
    # logging/compliance_diag_log_pod.hpp. Registered whenever this controller
    # configures, because `external_wrench.source` below is required.
    - msg_type: integrated_bringup/ComplianceDiagLog
      instance: compliance_diag

  # ── External wrench source (#469) ──────────────────────────────────────────
  # Which physical estimate drives the admittance law. Configure-time and
  # exclusive — one source per controller instance, never a fusion (D-A4): the
  # pull estimate (force on the grasped object) and a momentum-observer residual
  # (which contains the same force, transmitted through the hand) would roughly
  # double if added, so #470's "do not sum two 6D sources" rule fires on exactly
  # this pair.
  #
  # Required with no default, and the ONLY accepted value today. A
  # momentum-observer source is designed but not implemented (#469 S6), so
  # writing `momentum_observer` here is refused by the same path as a typo — the
  # bring-up stops rather than the arm running on an estimate nobody selected.
  #
  # S2 parses this and stops. S3 is what turns it into a wrench.
  external_wrench:
    source: "pull_estimator"
