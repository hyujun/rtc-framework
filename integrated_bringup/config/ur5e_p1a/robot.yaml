# ur5e_p1a/robot.yaml — real-hardware delta (overlaid on _base.yaml)
# Used by robot.launch.py (UR driver + udp_hand_driver).
# Loaded AFTER _base.yaml, which holds all mode-agnostic config (URDF/model
# topology, joint & sensor rosters, limits, control_rate, logging). This file
# owns ONLY what differs from simulation: real backends + wire topics, the
# command/motor rosters, E-STOP enablement, hardware init timing, and the
# startup controller.
/**:
  ros__parameters:
    # ── Initial controller ────────────────────────────────────────────────────
    initial_controller: "demo_wbc_controller"

    # ── Initialization timeout ────────────────────────────────────────────────
    init_timeout_sec: 30.0 # E-STOP + shutdown if no robot/target data (sec)

    # ── E-STOP configuration ──────────────────────────────────────────────────
    enable_estop: true # E-STOP timeout monitoring
    device_timeout_values: [1000.0, 1000.0] # ms — tight for real HW watchdog

    # ── Device backends + hardware rosters ────────────────────────────────────
    devices:
      ur5e:
        backend:
          type: "ur_driver_native"  # real UR5e via ros2_control
          state_topic: "/joint_states"
          command_topic: "/forward_position_controller/commands"
        # forward_position_controller receives Float64MultiArray.
        # Order matches joint_state_names; ur_driver_native uses these to
        # build a reorder map between controller output and the wire format.
        joint_command_names:
          - "shoulder_pan_joint"
          - "shoulder_lift_joint"
          - "elbow_joint"
          - "wrist_1_joint"
          - "wrist_2_joint"
          - "wrist_3_joint"
      hand:
        backend:
          type: "udp_hand_native"   # UDP hand driver — joint + motor + sensor lanes
          state_topic:   "/hand/joint_states"
          command_topic: "/hand/joint_command"
          motor_topic:   "/hand/motor_states"
          sensor_topic:  "/hand/sensor_states"
        motor_state_names:
          - "motor_1"
          - "motor_2"
          - "motor_3"
          - "motor_4"
          - "motor_5"
          - "motor_6"
          - "motor_7"
          - "motor_8"
          - "motor_9"
          - "motor_10"
        # has_native_contact / has_native_displacement advertise that the
        # configured backend populates the corresponding inference_data slots
        # with real signal (not zero-fill). Controllers consult these to
        # branch between native + derived contact decision paths. udp_hand
        # exposes both only when fingertip_ft_inferencer is actually enabled
        # — keep these in lockstep with the driver's ft_inferencer.enabled
        # YAML; setting true here while the driver runs without inference
        # silently degrades grasp detection to "always false probability".
        # (Sensor packing counts live in _base sensor_layout.)
        sensor_layout:
          has_native_contact:             true
          has_native_displacement:        true
