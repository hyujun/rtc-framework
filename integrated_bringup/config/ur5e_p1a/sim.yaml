# ur5e_p1a/sim.yaml — MuJoCo-simulation delta (overlaid on _base.yaml)
# Used by sim_ur5e_p1a.launch.py. For real robot, use robot.yaml instead.
# Loaded AFTER _base.yaml, which holds all mode-agnostic config (URDF/model
# topology, joint & sensor rosters, limits, control_rate, logging). This file
# owns ONLY what differs from real hardware: MuJoCo backends + sim topics,
# sim-time sync, relaxed E-STOP/timeouts, and the startup controller.
/**:
  ros__parameters:
    # ── Initial controller ────────────────────────────────────────────────────
    initial_controller: "demo_wbc_controller"

    # ── Initialization timeout ────────────────────────────────────────────────
    init_timeout_sec: 0.0 # Disabled for simulation (no real hardware init)

    # ── Simulation sync ──────────────────────────────────────────────────────
    use_sim_time_sync: true       # CV-based wakeup (sim), false = clock_nanosleep (real)
    sim_sync_timeout_sec: 5.0     # Shutdown if no state received within timeout

    # ── E-STOP configuration (relaxed for simulation) ────────────────────────
    enable_estop: false # Disabled for simulation
    device_timeout_values: [10000.0, 10000.0] # Relaxed for sim startup

    # ── Scene world ──────────────────────────────────────────────────────────
    urdf:
      extra_frames:
        scene_world:
          # The scene's world (#779): the frame a task goal names with
          # header.frame_id "scene_world" (the other name taken is the arm's
          # root_link). Placement of the MuJoCo world in the arm root,
          # p_root = R(rpy)·p_world + xyz — the urdf.extra_frames convention.
          # Sim only: robot.yaml has none, so a real arm refuses world goals
          # until a calibrated value is added there. Every sim overlay that
          # swaps the scene defines its own (test_shipped_scene_world).
          # scene_with_hand.xml: the arm stands at the world origin and `base` is world-aligned.
          parent: "base"
          xyz: [0.0, 0.0, 0.0]
          rpy: [0.0, 0.0, 0.0]
          # Checked against the scene (FK, #779) — not a placeholder.
          provisional: false

    # ── Device backends (MuJoCo bridge) ───────────────────────────────────────
    devices:
      ur5e:
        backend:
          type: "mujoco_native"            # sim mode: MuJoCo bridge
          state_topic: "/joint_states"     # sim publishes full URDF joints here
          command_topic: "/ur5e/joint_command"
      p1a:
        backend:
          type: "mujoco_native"            # sim mode: MuJoCo bridge (no motor / sensor lanes)
          state_topic: "/p1a/joint_states"
          command_topic: "/p1a/joint_command"
        # has_native_* both false: mujoco backend does not synthesize contact
        # probability or displacement vectors (sensor_topic is unset in sim).
        # Controllers fall back to |force| > grasp_force_threshold derive.
        # (Sensor packing counts live in _base sensor_layout.)
        sensor_layout:
          has_native_contact:             false
          has_native_displacement:        false
