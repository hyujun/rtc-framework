# demo_catching_controller — the closed_form planner law (ur5e_p1b)
#
# A fragment of ../demo_catching_controller.yaml (its `include:` list). The CM
# merges it into that file's tree; every key keeps its full path.
#
# The law: the soft-catch reference (SoftCatchTranslation) up to t_c, then the
# constant-deceleration target (DecelTarget). Followed when
# `planner.segment.mode: closed_form` (the main file).
#
# The search ranks candidates by this law's rollout under every mode, on its
# own copy of these five values (planner.search.grid.reference.*,
# planner.search.grid.stop.a_dec in search_grid.yaml). Under closed_form the
# copy must equal what is written here, or the controller parks.
demo_catching_controller:
  catching:
    # ── Soft-catch reference (SoftCatchTranslation) ─────────────────────────────
    # `provisional: true` covers the block: `a_max` is not decided, and a TBD
    # would refuse configure in sim, which (CM latches `bring_up_failed`) takes
    # every controller on the robot down. Provisional warns in sim, blocks a
    # real arm.
    reference:
      provisional: true
      # rad/s. omega*h = 0.02 at 500 Hz, far below the discretisation bound 0.828.
      omega: 10.0
      # Critically damped; the planner's closed-form terminal error assumes it.
      zeta: 1.0
      # m/s. Derived: max v_dir,max over accepted catch candidates at the joint
      # ratings, times eta_v = 0.9. A real arm may only lower it.
      v_max: 3.5
      # m/s^2. Provisional. On the sim plant at omega 10, 21 saturated the
      # reference on 18-25 % of active ticks and aborted 7-12 of 56 throws; 30
      # saturated 1 % and aborted none at the same catch rate (#537). Must stay
      # >= supervisor.decel.a_dec. omega 15-20 follow prediction noise and lose
      # 3/4 of the catches.
      a_max: 30.0

    # ── Deceleration (DecelTarget) ──────────────────────────────────────────────
    # The closed_form DECEL target's constant deceleration. The search's
    # stopping-point reservation reads its own copy,
    # planner.search.grid.stop.a_dec. Requires a_dec <= reference.a_max.
    supervisor:
      decel:
        a_dec: 10.0
