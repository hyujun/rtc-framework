demo_joint_controller:
  # ── Arm DoF (required) ─────────────────────────────────────────────────────
  # Authoritative arm joint count at LoadConfig time (#340). The length of
  # `estop.arm_safe_position` is validated against this key — not the reverse,
  # which is what used to make that cross-check vacuous.
  arm_dof: 6

  # ── Trajectory speed ───────────────────────────────────────────────────────
  # Desired joint speed for trajectory duration calculation [rad/s].
  # Duration = max_joint_dist / trajectory_speed.
  robot_trajectory_speed: 0.78
  hand_trajectory_speed: 3.14

  # ── Trajectory velocity limits ──────────────────────────────────────────────
  # Max peak joint velocity during quintic trajectory [rad/s].
  # Duration is extended so that peak velocity ≤ this limit.
  # (quintic rest-to-rest peak = 15/8 × Δq / T)
  robot_max_traj_velocity: 3.14
  hand_max_traj_velocity: 6.28

  # ── Shared parameters ───────────────────────────────────────────────────────
  # Virtual TCP, grasp detection, and force-PI grasp parameters are loaded from
  # config/ur5e_p1b/controllers/demo_shared.yaml. To override any shared key locally,
  # add it under this section — per-controller values take precedence.

  # ── FSM tuning ──────────────────────────────────────────────────────────────
  # Required — LoadConfig throws if any key is missing or out of range.
  fsm:
    contact_stop_release_eps: 0.005 # rad, hand contact-stop release hysteresis
    contact_stop_lpf_cutoff_hz: 15.0 # Hz, Bessel LPF cutoff for latched hold
    # Per-axis LPF on the fingertip force contact_stop thresholds. Higher cutoff
    # than the hold LPF above on purpose: the 4th-order Bessel's DC group delay
    # is ~2.11/(2*pi*fc), so 20 Hz would delay the freeze by ~17 ms out of the
    # 50 ms BT tick this latch covers; 50 Hz costs ~6.7 ms.
    contact_stop_force_lpf_cutoff_hz: 50.0
    # Delta-spike guard on the raw fingertip force BEFORE the LPF above. The
    # 260730_1017 session showed 6 samples over 6 N (index/ring fz), each
    # lasting exactly 2 ticks before returning to ~0.0 N; fed straight into the
    # filter, one 6.406 N spike left ~0.170 N of filtered tail behind it.
    # A triplet whose per-axis change from the last accepted sample exceeds this
    # — or that carries NaN/Inf — is replaced by the last accepted triplet at the
    # LPF INPUT ONLY. Raw force is untouched (CSV ft_<f>_fx|fy|fz, GraspState,
    # pull estimator).
    contact_stop_force_guard_delta_n: 4.0 # N, per-axis |Δ| reject threshold, (0, 1000]
    # Consecutive hold ticks before a sustained out-of-band raw value is accepted
    # anyway. Without this cap a genuine fast contact step (|Δ| > 4 N on every
    # tick) would be rejected forever and contact_stop could never fire. p1b runs
    # 6 ticks (control_rate 500 Hz -> ~12 ms), raised from the 2 ticks that only
    # covered the spikes above, so longer bursts are held too; a real step pays
    # that delay on top of the filter's own ~6.7 ms group delay. NaN/Inf never
    # escape this cap. 0 disables the delta hold.
    contact_stop_force_guard_max_hold_ticks: 6 # ticks, [0, 1000]

  # ── E-STOP ──────────────────────────────────────────────────────────────────
  # Joint position the E-STOP path drives the arm toward (rad, length = arm DoF).
  # Required — LoadConfig throws if missing or wrong length.
  estop:
    arm_safe_position:           # rad, 6 values (must equal arm_dof); UR5e home pose
      - 0.0
      - -1.57
      - 1.57
      - -1.57
      - -1.57
      - 0.0

  # ── Output type ─────────────────────────────────────────────────────────────
  command_type: "position"

  # ── Topic configuration ─────────────────────────────────────────────────────
  # Phase 4: device-wire lanes moved to devices.<group>.backend in
  # sim.yaml / robot.yaml. Controller YAML keeps controller-owned roles only.
  # All controller-YAML topics are controller-owned (issue #138): the
  # per-controller LifecycleNode owns each sub/pub; relative paths resolve
  # under namespace /<config_key>/.
  topics:
    ur5e:
      subscribe:
        - topic: "ur5e/joint_goal"
          role: "target"
      publish:
        # Per-controller TF (Phase 2): controller당 1 토픽, tf2_msgs/TFMessage.
        # frame_id는 system YAML urdf.{sub,tree}_models 기반 자동 결정 +
        # virtual_tcp. Single publisher → entry는 첫 group(ur5e)에만 둠 (D-10).
        - topic: "transforms"
          role: "robot_transforms"
    p1b:
      subscribe:
        - topic: "p1b/joint_goal"
          role: "target"
      # GraspState / ToFSnapshot publishers are controller-owned and created
      # in on_configure (SetupGraspStatePublisher / SetupToFSnapshotPublisher);
      # they no longer have a YAML role mapping.

  # ── Controller-owned CSV logs (Phase C: msg-type-driven schema) ─────────────
  # Each entry maps an rtc_msgs/<*Log> message type to a CSV file under
  # <session>/controllers/<config_key>/<instance>.csv. Schema is the
  # corresponding rtc_msgs message; RT path uses integrated_bringup POD mirrors
  # (kMaxJoints=16, kMaxFingertips=8).
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: ur5e_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: p1b_state
    - msg_type: rtc_msgs/DeviceSensorLog
      instance: p1b_sensor
    - msg_type: integrated_bringup/PullEstimatorLog
      instance: pull_estimator
    - msg_type: integrated_bringup/MomentumObserverLog
      instance: momentum_observer

    # Per-tick Force-PI servo + stiffness-estimator diagnostics (#428).
    # Controller-private POD (no rtc_msgs) — see logging/grasp_diag_log_pod.hpp.
    # Registered only when demo_shared.yaml carries a `force_pi_grasp` block;
    # otherwise on_configure logs an INFO naming the absent file.
    - msg_type: integrated_bringup/GraspDiagLog
      instance: grasp_diag
