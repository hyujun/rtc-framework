demo_shared:
  # ── Virtual TCP (fingertip-based control point) ─────────────────────────────
  # Mode: "disabled" (default), "centroid", "weighted", "constant"
  virtual_tcp_mode: "centroid"
  virtual_tcp_offset: [0.0, 0.0, 0.1]   # constant mode: [x, y, z] in TCP frame [m]
  virtual_tcp_orientation: [1.5708, 0.0, -1.5708]  # RPY [rad] orientation of vtcp in TCP frame

  # ── Grasp detection ─────────────────────────────────────────────────────────
  # Capability-aware: controllers branch on
  # devices.<hand>.sensor_layout.has_native_contact (set in robot/sim yaml):
  #   key                      | sensor A (native contact) | sensor B (force-only)
  #   grasp_contact_threshold  | required (AND with force) | unconsumed
  #   grasp_force_threshold    | required (AND with prob)  | required (only check)
  #   grasp_min_fingertips     | active_count ≥ N (common across types)
  grasp_contact_threshold: 0.5   # [sensor A only] native sigmoid prob threshold (0..1)
  grasp_force_threshold: 1.0     # [common]  |F| threshold [N]
  grasp_min_fingertips: 2        # [common]  grasp_detected = active_count ≥ N

  # ── Grasp controller selection ─────────────────────────────────────────────
  # "contact_stop" (default): force 감지 시 hand position freeze
  # "force_pi": adaptive PI force controller with state machine
  grasp_controller_type: "none"

  # ── Hand joint topology (UR5e p1b 10-DoF hand) ─────────────────────────────
  # Variable per-finger DoF map for p1b profile:
  # thumb:4, index:3, middle:2, ring:1
  hand_finger_joint_map:
    - [0, 1, 2, 3]  # thumb:  CMC_AA, CMC_FE, MCP, DIP_FE
    - [4, 5, 6]     # index:  MCP_AA, MCP_FE, DIP_FE
    - [7, 8]        # middle: MCP_FE, DIP_FE
    - [9]           # ring:   MCP_FE
  # contact_stop release gate per finger.
  # loosen_sign > 0: open when q increases, < 0: open when q decreases.
  hand_release_gate:
    - { joint_index: 1, loosen_sign:  1 }   # thumb_cmc_fe_joint
    - { joint_index: 5, loosen_sign: -1 }   # index_mcp_fe_joint
    - { joint_index: 7, loosen_sign: -1 }   # middle_mcp_fe_joint
    - { joint_index: 9, loosen_sign: -1 }   # ring_mcp_fe_joint

  # ── Force-PI grasp parameters (grasp_controller_type: "force_pi" 전용) ──
  force_pi_grasp:
    # PI gains
    Kp_base: 0.02               # [1/(N*s)] proportional gain base
    Ki_base: 0.002              # [1/(N*s^2)] integral gain base

    # Adaptive gain scheduling
    alpha_ema: 0.95             # stiffness EMA coefficient [0,1]
    beta: 0.3                   # adaptive gain sensitivity

    # Force thresholds
    f_contact_threshold: 0.8    # [N] contact detection threshold
    f_target: 2.0               # [N] target grip force
    f_ramp_rate: 2.0            # [N/s] force reference ramp rate

    # Rate & saturation limits
    ds_max: 0.05                # max ds/dt [1/s]
    delta_s_max: 0.15           # max deformation delta_s after contact
    integral_clamp: 0.1         # integrator saturation

    # State machine timing
    approach_speed: 0.4         # [1/s] approaching ds/dt
    release_speed: 0.3          # [1/s] releasing ds/dt
    settle_epsilon: 0.5         # [N] force convergence threshold
    settle_time: 0.3            # [s] convergence hold time
    contact_settle_time: 0.1    # [s] Contact phase dwell

    # Anomaly detection
    df_slip_threshold: 5.0      # [N/s] slip df/dt threshold
    f_slip_fraction: 0.5        # grip "lost" below f_target * this
    grip_tightening_rate: 0.5   # [N/s] reference increase rate while grip is lost
    grip_decay_rate: 0.1        # [N/s] decay back toward f_target after tightening
    f_max_multiplier: 2.0       # max force = f_target * multiplier

    # Force filter
    # Bessel LPF cutoff [Hz] for the force this law servos on. Applied PER AXIS
    # in the controller (before |F|), independently of the contact_stop bank's
    # fsm.contact_stop_force_lpf_cutoff_hz. The delta-spike guard in front of
    # both banks is shared and lives under fsm.contact_stop_force_guard_*.
    lpf_cutoff_hz: 25.0

    # Finger postures are variable-length per finger DoF.
    # units: "deg" or "rad" (default "rad"). Internally always converted to rad.
    fingers:
      units: "deg"
      finger_names: ["thumb", "index", "middle", "ring"]
      thumb:
        q_open:  [0.0, 0.0, 0.0, 0.0]
        q_close: [30.0, 60.0, 45.0, 45.0]
      index:
        q_open:  [0.0, 0.0, 0.0]
        q_close: [0.0, 60.0, 45.0]
      middle:
        q_open:  [0.0, 0.0]
        q_close: [60.0, 45.0]
      ring:
        q_open:  [0.0]
        q_close: [45.0]

  # ── In-plane pull-force estimator (#167) ────────────────────────────────────
  # Quasi-static external pull on a pinched flat object, from per-fingertip
  # 3-axis forces:  F̂ = -P∥(Σ R_i·C_i(f_i - b_i)·sign + m·g),  P∥ = I - n·nᵀ.
  # Reference frame = robot base (fingertip FK rotations are T_base_fingertip).
  # Key names mirror rtc::grasp::{PullEstimatorParams, PullContactConfig};
  # sample_rate_hz is set from the controller's control_rate at build time.
  # p1b hand = force-only inference lane (stride 7); sensor-lane order
  # [thumb,index,middle,ring] matches the tree-model tip_links order, so
  # fingertip_data_[f] ↔ fingertip_rotations_[f] pair correctly (Stage A-3).
  pull_estimator:
    enabled: true

    # Operating envelope (#234 P-19): the estimate is quasi-static — it assumes
    # the grasped object is in equilibrium, so any in-plane m·a of the object
    # is reported as external pull. The baseline snapshot only cancels a
    # constant offset captured at one instant, and arming it mid-lift bakes
    # that instant's inertia in. Trust the magnitude during slow/steady motion;
    # during arm acceleration treat it as an upper bound. There is no
    # acceleration validity gate yet — the physically correct correction needs
    # the object COM acceleration in the common frame, not the TCP's.

    # Filtering / validity
    filter_cutoff_hz: 5.0        # [Hz] Bessel LPF on the in-plane estimate
    min_valid_contacts: 2        # 2 suffice for [Fx,Fy]; 3rd adds averaging
    decay_time_constant_s: 0.1   # [s] bounded decay on invalid ticks (no hard zero)

    # Diagnostics
    slip_risk_threshold: 1.0     # friction utilization ≥ this ⇒ slip_risk
    # NOTE (#234 P-18): friction_utilization is |f_t| / (μ·f_n) with the μ
    # *assumed* per tip below — not a measured one. Read it as a relative trend
    # indicator ("this tip is closer to sliding than it was"), not an absolute
    # safety margin; the true μ is object- and condition-dependent and none of
    # the values pinned here have been identified experimentally.
    alignment_error_rad: 0.035   # [rad] δθ for grip→in-plane leakage bound (~2°)

    # Gravity model: m·g in base frame [N]. Keep zero while
    # use_baseline_subtraction is on — the grasp-time baseline snapshot removes
    # in-plane gravity AND constant calibration residual in one shot.
    gravity_force: [0.0, 0.0, 0.0]

    # In-plane x axis reference (base frame) — names the force_inplane pair.
    # e_x = this direction projected into the pinch plane, e_y = n x e_x, so
    # [0] reads as the anti-gravity (vertical) pull component and [1] as the
    # horizontal one. Default +Z assumes an upright base; set the true
    # anti-gravity direction otherwise. Falls back to basis continuity when the
    # pinch axis turns parallel to it.
    inplane_x_reference: [0.0, 0.0, 1.0]
    # Do NOT leave this parallel to plane_normal when plane_normal_source is
    # "fixed" (#234 P-17): the projection collapses, the basis silently falls
    # back to a world-axis seed and force_inplane[0] stops being the
    # reference-direction component. on_configure warns, and the published
    # basis_source reports SEED instead of REFERENCE when it happens.
    use_baseline_subtraction: true

    # Plane normal source: "fixed" (plane_normal below, base frame) or
    # "pinch_geometry" — n = (centroid of the non-thumb tips *currently
    # touching* − p_thumb)/‖·‖, recomputed per tick. "Touching" is a hysteresis
    # on |f| alone, deliberately independent of n, so the shape is observed
    # rather than declared: thumb+index, thumb+middle and tripod each yield
    # their own axis, and a finger that is not touching cannot skew the plane.
    plane_normal_source: "pinch_geometry"
    plane_normal: [0.0, 0.0, 1.0]   # consumed only when source is "fixed"

    # Optional known pull direction (base frame) → directional scalar F_d
    # output; more noise-robust than |F̂| for force-gauge experiments.
    # pull_direction: [1.0, 0.0, 0.0]

    # Grasp-mode required roles: these tips must be in contact (post-hysteresis)
    # for a valid estimate — index+middle without thumb is NOT a pinch.
    required_roles: ["thumb"]

    # Per-tip contact model. Order = PullContactInput order in the controllers.
    # link resolves the FK slot against the tree-model tip_links (_base.yaml:
    # l_<finger>_tip_bracket). The per-contact gate/diagnostic normal is derived
    # per tick from pinch geometry (±plane normal, thumb opposing) — no per-tip
    # normal here, so it tracks the grasp axis rather than a body-fixed fingertip
    # axis (correct for hemispherical tips). force_sign / force_bias /
    # force_calibration keep their defaults (+1 / 0 / I): the 1b firmware
    # measures *finger-on-object* force in the fingertip link frame, which is
    # exactly what the estimator sums — no conversion needed.
    #
    # This matches rtc_msgs/FingertipSensor.msg, whose sign contract is
    # finger-on-object. (iiwa7_leap is the exception in this repo: it has no
    # fingertip sensor and feeds the sim contact-wrench lane, which is
    # env-on-link, so it pins force_sign: -1.0.) Verified 2026-07-22 on a thumb+middle plate pinch: with force_sign -1 the
    # per-contact f_n = -n·f_obj came out -2.42 N (thumb) / -1.65 N (middle),
    # gating every contact out (valid_contact_count 0, all-zero estimate); with
    # +1 the same sample gives +2.42 / +1.65 and a valid 2-contact estimate.
    #
    # tip_names lists every tip that can *physically* participate, not the tips
    # one grasp is expected to use — a tip that is not touching is excluded by
    # its own force hysteresis, both from the sum and from the axis. Role names
    # must be unique: the role keys the block below and picks the thumb, so a
    # repeat is an on_configure FAILURE, not a silent double-count. The hand's
    # 4th tip (l_ring_tip_bracket) is deliberately absent: these links are also
    # resolved against tsid.contacts by the WBC controller (demo_shared.yaml is
    # shared by joint/task/wbc), and ring is not a tsid contact here — adding it
    # would fail WBC on_configure. Add the tsid contact first if ring should
    # count.
    # Optional per-tip touch hysteresis (#234 P-16): touch_on_threshold /
    # touch_off_threshold split the axis-selection gate (on |f_obj|) from the
    # force-sum gate (on f_n). Omit both — as every tip below does — and the
    # contact pair drives both, which keeps the historical `touch ⊇ contact`
    # containment. Set both (a half-set pair is an on_configure FAILURE) when a
    # tip with large shear reads as "touching" and drags the pinch axis around
    # without contributing to the sum.
    tips:
      tip_names: ["thumb", "index", "middle"]
      thumb:
        link: "l_thumb_tip_bracket"
        friction_coeff: 0.7
        force_saturation: 25.0     # [N] per-axis |raw| ≥ this ⇒ contact gated out
        contact_on_threshold: 0.5  # [N] normal-force hysteresis ON
        contact_off_threshold: 0.2 # [N] normal-force hysteresis OFF
      index:
        link: "l_index_tip_bracket"
        friction_coeff: 0.7
        force_saturation: 25.0
        contact_on_threshold: 0.5
        contact_off_threshold: 0.2
      middle:
        link: "l_middle_tip_bracket"
        friction_coeff: 0.7
        force_saturation: 25.0
        contact_on_threshold: 0.5
        contact_off_threshold: 0.2
