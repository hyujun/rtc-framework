# demo_catching_controller — UR5e + Proto-1b variant (dynamic_catching S4.0/S4.1)
#
# SIM ONLY. The controller refuses to configure unless every device it claims
# is bound to the `mujoco_native` backend: it holds the arm by commanding it
# every tick, and doing that on real hardware is a change on the E-STOP path
# (E-8), pending approval before S5. This file is therefore loaded by
# sim_ur5e_p1b.launch.py only in practice; the guard, not the file's location,
# is what enforces it (plan §4.4 S4a Q3).
#
# S4.0 scope: arm hold + unshaped hand step. No catching law (S5), no hand
# sequencer (S7.1). The `catching:` tree below carries only what this step
# needs; of the keys owned by other steps (reference.*, planner.*,
# supervisor.*) only the values already decided are recorded (planner.hand.*,
# planner.ik.*, supervisor.decel.a_dec — none consumed yet), the rest are
# absent and their TBDs are logged as warnings rather than refused — this
# controller never arms, so G0-C's arming gate is not its gate.
demo_catching_controller:
  command_type: "position"

  # ── S4a diagnostic mode ────────────────────────────────────────────────────
  # Accept unshaped step position targets on the hand group's joint_goal, so
  # S4.2 can identify T_close,e2e from the device CSV. False from S7.1 on: the
  # hand sequencer owns the hand then, and an operator step would race it.
  diagnostic:
    hand_step: true

    # ── S5.5 oracle plan (A-S5-8) ───────────────────────────────────────────
    # The stand-in for the planner: ONE fixed catch point, so the tracking
    # chain (sample -> soft-catch reference -> CLIK -> arm) can be exercised
    # without a planner. Kept (off) as the S5.5 fixed-point check; it writes
    # the same plan box the planner does, so only one of the two may be on.
    #
    # It is NOT a hazard on its own: the supervisor still needs a usable vision
    # prediction to leave ARMED, and the operator still has to raise
    # `catching.enable` (default false). Two deliberate acts, neither of them
    # this file.
    #
    # `p_c` is in the CLIK base frame (= world for this robot). Measured
    # 2026-09-22 from the shipped sim start pose: the catch frame sits at
    # (0.570, 0.127, 0.361), so this asks for a 7.5 cm move. `a_d` points
    # straight down — a 20 deg tilt from the start axis, so the approach-axis
    # rows have work to do as well as the position rows.
    #
    # `gamma_f: 0.0` makes the catch point the attractor for the whole run
    # (L4 §5.3: with gamma == 0 the ball drops out of the DS), which is what
    # turns this into the FIXED-catch-point check S5.5 asks for rather than a
    # moving-target one.
    oracle_plan:
      # OFF since S6-B (R-4): the planner writes the plan box. Turn this on
      # (and planner.enabled off) to rerun the fixed-point S5.5 check.
      enabled: false
      p_c: [0.570, 0.190, 0.400]
      a_d: [0.0, 0.0, -1.0]
      t_c_offset_s: 1.5
      gamma_f: 0.0

  catching:
    # ── D-12 ball (L0 §6) ───────────────────────────────────────────────────
    # The SIM ball, which is what the sim gates are judged against. It mirrors
    # `mujoco_simulator.yaml`'s `projectile_ball` (radius 0.0335 m, mass
    # 0.057 kg) and the `tennis` physics preset's restitution (0.75, ITF drop
    # test 0.745) — a real ITF Type 2 ball as of 2026-09-20, where this file
    # previously carried a 50 mm / 50 g ball and a restitution of 0.8 that
    # matched no preset. Keep the three in sync: S4.5's d_eff / r_cap are
    # derived FOR this diameter, so changing it invalidates them.
    # provisional: the real D-12 spec is still open (this is the sim ball, not
    # a decision about the hardware one), and S4.5 re-derives d_eff / r_cap
    # when it closes (plan §4.4 S4a Q10).
    core:
      ball:
        diameter: 0.067
        mass: 0.057
        restitution: 0.75
        provisional: true

    # ── Hand profile (L6 §5.1/§6) ───────────────────────────────────────────
    # 10 actuated joints, in the `devices.p1b.joint_state_names` order:
    #   0 thumb_cmc_aa   1 thumb_cmc_fe  2 thumb_mcp      3 thumb_dip_fe
    #   4 index_mcp_aa   5 index_mcp_fe  6 index_dip_fe
    #   7 middle_mcp_fe  8 middle_dip_fe 9 ring_mcp_fe
    #
    # PROVISIONAL, and provisional in the L0 §5.3 sense: this warns in sim and
    # blocks a real-arm configuration.
    #
    # q_pre / q_close are SEARCHED, not posed (2026-09-21). Two user-posed
    # pairs — and 40 hand-built ones — held the shipped 67 mm ball in 0 of
    # ~3000 sim closures, and the traces said why: the three parallel fingers
    # arrive at different times and squirt the sphere out along +-x, where this
    # hand has nothing to contain it; and a q_close past the posture the
    # fingers stall in lets the joints that are not touching yet carry on
    # curling and wedge the ball back out. So the 20 numbers were evolved
    # directly against the honest test (ball placed on the preshape palm, step
    # to q_close, shake along +-g on all three catch-frame axes), seeded with
    # the user's pairs. What it found differs from every posed pair in three
    # ways: the fingers close HALF as far (MCP -30..-43 deg, not -60..-80);
    # index_mcp_aa — the one joint no posed pair used — swings the index in
    # to block the x escape; and the thumb does not pinch, it rolls back
    # (cmc_fe -60 -> +30) so its BASE backstops the ball at -y. The thumb tip
    # never reaches a ball on this palm (it rides 8-11 cm above it).
    # Validated on conditions the search never saw (5 mm grid, 445 placements):
    # 214 held, see `planner.hand` below. It is a posture for THIS ball: it
    # holds 50-67 mm and nothing at 40 mm or below (the fingers no longer reach)
    # — one q_close cannot serve both under a bare position step; that needs
    # the S7.1 hold rule (L6 §4.4). q_open is unchanged. Every value is inside
    # `devices.p1b.joint_limits` ∩ URDF — index_mcp_aa sits AT the URDF/MJCF
    # bound (17 deg): the search asked for 20 and the joint stops at 17.
    robot:
      arm:
        # CLIK's position box sits this far INSIDE the device limits, so the
        # backend's own clamp never fires: if it did, the solver's answer and
        # the command actually written would differ, and the difference would
        # surface as a tracking error with no attributable cause (L5 §4.3).
        limit_margin: 0.05
        # The D-16 acceleration box, DERIVED from the torque limits by
        # `rtc_tools.analysis.derive_accel_limits` — not the
        # `max_acceleration` placeholder in the device roster, which no
        # controller reads. Package-relative because a controller cannot learn
        # which config variant it was loaded from. `adopted: false` in that
        # file is refused rather than defaulted (A-S5-6).
        accel_limits_package: "integrated_bringup"
        accel_limits_path: "config/ur5e_p1b/derived_accel_limits.yaml"
        accel_limits_group: "ur5e"
      hand:
        provisional: true
        rho_eps: 0.02

        # Flat open palm: the four flexion joints extended (thumb 90/-30/0/-5,
        # index 0/0/-15, middle 0/-10, ring 0 deg).
        q_open:  [1.570796, -0.523599,      0.0, -0.087266, 0.0,       0.0, -0.261799,       0.0, -0.174533,       0.0]
        # Preshape, searched (deg: thumb 66.5/-60/18.5/-11.2, index 8.4/-10.6/-23.5,
        # middle -14.7/-7, ring -21.6): a nearly OPEN hand. The posed preshapes
        # curled the fingers into a cup, and the ball came to rest on top of it.
        q_pre:   [ 1.160644, -1.047198,  0.322886, -0.195477,  0.146608, -0.185005, -0.410152, -0.256563, -0.122173, -0.376991]
        # Closed, searched (deg: thumb 37.3/30/7.7/-24.9, index 17/-30/-30,
        # middle -30.8/-46.4, ring -42.5): about where the fingers stall on a
        # 67 mm ball plus a little squeeze. NOT a fist — see the header.
        q_close: [ 0.651008,  0.523599,  0.134390, -0.434587,  0.296706, -0.523599, -0.523599, -0.537561, -0.809833, -0.741765]
        # C (L6 §4.2): every joint travels more than rho_eps between these two
        # postures (the smallest is index_dip_fe, 6.5 deg = 0.113 rad), and the
        # stall rho below was measured over all ten, so all ten are in C —
        # index_mcp_aa included, now that it moves.
        caging_mask: [true, true, true, true, true, true, true, true, true, true]

        # eta is "the progress at which the ball can no longer escape"
        # (L6 §4.2), MEASURED for this hand with these postures: over the 214
        # placements that held, closure stalls at rho = 0.74 (median). eta sits
        # just under it so that rho >= eta is actually reached with a ball in
        # the hand; above 0.74 it would time a motion that never completes.
        eta_close: 0.7

        # MEASURED, S4.2 re-run (2026-09-21) WITH the searched postures above:
        # 200 step trials on the full sim bring-up, 0 CSV drops, at the eta
        # above. steady axis (L6 §4.2's definition) mean 278.6 ms, max 280.7 ms,
        # p99 280.5 ms — a 2 ms spread, which is what a deterministic
        # position-servo step response looks like. The value below is the p99.
        # It is a property of THIS posture pair (the travel set changes with
        # the postures), so it was re-measured rather than carried over.
        # Authority for the closure torque is the sim MJCF forcerange
        # (3.0 N·m); this hand is torque-saturation dominated, so an operating
        # limit of 1.5 N·m would stretch T_close by roughly √2.
        # The analyser's tick axis is NOT usable here — see L6 §4.2.
        #
        # This hand is the reason `analyze_hand_close` classifies a command row
        # as pre / close / OTHER instead of taking the nearer of two. With the
        # postures above, the pose this controller holds at activation (every
        # joint at zero in sim) sits 0.107% from being read as a q_close step —
        # 3.033 vs 3.036 in squared joint distance. A nearest-of-two vote that
        # fell the other way would open a trial on the hold pose, run it into
        # the first real step, and inflate that trial's T_close by the whole
        # hold. Re-check this margin whenever these two postures move.
        T_close_e2e: 0.2805

    # ── Vision ingress (L1 §6, S5.2) ────────────────────────────────────────
    # The prediction lane this controller subscribes to, and the numbers it
    # judges each message against. Values are S3.6's (plan §4.4 "S3.6 결과"),
    # all PROVISIONAL in the sense that they are derived from the sim profile
    # and one measured detection latency — they are re-derived, not re-guessed,
    # when either changes.
    io:
      # ball_perception `sim_estimator_node`'s debug prediction topic. A DEBUG
      # topic with no stable ABI (W5-2), which is why the parser locates fields
      # by name rather than by offset.
      traj_topic: "/ball_perception/debug/prediction/trajectory"
      # Measured, not assumed: S3.4 saw `world` on 856 messages across both
      # robots. Compared on every message — a publisher that changes frame
      # keeps producing entirely plausible numbers in a different space.
      expected_frame: "world"
      # = ceil(horizon_min / dt_expected) + 1 = ceil(0.51 / 0.05) + 1. The +1 is
      # not a margin: n samples spaced dt apart span (n-1)*dt, so 11 points
      # cover 0.50 s and fall 10 ms SHORT of the window a commit decision
      # needs — every minimal message would then trip the horizon warning
      # (found by /code-review, 2026-09-22; S3.6's arithmetic dropped the term).
      n_min: 12
      # Three publish periods at the measured 30 Hz. S3.4: a 30 % drop
      # injection thins publishing to ~15 Hz at p95 (67 ms), so one dropped
      # message must not read as stale — and the ghost-track silence after a
      # lost ball (the last VALID prediction arrives within 34 ms, then
      # nothing) is read as loss inside this window.
      t_stale: 0.10
      # REAL-ARM value: the budget for clock disagreement between the vision PC
      # and this one, which on hardware is a PTP/NTP question (TBD-NET-01, S10
      # confirms it). The sim value is the `sim.io` override below.
      future_tol: 0.001
      # R1 (the commit condition): T_close,tot 0.2815 + T_arm 0.05 + margin
      # 0.03 + L 0.14 = 0.5015, rounded UP to 10 ms. Rounding down would admit
      # a prediction that misses R1 by 1.5 ms.
      horizon_min: 0.51
      track:
        # How far past the later origin two consecutive predictions are
        # compared (L1 §4.4). Inside both windows, so neither is extrapolated.
        eval_offset: 0.05
        # TBD: the jump distribution has not been measured on this profile, and
        # a threshold invented here would warn about nothing or about
        # everything. Diagnostic only — it does not block arming.
        j_warn: TBD

    # ── What the vision profile is expected to produce ──────────────────────
    # Must match `ball_perception_sim_profile.json`'s step (0.05 s): the
    # spacing floor the decoder refuses below is derived from it, and `n_min`
    # above is derived from it too.
    prediction:
      dt_expected: 0.05

    # ── Sim-only overrides (active iff every claimed device is the simulator)
    # The sim ball lane's stamps ride the SIM time axis anchored at launch, so
    # they lead wall by the in-flight phase error — two orders of magnitude
    # above any clock-sync budget (D-3, `rtc_mujoco_sim` README §Projectile
    # Ball stamp). 0.1 s is the same width `ball_perception_sim_profile.json`
    # allows with `max_future_skew_s`. On hardware this key is not read and
    # `io.future_tol` above applies.
    sim:
      io:
        future_tol: 0.1

    # ── The L4 soft-catch reference (L4 §6, S5.3 consumes all four) ──────────
    # `provisional: true` covers the BLOCK, which is the honest state: `v_max`
    # is decided and `a_max` is not, and one TBD in a consumed key refuses the
    # configure in sim — which, because CM latches `bring_up_failed` on ANY
    # controller's configure failure, takes every other controller on the robot
    # down with it. That is what the shipped p1b sim did on 2026-09-22 before
    # this block existed. The provisional rule says the right thing instead:
    # warn in sim, block a real arm (L0 §5.3).
    reference:
      provisional: true
      # rad/s. L5/L4 §6 default; omega*h = 0.02 << 0.828, so the discretisation
      # gate is nowhere near its bound at 500 Hz.
      omega: 10.0
      # v1 requires exactly critically damped — the planner's closed-form
      # terminal error assumes it (L4 §4.7).
      zeta: 1.0
      # m/s. NOT provisional in itself: L4 §6 records this as DERIVED and
      # confirmed 2026-09-22 — the max LP v_dir,max over accepted catch
      # candidates at the joint ratings, times eta_v = 0.9. S10 may only LOWER
      # it once the real controller's TCP limit is identified.
      v_max: 3.5
      # m/s^2. THE provisional one. L4 §6 defers the decision to the D-16
      # revision; S4.4 measured torque-limited acceleration along v_hat at the
      # catch pose as median 43, and 21-23 under a 10x rotor-inertia
      # assumption. 21 is the conservative end of that measurement and stays
      # above `supervisor.decel.a_dec` = 10, which the validator requires.
      a_max: 21.0

    # ── The CLIK step (L5 §6, S5.3) ─────────────────────────────────────────
    # Gains and weights, all provisional: they are the documented defaults
    # (L5 §6) and have not been tuned on this robot. The ORDERING is not a
    # preference — the validator refuses a profile where the posture weight
    # reaches the task weight, because that produces a controller which tracks
    # its own posture and treats the catch point as a suggestion.
    joint_cmd:
      K_p: 20.0      # 1/s, position rows
      K_a: 8.0       # 1/s, approach-axis rows (L4 §6 reference.axis.k_axis)
      K_n: 1.0       # 1/s, posture
      w_task: 1.0
      w_a: 0.5
      w_arm: 0.01
      w_smooth: 0.001
      damping_sq: 0.0001
      qp:
        max_iter: 20
      lag:
        # SIM IS ZERO (2026-09-20): nothing injects an actuation lag, and
        # leading a delay that does not exist moves the command EARLY by
        # exactly T_arm. `lead_enable` turns the compensation on once S10 has
        # identified the real value.
        T_arm: 0.0
        lead_enable: false

    # ── Deceleration (L7 §6 `supervisor.decel.a_dec`, single-source key) ──────
    # `ParseCatchingParams` reads this (TbdDouble) but nothing consumes it yet:
    # the L3 §4.9 stopping-point reservation lands in S6, the L7 DECEL target in
    # S7. 10 m/s^2 is the value the S3.5b gate map ran with, confirmed
    # 2026-09-22 (plan §7.3); provisional until reference.a_max exists
    # (a_dec <= a_max, L7 §4.3).
    supervisor:
      # ── Thresholds the joint command layer reports to (L7 §6, S5.3) ───────
      # ‖q_meas − q_cmd‖. D-6 keeps the measured state out of CLIK, so this
      # watchdog is the ONLY thing that notices the arm is not where it was
      # told to be. PROVISIONAL: a placeholder until a run on this robot shows
      # what the real tracking gap looks like.
      track_err_abort: 0.3
      # Consecutive failed solves before the controller latches a fault
      # (L7 §4.2). Three ticks of a solve that cannot succeed is not a
      # transient, and retrying it forever is how a controller ends up
      # aborting in a loop with nothing in the log that escalates.
      n_qp: 3
      decel:
        a_dec: 10.0

    # ── Hand allowance (L3 §6 `planner.hand.*`, TBD-HAND-04) ─────────────────
    # NOTHING READS THESE TWO KEYS YET. `ParseCatchingParams` puts
    # `planner.hand.*` out of scope on purpose (see the header of
    # rtc_controllers/include/rtc_controllers/catching/catching_params.hpp):
    # their consumers are the L3 planner's gamma window and §4.6 budget gate,
    # which land in S6. They are recorded here because G6-F asks for the
    # derivation and the value to live together with the profile they were
    # derived from — read them as documentation, not as configuration.
    #
    # d_eff IS NOT THE POCKET DEPTH (decided 2026-09-22, plan §7.3). The L3 §4.5
    # gamma window only ever uses d_eff / T_close,tot — the relative speed the
    # hand can absorb — so the key holds that speed times T_close,tot:
    #   d_eff 0.2815 m = 1.0 m/s x (T_close_e2e 0.2805 + h/2 0.001) s.
    #                    1.0 m/s is the time-triggered fly-in figure (L6 §4.5,
    #                    S4.4): closure fired at t_c - T_close_e2e, ball centred
    #                    on the catch point, 7/9 held at 1.0 m/s, 5/9 at 1.5.
    # With the pocket depth below instead (0.34 m/s) the S3.5b gate map of this
    # robot is empty for every wait pose; everything that opens stands on the
    # fly-in figure. Valid only under that same time-triggered closure rule,
    # and measured with the hand frame at constant velocity — provisional.
    #
    # MEASURED, S4.5 (2026-09-21), with the searched postures above and the
    # shipped 67 mm ball: ball PLACED on the preshape palm on a 5 mm lateral
    # grid, step to q_close, shake along +-g on each catch-frame axis.
    # 445 placements, 214 held.
    #   r_cap 0.024 m = lateral inscribed radius of that capture region (best
    #                   catch point (+0.015, +0.145, 0.052) in the catch frame).
    #   pocket depth 0.095 m = approach-axis span still caught at that point,
    #                   from resting on the palm (z 0.052) upward. SCAN-LIMITED:
    #                   the scan stopped at +0.095 with the ball still held, so
    #                   this is a lower bound. A contact quantity (L6 §4.5,
    #                   MASTER TBD-HAND-04) — it is NOT this file's d_eff.
    # Both are ball-CENTRE quantities (the radius is already inside them) and
    # both are derived FOR core.ball above.
    # Position-triggered closure (fired as the ball crosses the fingertip plane)
    # held 9/130 at 0.25 m/s and none at 1 m/s — that was the trigger rule's
    # bias for a slow-closing hand, not the hand's limit (L6 §4.5).
    # With the two user-posed pairs this block was TBD: 0 held of 851.
    planner:
      # ── Planner thread (L3 §6, S6-A) ──────────────────────────────────────
      # ON since S6-B (R-4): the planner is the plan box's only writer — the
      # oracle plan above is off (a profile enabling both is parked).
      enabled: true
      # The longest the planner sleeps without a new trajectory (decision H,
      # 2026-09-23). It also re-plans on this cadence while vision is quiet.
      wake_timeout_s: 0.05
      # One cycle's compute budget (R-2, 2026-09-23): per-candidate IK measured
      # p50 1.8 ms on this 6-axis arm (dev PC), so 20 ms with a pre-filter to at
      # most 8 IK candidates per cycle.
      budget_s: 0.020
      # IK seed and wait pose, ARM joint order [rad] (decision L, 2026-09-23):
      # the S3.5b gate map's wait pose for this arm. PROVISIONAL. Consumed from S6-B (the IK seed); homing to it
      # is S7.2.
      wait_pose: [0.212, -1.376, 1.107, -1.978, -3.296, 0.121]
      # ── Search (L3 §4, S6-B) ──────────────────────────────────────────────
      # The robot config's catch sub-model (R-3): arm root → catch frame parent.
      sub_model: "ur5e_catch"
      # IK candidates per cycle after the pre-filter (R-2: one IK ≈ 2–3 ms on the
      # development PC, so 8 fit budget_s with room; the cycle can overrun the
      # budget by at most one IK — the budget is checked BEFORE each solve).
      max_ik: 8
      # Snapshots to skip after a track change (L3 §4.4).
      n_settle: 3
      slice:
        # = the vision spacing (prediction.dt_expected): candidates are the
        # vision samples themselves, so the covariance needs no interpolation.
        dt: 0.05
        # vision horizon 1.0 s − prediction.t_horizon_margin 0.05 s.
        t_max: 0.95
        # t_lead_min defaults to freeze.T_freeze (decided 2026-09-23).
      time:
        margin: 0.03
      unc:
        kappa_sigma: 0.3
      gamma:
        eta_v: 0.9
        margin: 0.1
      budget:
        n_sigma: 2.0
        # 0 until measured (S10) — they only RANK candidates (decision 2026-09-23).
        sigma_trk: 0.0
        clock_err: 0.0
      switch:
        delta_J: 0.1
        e_jump_max: 0.01
        ed_jump_max: 0.05
      freeze:
        # Decision G (2026-09-23): the L3 §4.11 lower bound T_close,tot 0.2815 +
        # T_arm (0, sim) + margin 0.03 = 0.31, rounded up with room. Provisional.
        T_freeze: 0.36
      score:
        # L3 §6 defaults; `penalty` is per failed RANK gate (decision D) and must
        # dominate the continuous terms. Tuning is S6-C/S8.
        w_sigma: 1.0
        w_t: 1.0
        w_q: 0.1
        w_late: 0.0
        w_gamma: 5.0
        penalty: 10.0
      workspace:
        # Decision I (2026-09-23), model world frame (= this robot's base): the box
        # around the S3.5b fine grid's gate-open candidates — their p_c and their
        # stopping points at both ends of the γ window, 967 candidates, recomputed
        # 2026-09-23 with the shipped wait pose — plus 0.1 m. A JUDGEMENT gate:
        # p_c and p_stop must both lie inside. Provisional.
        catch_box:
          min: [0.19, -0.30, 0.21]
          max: [1.04, 0.31, 0.96]
      # The whole block is provisional (L0 §5.3): sim warns, a real arm parks.
      provisional: true
      hand:
        d_eff: 0.2815
        r_cap: 0.024
        provisional: true

      # ── Catch-pose IK + catchability gate (L3 §6, S3.5a) ──────────────────
      # NOT READ AT RUNTIME YET, like `planner.hand` above: the consumer is the
      # L3 planner's binding, which lands in S6.2. `ParseCatchPoseIkParams`
      # (rtc_controllers) already parses exactly these keys, and the offline
      # catchability map drives them through it, so they are live values under
      # test — just not yet on a tick. Recorded here because G6-F asks the
      # derivation and the value to live together.
      #
      # MEASURED, S3.5a map (2026-09-21), 3402-throw grid at 4 m: 1418 throws
      # accepted from the best single wait pose (reproduced by running the map
      # tool with THIS file as --params),
      # T_f >= 1.0 s. Details and the rejected alternatives: plan §11.
      ik:
        # k_manip > 0 is NOT optional. It enables the D-25 null-space log w5
        # ascent, and without it (the in-code default 0) the 5-row task leaves
        # the arm wherever the seed put it: w5 came out 0.06-0.09 at plausible
        # wait poses, i.e. BELOW the gate, so every candidate in the map was
        # rejected as below_manip_min. With the ascent on, w5 reaches
        # 0.100-0.208 (median 0.147) and the gate is passable. A config that carries the
        # threshold but leaves this at 0 rejects everything at runtime.
        k_manip: 0.5
        # 20 (the L3 default) was not enough to let the ascent settle; 40 left
        # 758 candidates `not_converged`, which is confounded with
        # genuinely unreachable points and is a follow-up sweep, not a bound.
        max_iter: 40
      catchability:
        # 5-row, per plan §11: the 6-row definition would need a threshold ~30x
        # smaller (w6 bottoms out at 0.0035 over the SAME accepted set) and it
        # collapses at the wrist singularities of a 6-axis arm, which are fine
        # poses for catching. w6 is recorded per candidate either way (C-3).
        definition: "arm_5row"
        manipulability_min:
          # ROBOT-SPECIFIC ON PURPOSE (user decision 2026-09-21). w5 =
          # sqrt(det(J5 J5^T)) scales with the arm's link lengths, so one number
          # means different strictness on different arms: the shipped 0.1 sat at
          # roughly the 40th percentile of the 6-axis arm's task-feasible w5 but
          # only ~the 10th of the 7-axis arm's, i.e. the two arms were being held
          # to different standards and the map's coverage comparison was not
          # like-for-like. Each value is 0.1 scaled by that arm's task-feasible
          # median w5 (gate off, same grid): 0.1249 here, so 0.1 is kept unchanged - this is the arm it was calibrated on.
          arm_5row: 0.1
          # No value: the 6-row gate is not the definition above, and 0.1 is not
          # a conservative stand-in for a different-dimension quantity — the
          # parser leaves a TBD threshold non-finite so Solve fails closed.
          arm_6row: "TBD"
          provisional: true

  # ── Topic configuration ────────────────────────────────────────────────────
  # Group order IS the controller's device index order: ur5e = 0 (held),
  # p1b = 1 (stepped). No publishers: S4.0 emits no state message (D-20).
  topics:
    ur5e:
      subscribe:
        - topic: "ur5e/joint_goal"
          role: "target"
    p1b:
      subscribe:
        - topic: "p1b/joint_goal"
          role: "target"

  # ── Controller-owned CSV logs ──────────────────────────────────────────────
  # The S4.2 measurement reads `p1b_state.csv` — `command_*` gives t_cmd (the
  # tick the step was accepted), `actual_pos_*` gives rho(t), and
  # `t_relative_s` is the RT steady clock L6 §4.2 asks for. No dedicated
  # diagnostic channel: these columns already carry everything rho needs.
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: ur5e_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: p1b_state
    # Per-tick record (S5.4, L8 §5.2). One row per tick including the ticks
    # that decide to do nothing — a gap in this file means a dropped row
    # and nothing else (#234 P-20).
    - msg_type: integrated_bringup/CatchingDiagLog
      instance: catching_diag
