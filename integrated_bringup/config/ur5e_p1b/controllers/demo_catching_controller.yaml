# demo_catching_controller — UR5e + Proto-1b variant
#
# The whole catching cycle: armed, the controller homes the
# arm to `planner.wait_pose` in joint space with the hand at q_pre, follows the
# planner's plan, freezes it at t_c − T_freeze, closes the hand at t_cmd,
# decelerates after t_c, holds for T_hold and returns to the wait pose.
#
# Loaded by sim_ur5e_p1b.launch.py; the real p1b bring-up instantiates it too
# (sim and real share config/<variant>/controllers/). The backend does not
# gate activation: a value this controller consumes that is provisional or TBD
# PARKS a real-arm configuration (configure SUCCESS, activation refused) and
# only warns in sim. The `provisional` flags below are why a real arm does not
# run this file yet.
#
# ── How this config is laid out ──────────────────────────────────────────────
# This file holds the QP CLIK step (`catching.joint_cmd`), the bring-up
# sections (ball, hand, vision ingress, supervisor thresholds, topics, logs),
# the planner thread's own keys, the arm's acceleration box, and the two keys
# that SELECT what runs: `catching.planner.search.mode` (grid | nlp) — which
# search turns a predicted ball into a catch plan — and
# `catching.planner.segment.mode` (closed_form | mpc | mpc_docking) — what the
# arm follows. Every pair runs but nlp with closed_form, which parks.
#
# What each function is tuned with lives in a fragment under catching/. The CM
# merges the fragments into this tree before it applies any override
# (rtc_controller_manager README, `include:`):
#   catching/search_grid.yaml          the grid search (planner.search.grid)
#   catching/search_nlp.yaml           the nlp search (planner.search.nlp)
#   catching/planner_closed_form.yaml  the closed_form law (reference,
#                                      supervisor.decel.a_dec)
#   catching/segment_mpc.yaml          the mpc segment planner (planner.segment.mpc)
#   catching/segment_mpc_docking.yaml  the docking segment planner
#                                      (planner.segment.mpc_docking)
# All five are always included: what runs is chosen by the two keys, not by
# this list (a sim_overlay can then switch it). Only the selected functions'
# keys are read and required — a fragment of a function that does not run can
# be absent, or wrong, without this controller noticing. A function keeps every
# value it is designed with in its own fragment: where two functions read the
# same number, each has its own key (the grid search has its own copy of the
# closed_form law's five values, each segment planner its own eta_v). What is
# MEASURED on the hand is not a function's: it lives once, in `robot.hand`
# below (the closure time, the close lead, the docking capture set), and every
# function that needs it reads it from there. A fragment keeps the full key
# path, so an override or a parameter mirror names a key exactly as it did in
# one file. Each key lives in ONE file — the loader refuses a leaf that two
# files set.
include:
  - catching/search_grid.yaml
  - catching/search_nlp.yaml
  - catching/planner_closed_form.yaml
  - catching/segment_mpc.yaml
  - catching/segment_mpc_docking.yaml
demo_catching_controller:
  command_type: "position"

  # ── Diagnostic mode ────────────────────────────────────────────────────────
  # Accept unshaped step position targets on the hand group's joint_goal, so
  # T_close,e2e can be identified from the device CSV. False: the hand
  # sequencer owns the hand, and an operator step would race it. To
  # re-measure T_close,e2e (rtc_tools hand_close_trials), turn this on for that
  # run — the controller then runs WITHOUT the sequencer, never both.
  diagnostic:
    hand_step: false

    # ── Oracle plan ─────────────────────────────────────────────────────────
    # The stand-in for the planner: ONE fixed catch point, so the tracking
    # chain (sample -> soft-catch reference -> CLIK -> arm) can be exercised
    # without a planner. Kept (off) as the fixed-point check; it writes
    # the same plan box the planner does, so only one of the two may be on.
    #
    # It is NOT a hazard on its own: the supervisor still needs a usable vision
    # prediction to leave ARMED, and the operator still has to raise
    # `catching.enable` (default false). Two deliberate acts, neither of them
    # this file.
    #
    # `p_c` is in the CLIK base frame (= world for this robot). Measured
    # from the shipped sim start pose: the catch frame sits at
    # (0.570, 0.127, 0.361), so this asks for a 7.5 cm move. `a_d` points
    # straight down — a 20 deg tilt from the start axis, so the approach-axis
    # rows have work to do as well as the position rows.
    #
    # `gamma_f: 0.0` makes the catch point the attractor for the whole run
    # (SoftCatchTranslation: with gamma == 0 the ball drops out of the
    # reference), which is what turns this into the FIXED-catch-point check
    # rather than a moving-target one.
    oracle_plan:
      # OFF: the planner writes the plan box. Turn this on
      # (and planner.enabled off) to rerun the fixed-point check.
      enabled: false
      p_c: [0.570, 0.190, 0.400]
      a_d: [0.0, 0.0, -1.0]
      t_c_offset_s: 1.5
      gamma_f: 0.0

  catching:
    # ── Ball ────────────────────────────────────────────────────────────────
    # The SIM ball, which is what the sim results are judged against. It
    # mirrors `mujoco_simulator.yaml`'s `projectile_ball` (radius 0.0335 m,
    # mass 0.057 kg) and the `tennis` physics preset's restitution (0.75, ITF
    # drop test 0.745) — an ITF Type 2 ball. Keep the three in sync: d_eff /
    # r_cap (planner.search.grid.hand) are derived FOR this diameter, so
    # changing it invalidates them.
    # provisional: the hardware ball spec is still open (this is the sim ball),
    # and d_eff / r_cap are re-derived when it closes.
    core:
      ball:
        diameter: 0.067
        mass: 0.057
        restitution: 0.75
        provisional: true

    # ── Hand profile ────────────────────────────────────────────────────────
    # 10 actuated joints, in the `devices.p1b.joint_state_names` order:
    #   0 thumb_cmc_aa   1 thumb_cmc_fe  2 thumb_mcp      3 thumb_dip_fe
    #   4 index_mcp_aa   5 index_mcp_fe  6 index_dip_fe
    #   7 middle_mcp_fe  8 middle_dip_fe 9 ring_mcp_fe
    #
    # PROVISIONAL: this warns in sim and blocks a real-arm configuration.
    #
    # q_pre / q_close are SEARCHED, not posed. Two hand-posed
    # pairs — and 40 hand-built ones — held the shipped 67 mm ball in 0 of
    # ~3000 sim closures, and the traces said why: the three parallel fingers
    # arrive at different times and squirt the sphere out along +-x, where this
    # hand has nothing to contain it; and a q_close past the posture the
    # fingers stall in lets the joints that are not touching yet carry on
    # curling and wedge the ball back out. So the 20 numbers were evolved
    # directly against the honest test (ball placed on the preshape palm, step
    # to q_close, shake along +-g on all three catch-frame axes), seeded with
    # the posed pairs. What it found differs from every posed pair in three
    # ways: the fingers close HALF as far (MCP -30..-43 deg, not -60..-80);
    # index_mcp_aa — the one joint no posed pair used — swings the index in
    # to block the x escape; and the thumb does not pinch, it rolls back
    # (cmc_fe -60 -> +30) so its BASE backstops the ball at -y. The thumb tip
    # never reaches a ball on this palm (it rides 8-11 cm above it).
    # Validated on conditions the search never saw (5 mm grid, 445 placements):
    # 214 held, see `planner.search.grid.hand` (catching/search_grid.yaml). It is a posture for THIS ball: it
    # holds 50-67 mm and nothing at 40 mm or below (the fingers no longer reach)
    # — one q_close cannot serve both under a bare position step; that needs
    # a hold rule in the hand sequencer. q_open is unchanged. Every value is inside
    # `devices.p1b.joint_limits` ∩ URDF — index_mcp_aa sits AT the URDF/MJCF
    # bound (17 deg): the search asked for 20 and the joint stops at 17.
    robot:
      arm:
        # CLIK's position box sits this far INSIDE the device limits, so the
        # backend's own clamp never fires: if it did, the solver's answer and
        # the command actually written would differ, and the difference would
        # surface as a tracking error with no attributable cause.
        limit_margin: 0.05
        # [rad/s², arm joint order] torque-derived (derive_accel_limits, eta_tau 0.8).
        qdd_max: [2.03052, 2.03052, 2.03052, 2.03052, 2.03052, 2.03052]
        # Whether the box is cleared for the real arm. true parks a real-arm
        # configuration (sim only); absent or not a bool counts as true. This flag
        # is a statement about THESE qdd_max values: whoever overrides qdd_max
        # (sim.yaml, an overlay) must set qdd_provisional with it — a separate
        # key does not follow the box, it inherits whatever this file says.
        qdd_provisional: true
      hand:
        provisional: true
        rho_eps: 0.02

        # Flat open palm: the four flexion joints extended (thumb 90/-30/0/-5,
        # index 0/0/-15, middle 0/-10, ring 0 deg).
        q_open:  [1.570796, -0.523599,      0.0, -0.087266, 0.0,       0.0, -0.261799,       0.0, -0.174533,       0.0]
        # Preshape, searched (deg: thumb 66.5/-60/18.5/-11.2, index 8.4/-10.6/-23.5,
        # middle -14.7/-7, ring -21.6): a nearly OPEN hand. The posed preshapes
        # curled the fingers into a cup, and the ball came to rest on top of it.
        q_pre:   [ 1.160644, -1.047198,  0.322886, -0.195477,  0.146608, -0.185005, -0.410152, -0.256563, -0.122173, -0.376991]
        # Closed, searched (deg: thumb 37.3/30/7.7/-24.9, index 17/-30/-30,
        # middle -30.8/-46.4, ring -42.5): about where the fingers stall on a
        # 67 mm ball plus a little squeeze. NOT a fist — see the header.
        q_close: [ 0.651008,  0.523599,  0.134390, -0.434587,  0.296706, -0.523599, -0.523599, -0.537561, -0.809833, -0.741765]
        # Caging set C: every joint travels more than rho_eps between these two
        # postures (the smallest is index_dip_fe, 6.5 deg = 0.113 rad), and the
        # stall rho below was measured over all ten, so all ten are in C —
        # index_mcp_aa included, now that it moves.
        caging_mask: [true, true, true, true, true, true, true, true, true, true]

        # eta is the closure progress rho (the minimum over C of the fraction of
        # the q_pre -> q_close travel done) at which the ball can no longer
        # escape, MEASURED for this hand with these postures: over the 214
        # placements that held, closure stalls at rho = 0.74 (median). eta sits
        # just under it so that rho >= eta is actually reached with a ball in
        # the hand; above 0.74 it would time a motion that never completes.
        eta_close: 0.7

        # MEASURED WITH the searched postures above:
        # 200 step trials on the full sim bring-up, 0 CSV drops, at the eta
        # above. Steady-clock closure time (command tick to rho >= eta) mean
        # 278.6 ms, max 280.7 ms,
        # p99 280.5 ms — a 2 ms spread, which is what a deterministic
        # position-servo step response looks like. The value below is the p99.
        # It is a property of THIS posture pair (the travel set changes with
        # the postures), so it was re-measured rather than carried over.
        # Authority for the closure torque is the sim MJCF forcerange
        # (3.0 N·m); this hand is torque-saturation dominated, so an operating
        # limit of 1.5 N·m would stretch T_close by roughly √2.
        # The analyser's tick axis is NOT usable here (a CSV row is not one
        # tick); use the steady clock.
        #
        # This hand is the reason `analyze_hand_close` classifies a command row
        # as pre / close / OTHER instead of taking the nearer of two. With the
        # postures above, the pose this controller holds at activation (every
        # joint at zero in sim) sits 0.107% from being read as a q_close step —
        # 3.033 vs 3.036 in squared joint distance. A nearest-of-two vote that
        # fell the other way would open a trial on the hold pose, run it into
        # the first real step, and inflate that trial's T_close by the whole
        # hold. Re-check this margin whenever these two postures move.
        #
        # THE MEASURED CLOSURE TIME, and only that (#742): the mean of
        # the 200-trial re-measurement (#741) — 278.000 ms on the
        # steady and the tick axis alike, sample std 0.000 ms (the sim hand
        # closes on the same tick every time). It bounds how long a closure may
        # take (T_close_timeout, T_release_timeout are derived from it) and is
        # what the closing hand absorbs in the grid search's gamma window. It
        # no longer times the close command: that is T_close_lead below.
        T_close_e2e: 0.278
        # HOW LONG BEFORE THE BALL REACHES THE CATCH POINT THE HAND IS TOLD TO
        # CLOSE — a design value, set from where the hand holds, MEASURED AT
        # THE SPEEDS THE ARM CATCHES AT (#802): flown in at
        # 1.0 – 2.5 m/s, 16 fly-ins a cell of 0.1 m/s x 4 ms, the 8 ms the
        # closure held best in was "complete 28 – 20 ms BEFORE the ball centre
        # reaches the catch-frame origin" in every speed cell from 1.15 to
        # 2.45 m/s but one (1.95: 24 – 16 ms). The lead is the closure time
        # and the middle of that window: 0.278 + 0.024. The window's
        # place does not move with the speed; how often the hand holds in it
        # does — of 32 fly-ins 0.75 – 0.94 up to 1.45 m/s, 0.66 – 0.78 to
        # 1.75, 0.59 at 1.85 and 2.05 (0.41 at 1.95), about 0.4 above.
        # In the catching sim the new lead made no difference that three
        # same-seed pairs could show (#745): the plans published there miss
        # by position at the catch instant, not by the closing instant.
        # Read by the hand sequencer, the plan's t_cmd, the freeze-window bound
        # and the grid search's commit gate. Whose catch instant the lead is
        # subtracted from, and the one conversion the controller makes under
        # the mpc_docking segment planner (mirror hand.T_close_lead_from_t_c),
        # are in the controller's header. Absent, the key is T_close_e2e (and
        # the configure log says so). Provisional (sim).
        T_close_lead: 0.302

        # ── The docking capture set (#741, re-measured in #742) ─────────────
        # What the nlp search and the mpc_docking segment planner need to know
        # of THIS hand, identified in sim with tools/docking_ident (README):
        # the ball flown into the preshape hand along a line of the catch
        # frame, q_close commanded at a set instant, "held" judged after the
        # closure. Read by every configuration, REQUIRED only when one of
        # those two functions is selected (a value left TBD parks it then).
        # PROVISIONAL — a sim identification: the sim hand's absorption and
        # restitution are not the real hand's, and the lateral set
        # is small against the resolution it was measured at (below).
        # Box w040: closing speed 0.5 – 0.6 m/s, 300 conditions drawn from the
        # set held 277 times (95 % lower bound 0.893); with the ball
        # accelerating in the catch frame (5 and 9.81 m/s² along the approach
        # axis, gravity at the wait pose) 300 of 300 each.
        docking:
          provisional: true
          # Entrance plane: the ball centre this far above the catch-frame
          # origin along the approach axis has not touched the open hand on
          # any approach of the set [m]. The catch node of a docking solve is
          # the ball's crossing of it.
          s_ent: 0.0070
          # The cone the ball's line must stay inside on its way to the
          # entrance: radius at the entrance [m] and half-angle tangent.
          corridor:
            r_ent: 0.0177
            tan_theta: 0.4599
          # Where the ball centre may cross the entrance plane, catch-frame
          # x, y [m]: a convex polygon of unit normals a_i and offsets b_i
          # (a_i . rho <= b_i), as flat lists — faces_a is [ax0, ay0, ax1,
          # ay1, …]. rho_ref is the point the terminal cost aims at (the
          # centre of the set's inscribed circle).
          # MEASURED BY HOLD RATE (#742): a 5 mm cell is in the set when its
          # 40 fly-ins (5 conditions x 8) hold as often as the best cell's to
          # within 5 points. 4 of 147 candidate cells are (40, 40, 38, 38 of
          # 40; twelve more held 32 – 37): the region around (-5, -5) mm holds
          # at 0.8 – 0.95 a cell and only at the centre every time (160 of 160
          # there with no lateral speed). The polygon is what fits inside
          # those 4 cells — its nearest face is 2.3 mm from rho_ref, so the
          # lateral chance row admits a ball known to a few tenths of a
          # millimetre only.
          lateral:
            n_faces: 8
            faces_a: [1.0, 0.0, 0.7071067812, 0.7071067812, 0.0, 1.0, -0.7071067812, 0.7071067812,
                      -1.0, 0.0, -0.7071067812, -0.7071067812, 0.0, -1.0, 0.7071067812, -0.7071067812]
            faces_b: [-0.002690, -0.003805, -0.002690, 0.003266, 0.007310, 0.013381, 0.012310,
                      0.006802]
            rho_ref: [-0.005, -0.005]
          # The relative velocity the hand holds [m/s]: the closing speed
          # along the approach axis (the box's band — the identification
          # flew nothing outside it) and the lateral speed (the last ring
          # whose hold rate stays within 5 points of the zero-speed ring's).
          # c_ent_max and a_brake are the approach envelope's design values,
          # not identified: the closing speed allowed at the entrance (the
          # band's top) and the relative braking the envelope assumes.
          # c_cap_max / c_ent_max are NOT the identified band's top (0.6, #742):
          # they were widened in sim (#745). At 0.5 - 0.6 the planner
          # publishes, the arm follows and the hand holds 3 of 50 — at t_c the
          # hand is ~30 mm ahead of the plan along the approach axis, which at
          # 0.55 m/s is ~60 ms against a closure due ~10 ms after t_c. Held of
          # 50 at a reference closing speed of 0.55 / 1.0 / 1.5 / 2.0 / 2.5
          # m/s: 3 / 5 / 15 / 27 / 20 (seed 801), and 29 at 2.0 on seed 821
          # (grid x mpc the same day: 23, 32). The top is where grid x mpc
          # holds in sim (1.0 - 2.1 m/s at the entrance). The hand was flown
          # there since (#802): the closure window keeps its
          # place (T_close_lead above), and in its best 8 ms the hand holds
          # 0.59 at 1.85 and 2.05 m/s against 0.75 – 0.94 up to 1.45. By that
          # measurement's own rule (a run of two 4 ms cells that each hold
          # 0.75) the band's top would be 1.2 m/s; these keys stay where the
          # planner publishes.
          speed:
            c_min: 0.5
            c_cap_max: 2.1
            c_ent_max: 2.1
            v_perp_max: 0.125
            a_brake: 5.0
          # When the closure has to be complete, measured from the entrance
          # crossing [s]: the window, on the axis where the closure completes
          # T_close_e2e after its command. From the fly-ins at the cores'
          # reference speed (#802; the 2.0 – 2.1 m/s cells of
          # 4 ms that held in at least half of 16): counted from the ORIGIN
          # the closure has to be complete 28 – 20 ms before the ball centre
          # arrives, and the entrance crossing is s_ent / c = 3.4 ms earlier
          # — on this key's axis -24.6 … -16.6 ms. (The 1.8 – 1.9 m/s cells
          # give -24.2 … -12.2 ms; the 1.9 – 2.0 ones only 4 ms. It was -8.5
          # / +29.2 ms, the window at 0.55 m/s.) The nominal instant is NOT a
          # key: it is T_close_e2e - the lead from the entrance crossing,
          # -20.5 ms at 2.0 m/s — the middle of the window.
          # sigma_tau is the closure time's sample std (0 in sim; a tick's
          # quantisation, 0.58 ms, is not added). Read by the cores' timing
          # row only, which is off with the chance rows.
          closure:
            delta_lo: -0.0246
            delta_hi: -0.0166
            sigma_tau: 0.0
          # The impact model: where on the hand the ball first lands (catch
          # frame [m] — the first contact of a ball coming down the approach
          # axis onto the open hand) and the restitution (the sim ball's on a
          # rigid surface; the hand's own was not measured). e_max / p_max
          # (energy and impulse caps) are not set: those rows are off.
          impact:
            contact_point_hand: [-0.0054, -0.0106, -0.0320]
            restitution: 0.732

        # T_release_timeout is NOT set: absent, it is derived from this profile
        # (the slower of a torque-saturated and a first-order release,
        # doubled): 2.34 s with the poses and eta_close above and q_tol at its
        # default 0.01 (not set here — a new default moves it). Sim
        # (200 throws): release -> q_pre 506-516 ms, p99 516 ms,
        # so twice the p99 is 1.03 s — inside the derived value, no hang.

        # The hand-joint capture witness: a caging joint
        # stopped part-way (rho in [rho_min, rho_max], |qd| <= qd_tol) while
        # pushing toward q_close (effort >= effort_frac_min of the hand device's
        # max_torque) for t_persist makes the verdict Captured even when no
        # fingertip saw the ball.
        # CALIBRATED on 100 throws (witness off): every truth
        # failure ended with all joints at rho >= 0.9999 and effort <= 0.007 of
        # max_torque; every stalled joint of a truth success sat at rho
        # 0.797-0.924 with effort >= 0.999 (mostly thumb_cmc_fe, once ring_mcp).
        # The bounds are the midpoints of those gaps (rho_max between 0.924 and
        # 1, rho_min between a hand that never closed and 0.797, effort between
        # 0.007 and 0.999). VALIDATED on 100 further throws (frozen):
        # false-Captured 0/52; false-Missed 8/48 (fingertips alone on the same
        # throws: 22/48; all 14 promotions were truth successes). Of the 8 left,
        # 6 are a ball the fingers closed over completely (every joint at
        # q_close — invisible to joint evidence) and 2 a stalled joint still
        # moving faster than qd_tol. Sim only: the sim hand lanes carry no noise
        # and a real hand's effort lane need not be a torque (provisional
        # blocks the real arm).
        capture:
          provisional: true
          rho_min: 0.4
          rho_max: 0.95
          effort_frac_min: 0.5
          t_persist: 0.1

    # ── Vision ingress ──────────────────────────────────────────────────────
    # The prediction lane this controller subscribes to, and the numbers it
    # judges each message against. All PROVISIONAL in the sense that they are
    # derived from the sim profile
    # and one measured detection latency — they are re-derived, not re-guessed,
    # when either changes.
    io:
      # ball_perception `sim_estimator_node`'s debug prediction topic. A DEBUG
      # topic with no stable ABI, which is why the parser locates fields
      # by name rather than by offset.
      traj_topic: "/ball_perception/debug/prediction/trajectory"
      # Measured, not assumed: `world` was seen on 856 messages across both
      # robots. Compared on every message — a publisher that changes frame
      # keeps producing entirely plausible numbers in a different space.
      expected_frame: "world"
      # Vision world → MODEL world is not a key here: it is the
      # model frame `scene_world` (#779), urdf.extra_frames in sim.yaml and in
      # every overlay that swaps the scene — the same world a `scene_world`
      # task goal names. The planner and the CLIK work in the Pinocchio
      # universe, whose root on this URDF is `base_link` — 180° about z from
      # `base`, the frame scene_world hangs off — so the ingress applies
      # Rz(180°) and the pedestal's 0.7 m to every prediction (without
      # the turn every candidate landed behind the arm). No scene_world (a
      # real arm until the camera is calibrated) leaves the vision lane
      # inert with one ERROR. The offline tools read the same frame (rtc_tools
      # catching_trials).
      # = ceil(horizon_min / dt_expected) + 1 = ceil(0.53 / 0.05) + 1. The +1 is
      # not a margin: n samples spaced dt apart span (n-1)*dt, so 11 points
      # cover 0.50 s and fall 30 ms SHORT of the window a commit decision
      # needs — every minimal message would then trip the horizon warning.
      n_min: 12
      # Three publish periods at the measured 30 Hz. A 30 % drop
      # injection thins publishing to ~15 Hz at p95 (67 ms), so one dropped
      # message must not read as stale — and the ghost-track silence after a
      # lost ball (the last VALID prediction arrives within 34 ms, then
      # nothing) is read as loss inside this window.
      t_stale: 0.10
      # REAL-ARM value: the budget for clock disagreement between the vision PC
      # and this one, which on hardware is a PTP/NTP question (to be confirmed
      # on the real rig). The sim value is the `sim.io` override below.
      future_tol: 0.001
      # The commit condition: T_close,tot 0.303 (robot.hand.T_close_lead
      # 0.302 + h/2 0.001) + T_arm 0.05 + margin 0.03 + L 0.14 = 0.523, rounded
      # UP to 10 ms. Rounding down would admit a prediction that misses it by
      # 3 ms. Nothing at configure ties this value to the lead: it moves by
      # hand when T_close_lead does. A shorter prediction is diagnosed, not
      # refused, and the sim estimator's predictions carry 1.0 s.
      horizon_min: 0.53
      track:
        # How far past the later origin two consecutive predictions are
        # compared. Inside both windows, so neither is extrapolated.
        eval_offset: 0.05
        # TBD: the jump distribution has not been measured on this profile, and
        # a threshold invented here would warn about nothing or about
        # everything. Diagnostic only — it does not block arming.
        j_warn: TBD

    # ── What the vision profile is expected to produce ──────────────────────
    # Must match the vision profile's `prediction.step_s` (0.05 s): the
    # spacing floor the decoder refuses below is derived from it, and `n_min`
    # above is derived from it too. The sim profile is ball_perception's
    # `ball_perception_sim/config/sim_profile.catching.json` — that repository
    # owns it, so nothing here checks the pair; change both.
    prediction:
      dt_expected: 0.05

    # ── Sim-only overrides (active iff every claimed device is the simulator)
    # The sim ball lane's stamps ride the SIM time axis anchored at launch, so
    # they lead wall by the in-flight phase error — two orders of magnitude
    # above any clock-sync budget (see rtc_mujoco_sim/README.md, Projectile
    # Ball stamp). 0.1 s is the same
    # width the sim vision profile allows with
    # `time.max_future_skew_s`. On hardware this key is not read and
    # `io.future_tol` above applies.
    sim:
      io:
        future_tol: 0.1

    # ── The CLIK step ───────────────────────────────────────────────────────
    # Gains and weights, all provisional: they are the documented defaults
    # and have not been tuned on this robot. The ORDERING is not a
    # preference — the validator refuses a profile where the posture weight
    # reaches the task weight, because that produces a controller which tracks
    # its own posture and treats the catch point as a suggestion.
    joint_cmd:
      K_p: 20.0      # 1/s, position rows
      K_a: 8.0       # 1/s, approach-axis rows (reference.axis.k_axis)
      K_n: 1.0       # 1/s, posture
      w_task: 1.0
      w_a: 0.5
      w_arm: 0.01
      w_smooth: 0.001
      damping_sq: 0.0001
      qp:
        max_iter: 20
      # `dynamic` form: per-tick torque rows M·v̇ + h within ±eta_tau·tau_max.
      # Chosen on a sim A/B with the arm aligned to planner.wait_pose before
      # every throw (#537): ‖FK(q_cmd) − ref_x‖ p50 / p95 was 3.2 / 68 mm under
      # `dynamic` against 163 / 624 mm under `box` — the constant box
      # (robot.arm.qdd_max) cannot keep up with the reference.
      accel_constraint: dynamic
      eta_tau: 0.8
      lag:
        # The SIM arm's lag, led: ../mujoco_simulator.yaml runs the position
        # servo at kd/kp = 0.05 s, a first-order lag a least-squares fit reads as
        # 50 ms on all six joints (#537). T_arm is not
        # only the lead: the validator derives the commit window from it
        # (planner.freeze.T_freeze below).
        #
        # A REAL arm's T_arm is not this number — it is identified on hardware.
        # The day it is, the sim's 0.05 needs a place of its own: this key cannot
        # hold both.
        #
        # `provisional` is about the REAL arm's T_arm: sim warns, a real arm
        # parks until it is identified — whatever the value
        # and with the lead off too, since T_arm also sits in the T_freeze
        # floor. Absent reads as true.
        provisional: true
        T_arm: 0.05
        lead_enable: true

    supervisor:
      # ── Thresholds the joint command layer reports to ─────────────────────
      # ‖q_meas − q_cmd‖. CLIK does not use the measured state, so this
      # watchdog is the ONLY thing that notices the arm is not where it was
      # told to be. PROVISIONAL (twice the observed peak): the
      # sim runs (0.05 s sim servo, #537)
      # peaked at 0.21 rad before t_c in every 2x2 arm, lead on or off, and in
      # the 200-throw tuning set; RETREAT peaked at 0.058. The earlier 1.54
      # was measured on the MJCF's 0.2 s servo, and that servo (a launch with
      # use_yaml_servo_gains:=false) peaks near 0.77 rad — past this value, so
      # it would abort almost every throw. The real-arm value is set on
      # hardware; the controller is parked on the real arm until then.
      track_err_abort: 0.42
      # How long COMMITTED/CLOSING may run on a stale prediction past io.t_stale
      # before BALL_STALE_LONG. Kept at its earlier value: the tuning set's
      # committed-snapshot age peaked at 65 ms, under t_stale, so no throw came
      # near it and the sim gives no reason to tighten it. Written here so the
      # value is owned by this file, not by the parser default.
      stale_committed_max_s: 0.10
      # REF_SATURATED: consecutive saturated reference ticks. 60 fired
      # on 3/200 tuning throws and 2/100 lead-on 2x2 throws, and 2 of those 3
      # had caught the ball. Re-run with the check off (same 200 throws): the
      # longest streak was 61, p99 58, and none reached 70. 80 leaves 19 ticks
      # above that max. 200 throws cannot show a target of ≤ 0.5 % per
      # throw on their own.
      sat_ticks: 80
      # Consecutive TRIALS ended by a CLIK failure before the controller
      # latches a fault (counted per trial — a trial
      # that reaches HOLD's verdict resets the count). Three trials the solver
      # ends in a row is not a transient, and retrying forever is how a
      # controller ends up aborting in a loop with nothing that escalates.
      n_qp: 3
      # Motion deadlines: past either, the supervisor
      # latches a fault (ABORT_ESCALATED -> FAULT). Twice the longest stage
      # this robot ran in the sim sessions (32 sessions; the
      # envelope-qdd_max ones ramp faster and never set the max), floored at
      # 0.5 s:
      #   stop_s   = 2 x max(ABORT_SAFE ramp 1.546 s, RETREAT stop 2.138 s)
      #            -> 4.28. The worst stop was a degraded abort cycle: the
      #            command was already at rest and the arm took 2.1 s to catch
      #            up with it (track_err 0.47 > 0.42) — the catch-up, not the ramp.
      #   return_s = 2 x RETREAT return 7.380 s (a reach-first catch
      #            3.4 rad of wrist_3 from the wait pose at homing.v_max) -> 14.76.
      # PROVISIONAL: sim values — the real arm's are set on hardware, so a
      # real-arm configuration stays parked until then.
      deadline:
        stop_s: 4.28
        return_s: 14.76
        provisional: true

    # What stays here is the planner THREAD's own: whether it runs, how it
    # wakes, the wait pose and the catch sub-model, the freeze lead and the
    # block's provisional flag — and the two keys that select the search and
    # the segment mode. Each function's keys are in its fragment under
    # catching/ (planner.search.grid, planner.search.nlp, planner.segment.mpc,
    # planner.segment.mpc_docking), all under this same `planner:` map.
    planner:
      search:
        # THE SELECTOR of the search : which function turns a predicted
        # ball into a catch plan, chosen once per configuration. grid: one
        # candidate per vision sample, a closed-form gamma profile per
        # candidate (the code default, when the key is absent; its keys:
        # planner.search.grid). nlp: the docking problem solved per candidate
        # catch instant (its keys: planner.search.nlp) — needs a segment
        # planner (segment.mode mpc or mpc_docking; with closed_form it parks)
        # and robot.hand.docking, and is sim only while
        # robot.hand.docking.provisional is true.
        mode: grid
      segment:
        # THE SELECTOR: what the arm follows from APPROACH to the end of the
        # stop, chosen once per configuration and never mixed
        # within it. closed_form: the RT tick makes the reference itself — the
        # soft-catch reference (SoftCatchTranslation), then the decel target
        # (DecelTarget) (the code default,
        # when the key is absent). mpc: the planner thread's mpc segment
        # planner publishes joint segments and the RT follows them (its keys:
        # planner.segment.mpc, catching/segment_mpc.yaml) — needs
        # planner.enabled and the approach grid
        # (planner.segment.mpc.approach.n_pre_max > 0), else it parks; a DECEL
        # with no segment to follow aborts (ABORT_SAFE), never closed_form.
        # mpc_docking: the docking segment planner's segments instead (its
        # keys: planner.segment.mpc_docking, catching/segment_mpc_docking.yaml)
        # — the docking problem per segment, nothing published after the
        # catch; needs robot.hand.docking and is sim only while
        # robot.hand.docking.provisional is true.
        # Shipped mpc although closed_form catches more here: catch success
        # 0.58 against 0.69 on the same 300 throws (#632).
        # Set closed_form to run the closed-form law.
        mode: mpc
      # ── Planner thread ────────────────────────────────────────────────────
      # ON: the planner is the plan box's only writer — the
      # oracle plan above is off (a profile enabling both is parked).
      enabled: true
      # The longest the planner sleeps without a new trajectory. It also re-plans on this cadence while vision is quiet.
      wake_timeout_s: 0.05
      # IK seed and wait pose, ARM joint order [rad]. Chosen in the
      # pedestal scene's viewer: in deg [-0.02, -32.13,
      # -128.82, -84.38, -90.83, -90.91] — the catch point 0.80 m above the
      # base axis, the palm facing +x of `base` and tilted 25 deg up. It
      # replaces the catchability map's pose [0.212, -1.376, 1.107, -1.978,
      # -3.296, 0.121], and everything that was derived FROM that pose is
      # stale until re-derived: the frozen throw box. PROVISIONAL.
      # Consumed as the IK seed and homed to.
      wait_pose: [-0.000375, -0.560813, -2.248387, -1.472702, -1.585359, -1.586749]
      # Where the wait pose comes from. `yaml` = the
      # list above. `current` = the arm's measured pose on the first readable
      # tick AT REST of each activation (a moving arm defers the decision; armed
      # while moving, under an E-STOP, or outside the margined box = refused
      # with a WARN, the list stays) — "put the arm somewhere with demo_joint /
      # demo_task, switch to this controller, that is the wait pose": homing is
      # a no-op and the planner seeds its IK from it (the list above stays the
      # configure-time seed and the fallback when that pose is outside the
      # margined joint box). An E-STOP or fault reset keeps the adopted pose.
      # The read-only mirror `planner.wait_pose` is the LIST, so with `current`
      # the trial runner (which aims at the mirror) refuses at its alignment
      # gate — run experiments with `yaml` and an overlay.
      wait_pose_source: yaml
      # The robot config's catch sub-model: arm root → catch frame parent.
      sub_model: "ur5e_catch"
      freeze:
        # The lower bound — the close lead
        # robot.hand.T_close_lead 0.302  + h/2 0.001 + T_arm
        # 0.05 (joint_cmd.lag) + margin 0.03 = 0.383, rounded up to 10 ms.
        # (0.36 while T_arm was 0 here, #821.) The grid search's commit-lead
        # rank gate (kRankCommitLead) uses the same sum and the lower end of
        # its candidate window is T_freeze, so at or above the bound no
        # candidate in the window carries that penalty bit. The bound is a
        # design value, not the configure requirement: the validator's own
        # (T_close_lead + T_arm + h = 0.354) is lower. Startup log: "commit
        # at t_c − 0.390 s". Provisional. Read by the search, by every
        # segment mode and by the RT (the commit instant).
        T_freeze: 0.39
        # While a plan is followed on a segment planner's segments the search
        # still runs, until the catch instant is this close [s]: not set, so it
        # is T_freeze — the search stops where the plan freezes. A larger
        # value stops it earlier; one below T_freeze parks.
        # t_stop_plan: 0.39
      # The whole block is provisional: sim warns, a real arm parks.
      # That flag is the only one `planner:` has, across the fragments too — it
      # covers `hand.d_eff` and `hand.r_cap` (catching/search_grid.yaml), which
      # carry no flag of their own (the parser never reads one there).
      provisional: true

  # ── Topic configuration ────────────────────────────────────────────────────
  # Group order IS the controller's device index order: ur5e = 0 (held),
  # p1b = 1 (stepped). No publishers: no state message is emitted.
  topics:
    ur5e:
      subscribe:
        - topic: "ur5e/joint_goal"
          role: "target"
    p1b:
      subscribe:
        - topic: "p1b/joint_goal"
          role: "target"

  # ── Controller-owned CSV logs ──────────────────────────────────────────────
  # The T_close measurement reads `p1b_state.csv` — `command_*` gives t_cmd (the
  # tick the step was accepted), `actual_pos_*` gives rho(t), and
  # `t_relative_s` is the RT steady clock. No dedicated
  # diagnostic channel: these columns already carry everything rho needs.
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: ur5e_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: p1b_state
    # Per-tick record. One row per tick including the ticks
    # that decide to do nothing — a gap in this file means a dropped row
    # and nothing else (#234 P-20).
    - msg_type: integrated_bringup/CatchingDiagLog
      instance: catching_diag
