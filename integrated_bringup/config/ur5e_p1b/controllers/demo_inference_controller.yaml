# demo_inference_controller — ONNX 정책으로 UR5e + proto_1b 를 구동한다
#
# 이 파일이 정책의 **관측 계약**이다. 학습 때와 순서·폭·정규화·프레임·관절 부호가
# 하나라도 어긋나면 명령은 여전히 유한하고 관절한계 안이며 그럴듯하게 움직인다 —
# 그래서 여기 있는 모든 키가 configure 에서 검증되고, 어긋나면 bring-up 이 거부된다.
# 스키마 규칙의 SSoT 는 rtc_controllers/params/policy_io_params.hpp (텐서) 와
# rtc_controllers/params/reach_gate_params.hpp (reach gate) 다.
#
# 대상 정책: ObjectHandGraspDeployMulti5-Export-v0 (입력 16 / 출력 9). 텐서 이름·shape·
# element_names 는 그 export YAML 을 옮긴 것이고, 모델에 없는 사실(프레임·관절 부호·
# 물체 프레임)은 그래프와 FK 로 역산해 확정했다.

demo_inference_controller:
  command_type: "position" # 정책 head 는 rad 를 낸다. "torque" 는 configure 실패

  # ── Joint command tail (§7.3) ──────────────────────────────────────────────
  # clamp [q_min+δ, q_max−δ] → **직전 명령** 기준 rate rebound 순서로 적용된다
  # (rtc_controllers/compliance/joint_command_tail.hpp). 측정 q 기준이면 명령이 측정을
  # tick 당 v_max·dt 이상 앞설 수 없어, 추종 지연이 있는 서보에서는 팔이 자기 지연에
  # 묶여 기어간다 (sim 실측 ≈0.02 rad/s vs 정책 slew 0.5 rad/s). activation 과 hold
  # 직후에는 측정 q 에서 다시 시작한다. δ=0 은 device 한계를 그대로 쓴다는 뜻이다.
  joint_limit_margin: 0.0

  # ── 컨트롤러 소유 CSV 로그 ───────────────────────────────────────────────────
  # <session>/controllers/demo_inference_controller/<instance>.csv, 활성 중 매 tick 1행.
  # state 로그의 joint_goal 열 = 정책 목표 (commands 는 그것을 rate-bound 한 값).
  # inference_diag = hold 사유 · policy step · reach gate · 물체 · 폐쇄체인 상태 · 팔 lag ·
  # 손끝 힘 (integrated_bringup/logging/inference_diag_log_pod.hpp). hold 는 모두 같은
  # 래치 자세를 명령하므로, 사유 열이 없으면 "정책이 멈춰 있기로 했다" 와 구별되지 않는다.
  logs:
    - msg_type: rtc_msgs/DeviceStateLog
      instance: ur5e_state
    - msg_type: rtc_msgs/DeviceStateLog
      instance: p1b_state
    - msg_type: integrated_bringup/InferenceDiagLog
      instance: inference_diag

  # ── 컨트롤러 소유 토픽 ──────────────────────────────────────────────────────
  # 정책이 명령을 소유하므로 외부 joint_goal 은 무시된다 (첫 수신 시 1회 경고).
  # 그래도 선언하는 이유는 이것이 **device 그룹 순서**를 세우는 유일한 수단이기
  # 때문이다 — GetSecondaryDeviceName() 과 per-device 한계 표가 이 순서로
  # 인덱싱되고, subscribe 에서 합법인 role 은 `target` 뿐이다.
  topics:
    ur5e:
      subscribe:
        - topic: "ur5e/joint_goal"
          role: "target"
    p1b:
      subscribe:
        - topic: "p1b/joint_goal"
          role: "target"

  inference:
    # ── 모델 ─────────────────────────────────────────────────────────────────
    # 모델 파일은 저장소 밖에 둔다 (public repo). `${RTC_POLICY_DIR}` 는 configure 에서
    # 환경변수로 펼쳐지고 (`~` 도 지원), 변수가 설정돼 있지 않으면 allow_missing_model
    # 에 따라 **hold 모드**로 올라온다 — 경고에 변수 이름이 찍힌다. 변수가 설정돼 있는데
    # 파일이 없거나 이름·shape 이 아래 선언과 다르면 allow_missing_model 과 무관하게
    # configure 실패다 (경로를 가리킨 순간 그 오타는 "이 머신에 정책이 없음" 이 아니다).
    #
    #   export RTC_POLICY_DIR=/path/to/ObjectHandGraspDeployMulti5-Export-v0
    #
    # shape 이 맞는 것과 RT 예산 안에 드는 것은 다른 사실이다. test_demo_inference_alloc
    # 이 고정하는 것은 FakeEngine 경로뿐이고, 실제 ORT Run() 의 지연·할당은
    # test_demo_inference_real_model 이 잰다 (로컬 전용 — 위 변수가 있어야 돌고, 없으면
    # skip = 미검증). 예산은 decimation 과 무관하게 **tick 1개** (500 Hz → 2 ms) 다:
    # Run() 은 정책 step 을 맡은 tick 의 Compute() 안에서 동기 실행된다. 그리고 ORT 의
    # Run() 은 IoBinding 여부와 무관하게 **매 호출 heap 을 할당**한다 — RT-1 의 알려진
    # 위반으로 조건부 수용됐고, 그 조건은 agent_docs/invariants.md RT 절에 있다.
    model_path: "${RTC_POLICY_DIR}/ObjectHandGraspDeployMulti5-Export-v0.onnx"
    allow_missing_model: true
    optimized_model_path: "" # ORT graph-optimized 캐시 경로 (빈 값 = 비활성)
    intra_op_threads: 1 # RT: single-threaded inference

    # ── 정책 주기 ────────────────────────────────────────────────────────────
    # 학습 제어주기 100 Hz (sim.dt 0.005 × decimation 2). 500 Hz / 5 = 100 Hz 이고, sim 은
    # lock-step 이라 1 tick = physics_timestep (2 ms) 의 sim-time 이므로 5 tick = 정책
    # 1 step 이 정확히 10 ms 다. 팔 slew (0.005 rad/step) 와 reach gate 의 hold 디바운스
    # (5 / 100 step) 가 모두 이 step 단위라, 주기가 다르면 둘 다 다른 시간이 된다.
    # control_rate 를 낮추는 대안을 쓰지 않는 이유: ControllerState::dt 는
    # 1/control_rate 인데 sim 이 실제로 진행시키는 시간은 physics_timestep 이라 둘이
    # 어긋나면서 rate 파생 법칙이 전부 틀어진다.
    decimation: 5

    # ── 관측 프레임 ──────────────────────────────────────────────────────────
    # 모든 pose (link·물체) 는 이 URDF 프레임 기준이다. 정책의 root 는 URDF `base` —
    # 저자 레퍼런스가 로봇 모델을 world 원점에 추가 변환 없이 놓고 world 좌표를 그대로
    # 넣기 때문이고, 그 배치에서 world 는 URDF `base` 다. `base_link` 는 이것을 z 로 π
    # 돌린 프레임이라 x·y 가 뒤집힌 채 여전히 그럴듯한 pose 가 들어간다 — 둘을 가르는
    # 것은 "역산이 round number 냐" 가 아니라 (두 프레임 모두 round number 다) **정책이
    # 물체를 정추종하느냐**다: `base_link` 로 주면 물체를 −y 로 옮겼을 때 palm 을 +y 로
    # 보내고 (반추종) 접근 자체를 못 한다. 실측은 sim 두 세션 + 독립 python oracle
    # (2026-09-12). 그래서 root 입력 (robot_root_pos_w/quat_w) 은 아래에서 원점/identity
    # 상수다.
    policy_frame: "base"

    # ── 관절 규약 ────────────────────────────────────────────────────────────
    # q_policy = sign · q_device + offset (속도는 sign 만). 학습 자산(hand-description
    # proto_1b2)은 아래 8 관절의 축이 이 URDF 와 반대다 — thumb_cmc_fe·thumb_mcp 와 팔은
    # 같다. 관측(q, q̇)·명령(gripper_action)·recurrent seed 에 모두 적용된다. 근거: 기록된
    # grasp 자세를 이 부호로 넣었을 때만 네 손끝이 접촉점에서 25 mm 안에 들어온다 (반전
    # 없음 107–192 mm, 전부 반전 시 엄지 64 mm). 여기 없는 관절 이름은 configure 실패다.
    joint_convention:
      thumb_cmc_aa_joint: { sign: -1 }
      thumb_dip_fe_joint: { sign: -1 }
      index_mcp_aa_joint: { sign: -1 }
      index_mcp_fe_joint: { sign: -1 }
      index_dip_fe_joint: { sign: -1 }
      middle_mcp_fe_joint: { sign: -1 }
      middle_dip_fe_joint: { sign: -1 }
      ring_mcp_fe_joint: { sign: -1 }

    # ── 텐서 ─────────────────────────────────────────────────────────────────
    # 입력·출력 모두 텐서 단위 선언이고 name 은 .onnx 이름과 정확히 일치해야 한다
    # (이름으로 바인딩하므로 재export 로 같은 shape 두 텐서의 순서가 바뀌면 load 가
    # 실패한다). 순서는 export 와 같게 둔다.
    #
    # element_names 가 있는 텐서는 feature 를 **이름으로** 배치한다 — 행 하나 = numel /
    # 이름 수 원소. feature 가 덮지 않는 원소는 `fill:` (반복 패턴) 이 매 평가 채운다.
    # 순서 = fill → pack → affine. 부분 피복 텐서에는 affine 을 둘 수 없다.
    inputs:
      # 연속 게이트 [0,1] = max(손끝 근접도, 촉각 hold). 아래 reach_gate 가 계산한다.
      # 0/1 이 아니라 연속값이어야 한다 — 그래프 안에 0.25/0.45 리맵이 있어 계단을
      # 넣으면 학습된 램프를 건너뛴다.
      - name: "reach_phase"
        shape: [1]
        features: ["reach.phase"]
      - name: "object_root_pos_w"
        shape: [1, 3]
        features: ["object.position"] # m, policy_frame
      - name: "object_root_quat_w"
        shape: [1, 4]
        features: ["object.orientation_xyzw"] # Hamilton, x,y,z,w, policy_frame
      # 팔 slew 적분기. 리셋(activation, 긴 hold) 시 측정 팔 q 로 시드 — 0 으로 두면
      # 첫 step 이 전 관절을 0 으로 끌고 간다. export 의 initial_values 는 쓰지 않는다.
      - name: "arm_applied_target_in"
        shape: [1, 6]
        source: recurrent
        seed: "ur5e.position"
      # 손 synergy 적분기 (0 = pregrasp 손, 2 = overdrive). 리셋 시 0.
      - name: "synergy_in"
        shape: [1, 1]
        source: recurrent
      # 6 팔 + 10 구동 + 10 passive + loop 5개 × 4. 채우는 것은 팔·구동 16 개뿐이다 —
      # 그래프가 passive·loop 슬롯을 읽지 않는다. export YAML 은 loop 를 ×3 으로 적어
      # 이름이 41 개뿐이라, loop 행은 `:0..:3` 네 개로 적었다 (텐서는 46).
      - name: "robot_joint_pos"
        shape: [1, 46]
        element_names:
          [
            shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint,
            wrist_3_joint, index_mcp_aa_joint, index_mcp_fe_joint, index_dip_a_joint_passive,
            index_pip_a_joint_passive, index_dip_fe_joint, middle_mcp_fe_joint,
            middle_dip_a_joint_passive, middle_pip_a_joint_passive, middle_dip_fe_joint,
            ring_mcp_a_joint_passive, ring_dip_b_joint_passive, ring_mcp_fe_joint,
            ring_dip_a_joint_passive, ring_pip_a_joint_passive, thumb_cmc_aa_joint,
            thumb_cmc_fe_joint, thumb_mcp_joint, thumb_dip_a_joint_passive,
            thumb_pip_a_joint_passive, thumb_dip_fe_joint,
            "loop_ring_tip_constraint:0", "loop_ring_tip_constraint:1",
            "loop_ring_tip_constraint:2", "loop_ring_tip_constraint:3",
            "loop_middle_tip_constraint:0", "loop_middle_tip_constraint:1",
            "loop_middle_tip_constraint:2", "loop_middle_tip_constraint:3",
            "loop_thumb_tip_constraint:0", "loop_thumb_tip_constraint:1",
            "loop_thumb_tip_constraint:2", "loop_thumb_tip_constraint:3",
            "loop_ring_pip_b_constraint:0", "loop_ring_pip_b_constraint:1",
            "loop_ring_pip_b_constraint:2", "loop_ring_pip_b_constraint:3",
            "loop_index_tip_constraint:0", "loop_index_tip_constraint:1",
            "loop_index_tip_constraint:2", "loop_index_tip_constraint:3"
          ]
        features: ["ur5e.position", "p1b.position"]
        fill: [0.0]
      - name: "robot_joint_vel"
        shape: [1, 41]
        element_names:
          [
            shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint,
            wrist_3_joint, index_mcp_aa_joint, index_mcp_fe_joint, index_dip_a_joint_passive,
            index_pip_a_joint_passive, index_dip_fe_joint, middle_mcp_fe_joint,
            middle_dip_a_joint_passive, middle_pip_a_joint_passive, middle_dip_fe_joint,
            ring_mcp_a_joint_passive, ring_dip_b_joint_passive, ring_mcp_fe_joint,
            ring_dip_a_joint_passive, ring_pip_a_joint_passive, thumb_cmc_aa_joint,
            thumb_cmc_fe_joint, thumb_mcp_joint, thumb_dip_a_joint_passive,
            thumb_pip_a_joint_passive, thumb_dip_fe_joint,
            "loop_ring_tip_constraint:0", "loop_ring_tip_constraint:1",
            "loop_ring_tip_constraint:2", "loop_middle_tip_constraint:0",
            "loop_middle_tip_constraint:1", "loop_middle_tip_constraint:2",
            "loop_thumb_tip_constraint:0", "loop_thumb_tip_constraint:1",
            "loop_thumb_tip_constraint:2", "loop_ring_pip_b_constraint:0",
            "loop_ring_pip_b_constraint:1", "loop_ring_pip_b_constraint:2",
            "loop_index_tip_constraint:0", "loop_index_tip_constraint:1",
            "loop_index_tip_constraint:2"
          ]
        # 속도 lane 이 이번 tick 에 판독 불가면 (driver 가 velocity 를 안 주면) hold 한다.
        features: ["ur5e.velocity", "p1b.velocity"]
        fill: [0.0]
      # 29 body × xyz. 그래프가 읽는 행은 palm + 손끝 4 개다. 손끝은 loop-passive 관절
      # 하류라 closed-chain hand FK 로 계산된다 (passive 를 0 에 고정한 모델에서 읽으면
      # 수 cm 틀린다).
      - name: "robot_body_pos_w"
        shape: [1, 29, 3]
        element_names:
          [
            base, shoulder_link, upper_arm_link, forearm_link, wrist_1_link, wrist_2_link,
            wrist_3_link, tool0, l_palm_link, l_index_mcp_link, l_index_dip_link,
            l_index_pip_linkage_a, l_index_tip_link, l_index_pip_linkage_b, l_middle_mcp_link,
            l_middle_dip_a_link, l_middle_tip_link, l_middle_dip_b_link, l_ring_pip_linkage_a,
            l_ring_dip_linkage_b, l_ring_pip_linkage_b, l_ring_dip_linkage_a, l_ring_tip_link,
            l_thumb_cmc_link_a, l_thumb_cmc_link_b, l_thumb_mcp_link, l_thumb_dip_link_a,
            l_thumb_tip_link, l_thumb_dip_link_b
          ]
        features:
          - "link.l_palm_link.position"
          - "link.l_index_tip_link.position"
          - "link.l_middle_tip_link.position"
          - "link.l_ring_tip_link.position"
          - "link.l_thumb_tip_link.position"
        fill: [0.0]
      # 그래프가 읽는 행은 palm 뿐이다. 나머지 행은 identity quat.
      - name: "robot_body_quat_w"
        shape: [1, 29, 4]
        element_names:
          [
            base, shoulder_link, upper_arm_link, forearm_link, wrist_1_link, wrist_2_link,
            wrist_3_link, tool0, l_palm_link, l_index_mcp_link, l_index_dip_link,
            l_index_pip_linkage_a, l_index_tip_link, l_index_pip_linkage_b, l_middle_mcp_link,
            l_middle_dip_a_link, l_middle_tip_link, l_middle_dip_b_link, l_ring_pip_linkage_a,
            l_ring_dip_linkage_b, l_ring_pip_linkage_b, l_ring_dip_linkage_a, l_ring_tip_link,
            l_thumb_cmc_link_a, l_thumb_cmc_link_b, l_thumb_mcp_link, l_thumb_dip_link_a,
            l_thumb_tip_link, l_thumb_dip_link_b
          ]
        features: ["link.l_palm_link.orientation_xyzw"]
        fill: [0.0, 0.0, 0.0, 1.0]
      # 모든 pose 가 이미 policy_frame 기준이므로 root 는 원점/identity 다.
      - name: "robot_root_pos_w"
        shape: [1, 3]
        source: constant
        values: [0.0, 0.0, 0.0]
      - name: "robot_root_quat_w"
        shape: [1, 4]
        source: constant
        values: [0.0, 0.0, 0.0, 1.0]
      # 손끝 접촉력. 그래프는 ‖F‖ 만 쓰므로 (‖F‖, 0, 0) 로 넣는다 — norm 은 프레임
      # 무관이다. lane 이 stale 이면 0 ("접촉 없음" 과 "판독 없음" 은 같은 관측).
      # sim 의 힘은 손끝 body 의 **모든** 접촉 합력이다 (학습은 물체 접촉만 셌다).
      - name: "thumb_tip_contact_force_matrix_w"
        shape: [1, 1, 1, 3]
        features: ["p1b.thumb.force_norm"]
        fill: [0.0]
      - name: "index_tip_contact_force_matrix_w"
        shape: [1, 1, 1, 3]
        features: ["p1b.index.force_norm"]
        fill: [0.0]
      - name: "middle_tip_contact_force_matrix_w"
        shape: [1, 1, 1, 3]
        features: ["p1b.middle.force_norm"]
        fill: [0.0]
      - name: "ring_tip_contact_force_matrix_w"
        shape: [1, 1, 1, 3]
        features: ["p1b.ring.force_norm"]
        fill: [0.0]
      # 직전 raw 액션 (팔 6 + synergy 1). 리셋 시 0.
      - name: "last_action_in"
        shape: [1, 7]
        source: recurrent

    outputs:
      # 팔 절대 목표 (slew 적용 완료). 이름이 device 순서와 같아 gather 는 identity 다.
      - name: "arm_action"
        shape: [1, 6]
        element_names:
          [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
      # 손 10 관절 목표 — **driver 순서가 아니다** (index → ring → thumb → middle).
      # 이름으로 device 순서에 모은 뒤 joint_convention 을 거꾸로 적용해 명령이 된다.
      - name: "gripper_action"
        shape: [1, 10]
        element_names:
          [
            index_mcp_aa_joint, index_mcp_fe_joint, index_dip_fe_joint, ring_mcp_fe_joint,
            thumb_cmc_aa_joint, thumb_cmc_fe_joint, thumb_mcp_joint, thumb_dip_fe_joint,
            middle_mcp_fe_joint, middle_dip_fe_joint
          ]
      # recurrent 되먹임 전용 — 명령으로 읽으면 은닉 상태를 rad 로 읽는 것이다.
      - { name: "arm_applied_target_out", shape: [1, 6], feeds: "arm_applied_target_in" }
      - { name: "synergy_out", shape: [1, 1], feeds: "synergy_in" }
      - { name: "last_action_out", shape: [1, 7], feeds: "last_action_in" }
      # 학습 PD 게인 (상수). 모델이 요구하므로 선언하지만 소비하지 않는다 — 값은 팔 kp
      # 400/400/250/120/120/120 · kd 80/80/50/25/25/25, 손 kp 200 · kd 20.
      - { name: "arm_action_kp_gains", shape: [1, 6] }
      - { name: "arm_action_kd_gains", shape: [1, 6] }
      - { name: "gripper_action_kp_gains", shape: [1, 10] }
      - { name: "gripper_action_kd_gains", shape: [1, 10] }

    # `role`/`device` 는 **선언**이지 추정이 아니다. 이름을 가진 head 는 offset/count
    # 없이 통째로, 이름으로 읽힌다 (device 관절 전부가 정확히 한 번씩 있어야 한다).
    output_features:
      - { tensor: "arm_action", role: "joint_target", device: "ur5e" }
      - { tensor: "gripper_action", role: "joint_target", device: "p1b" }

    # ── recurrent 리셋 ──────────────────────────────────────────────────────────
    # hold 가 이 시간을 넘으면 재개 시 state 를 리셋한다 (seed 가 있으면 seed, 없으면
    # 0). activation 리셋은 무조건이다. 쥔 채로 긴 hold 에 들어가면 synergy 가 0 으로
    # 돌아가 손이 pregrasp 로 풀린다 — 실측 hold 길이를 보고 확정할 값이다.
    reset_after_hold_sec: 0.1

    # 폐쇄 체인 사영이 walk-in 을 못 끝내고 계속 held 면 손끝 pose 가 **조용히**
    # stale 이다 — 값은 유한하고 매끄러운데 매 tick hold 라 정책이 아예 안 돈다.
    # held 가 이 tick 수를 넘으면 활성화당 한 번 경고한다. tick 은 카운터만 올리고
    # 판단·로그는 100 ms 비-RT 타이머가 한다 (RT-3). 실측 walk-in 은 activation 직후
    # 43 tick 이므로 250 (0.5 s) 은 정상 기동과 겹치지 않는다. 0 = 경고 끔.
    closed_chain_warn_ticks: 250

    # ── object pose ──────────────────────────────────────────────────────────
    # sim ground truth. 실기 이관 시 바뀌는 것은 topic 과 (perception 이 다른 프레임을
    # 쓰면) source_frame_id / source_frame_link 이며, 메시지 타입은 같다.
    #
    # device lane 이 아니므로 프레임워크의 freshness 게이트가 **하나도** 안 걸린다
    # — timeout_sec 이 이 컨트롤러가 직접 지는 그 책임이다 (sim 은 매 tick 재발행,
    # 실기 perception 은 10–30 Hz).
    object_pose:
      topic: "/sim/object_transforms"
      # TFMessage 한 개에 park 안 된 free body 가 **전부** 실린다. prefix 매칭이
      # 정확히 1개가 아니면 (0개든 2개든) invalid 로 처리해 hold 한다.
      match_mode: "prefix"
      frame_match: "pool_" # object_pool 이 스폰하는 body 는 pool_<obj>_object
      # 들어오는 transform 의 header.frame_id — **가정이 아니라 검사**다. 다르면 버려진다.
      source_frame_id: "world"
      # 그 frame_id 가 URDF 의 어느 프레임인가. sim world 는 URDF `base` 와 같고 그것이
      # 곧 policy_frame 이라, 이 프로필에서 변환은 identity 다 — 그래도 이름을 적는다:
      # perception 이 다른 프레임으로 발행하면 여기만 바꾸면 되고, 변환은 (하드코딩한
      # 회전이 아니라) 모델이 준다.
      source_frame_link: "base"
      timeout_sec: 0.2

    # ── reach gate ───────────────────────────────────────────────────────────
    # reach_phase = max(exp(−(d_tip/σ)²), hold ? 1 : 0), 매 policy step 새로 계산
    # (ratchet 없음). d_tip = 손끝 4 개와 "물체에 붙어 다니는 기록 접촉점" 사이 평균 거리.
    # hold = 첫 tip(엄지) > 0.5 N 이고 나머지 중 min_fingers 개 이상 > 0.5 N 인 step 이
    # hold_on_steps 연속이면 ON, 아니면 hold_off_steps 연속에서 OFF. step 은 policy step
    # 이다 (tick 이 아님).
    #
    # contact_obj 는 **정책이 학습된 물체 프레임** 기준이다 — 원통 (r 0.04, h 0.15) 의
    # **중심**. grasp 기록 JSON 의 pos_obj 는 아래 면 기준이라 z 가 0.075 m 다르고, 그
    # 값을 쓰면 거리가 항상 수 cm 길게 나와 게이트가 열리지 않는다 (≈0.001). 아래 값은
    # 모델에 구워진 접촉점 상수를 그대로 옮긴 것이다.
    reach_gate:
      tips: # 엄지 먼저 — grasped 판정이 "엄지 vs 나머지" 대향 구조다
        # link 은 **손끝 bracket** 이다 (`l_*_tip_link` 이 아니라). 기록된 접촉점은
        # 손가락이 실제로 닿는 면에 찍혀 있고, 그 면은 tip_link 원점이 아니라 거기서
        # 17.5 mm 떨어진 bracket 프레임 근처다 — 학습 자산 (proto_1b2.xml) 은 그것을
        # `site_l_*_tip_bracket` 로, 이 URDF 는 같은 오프셋의 고정 링크로 갖는다.
        # 실측 (기록된 grasp 자세, 접촉점까지 거리): bracket 11.0 mm vs tip_link
        # 25.6 mm → 게이트 값 0.873 vs 0.481. σ 가 30 mm 이므로 이 차이는 게이트를
        # 늦게 열리게 하고, 범위 검사에는 걸리지 않는다.
        - { link: "l_thumb_tip_bracket", force_group: "thumb", contact_obj: [-0.013565, 0.037512, 0.005946] }
        - { link: "l_index_tip_bracket", force_group: "index", contact_obj: [-0.032927, -0.022462, 0.011726] }
        - { link: "l_middle_tip_bracket", force_group: "middle", contact_obj: [-0.010342, -0.038602, 0.017704] }
        - { link: "l_ring_tip_bracket", force_group: "ring", contact_obj: [0.01168, -0.038178, -0.002864] }
      tip_std: 0.030 # m
      force_threshold: 0.5 # N, strict >
      min_fingers: 2
      hold_on_steps: 5 # 50 ms @ 100 Hz
      hold_off_steps: 100 # 1.0 s @ 100 Hz
