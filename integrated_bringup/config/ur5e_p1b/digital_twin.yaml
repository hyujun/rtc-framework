# ur5e_p1b/digital_twin.yaml — UR5e + proto_1b closed-chain hand digital-twin config
#
# Layered on top of `rtc_digital_twin/config/digital_twin.yaml`. Production
# bringups should pass this via `config_file:=` to digital_twin.launch.py:
#
#   ros2 launch rtc_digital_twin digital_twin.launch.py \
#       config_file:=$(ros2 pkg prefix --share integrated_bringup)/config/ur5e_p1b/digital_twin.yaml
#
# Robot identity (URDF, joint topics, sensor topics, fingertip names) lives
# here per ARCH-1; rtc_digital_twin stays robot-agnostic.
#
# Unlike ur5e_p1a (mimic-based), proto_1b is a genuine 5-loop closed chain
# (urdf.extended). `closure_path` below is the Extended-URDF `<stem>.closure.yaml`
# sidecar — its presence makes digital_twin.launch.py spawn a
# `closure_state_publisher` (rtc_urdf_bridge) that reconstructs the loop-passive
# joints from the actuated q so RViz renders the closed chain. digital_twin_node
# then forwards actuated joints to that solver instead of publishing directly.
# Coupling is topic-only (no build-time dep) → ARCH-2 preserved.

/**:
  ros__parameters:
    # ── Robot description (hand_description proto_1b combined model) ────
    robot_description_package: "hand_description"
    robot_description_path: "robots/ur5e_p1b/urdf/ur5e_with_proto_1b.urdf.xacro"

    # ── Loop-closure sidecar (enables closure_state_publisher) ─────────
    # pkg-relative to robot_description_package (hand_description share).
    closure_path: "robots/ur5e_p1b/urdf/ur5e_with_proto_1b.closure.yaml"

    # ── Closure solver tolerance ──────────────────────────────────────
    # No override needed since #250: proto_1b's residual floor (~3e-8 m,
    # rank-deficient contact_3d loops + ring-closure coordinate mismatch)
    # is handled by the solver's acceptance tolerance (default 1e-6 m) —
    # the publisher commits floor solutions without relaxing the *stopping*
    # tolerance (the old `closure_tolerance: 1.0e-6` workaround from #124,
    # which skipped refinement whenever the seed was already within 1e-6).
    # `closure_tolerance` (strict) / `closure_acceptance_tolerance` remain
    # available as agnostic overrides for exotic linkages.

    # ── Joint state sources (UR5e arm + proto_1b hand) ────────────────
    # CM publishes per-device joint_states on /rtc_cm/<group>/joint_states
    # (device groups: ur5e, p1b — see config/ur5e_p1b/{sim,robot}.yaml).
    num_sources: 2

    source_0.topic: "/rtc_cm/ur5e/joint_states"
    source_0.joint_names: [""]        # empty/"" = accept all joints from topic

    source_1.topic: "/rtc_cm/p1b/joint_states"
    source_1.joint_names: [""]

    # ── Sensor visualization (proto_1b fingertip sensors) ─────────────
    sensor_viz.sensor_topic: "/p1b/sensor_states/monitor"
    # Each name is used verbatim as the marker frame_id (and marker-ns prefix),
    # so it must equal a link in the combined URDF or RViz drops every marker
    # (unknown frame). These are proto_1b's fingertip bracket links (proto_1b.urdf,
    # included prefix-free by ur5e_with_proto_1b.urdf.xacro). Data mapping is
    # positional in _sensor_cb (thumb,index,middle,ring order), so the frame the
    # markers attach to changes but sensor pairing is unaffected.
    sensor_viz.fingertip_names:
      ["l_thumb_tip_bracket", "l_index_tip_bracket", "l_middle_tip_bracket", "l_ring_tip_bracket"]
    # proto_1b has no contact classifier (contact_flag ≡ 0), so gate the F arrow
    # on firmware force magnitude instead. 1.0 N aligns with the p1b controller's
    # grasp_force_threshold (controllers/demo_shared.yaml). Viz-only — tune freely.
    sensor_viz.force_display_threshold: 0.7

    # ── TCP visualization ─────────────────────────────────────────────
    # tf2 lookup (`base → tool0_actual`); active controller 의
    # <config_key>/transforms 는 digital_twin_node 의 controller_tf 재발행이
    # /tf 로 올려주므로 (기본 활성) tcp_viz listener 가 그 프레임을 받는다.
    tcp_viz.source_topic: "tool0_actual"
