# ur5e_p1b/robot.yaml — real-hardware delta (overlaid on _base.yaml)
# Used by robot_ur5e_p1b.launch.py (UR driver + udp_hand_driver).
# Loaded AFTER _base.yaml, which holds all mode-agnostic config (URDF/model
# topology, joint & sensor rosters, limits, control_rate, logging). This file
# owns ONLY what differs from simulation: real backends + wire topics, the
# command/motor rosters, E-STOP enablement, and hardware init timing.
/**:
  ros__parameters:
    # ── Initial controller ────────────────────────────────────────────────────
    initial_controller: "demo_wbc_controller"

    # ── Initialization timeout ────────────────────────────────────────────────
    init_timeout_sec: 30.0 # wait for real hardware init/homing

    # ── E-STOP configuration ──────────────────────────────────────────────────
    enable_estop: true
    device_timeout_values: [1000.0, 1000.0] # ms — tight for real HW watchdog

    # ── Device backends + hardware rosters ────────────────────────────────────
    devices:
      ur5e:
        backend:
          type: "ur_driver_native"
          state_topic: "/joint_states"
          command_topic: "/forward_position_controller/commands"
        joint_command_names:
          - "shoulder_pan_joint"
          - "shoulder_lift_joint"
          - "elbow_joint"
          - "wrist_1_joint"
          - "wrist_2_joint"
          - "wrist_3_joint"
      p1b:
        backend:
          type: "udp_hand_native"
          state_topic: "/p1b/joint_states"
          command_topic: "/p1b/joint_command"
          motor_topic: "/p1b/motor_states"
          sensor_topic: "/p1b/sensor_states"
        motor_state_names:
          - "motor_1"
          - "motor_2"
          - "motor_3"
          - "motor_4"
          - "motor_5"
          - "motor_6"
          - "motor_7"
          - "motor_8"
          - "motor_9"
          - "motor_10"
        # p1b real hw has NO native contact/displacement channels: the udp_hand
        # stream carries a fixed contact_flag=0.0 and a force-only inference lane.
        # Consumers derive in_contact / grasp_detected from |F| > grasp_force_threshold.
        sensor_layout:
          has_native_contact: false
          has_native_displacement: false
