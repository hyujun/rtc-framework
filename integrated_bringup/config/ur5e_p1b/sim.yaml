# ur5e_p1b/sim.yaml — MuJoCo-simulation delta (overlaid on _base.yaml)
# Used by sim_ur5e_p1b.launch.py. For real robot, use robot.yaml instead.
# Loaded AFTER _base.yaml, which holds all mode-agnostic config (URDF/model
# topology, joint & sensor rosters, limits, control_rate, logging). This file
# owns ONLY what differs from real hardware: MuJoCo backends + sim topics,
# sim-time sync, relaxed E-STOP/timeouts, and the demo_joint startup controller.
/**:
  ros__parameters:
    # ── Initial controller ────────────────────────────────────────────────────
    initial_controller: "demo_joint_controller"

    # ── Initialization timeout ────────────────────────────────────────────────
    init_timeout_sec: 0.0 # Disabled for simulation (no real hardware init)

    # ── Simulation sync ──────────────────────────────────────────────────────
    use_sim_time_sync: true       # CV-based wakeup (sim), false = clock_nanosleep (real)
    sim_sync_timeout_sec: 5.0     # Shutdown if no state received within timeout

    # ── E-STOP configuration (relaxed for simulation) ────────────────────────
    enable_estop: false # Disabled for simulation
    device_timeout_values: [10000.0, 10000.0] # Relaxed for sim startup

    # ── Device backends (MuJoCo bridge) ───────────────────────────────────────
    devices:
      ur5e:
        backend:
          type: "mujoco_native"            # sim mode: MuJoCo bridge
          state_topic: "/ur5e/joint_states"     # sim publishes full URDF joints here
          command_topic: "/ur5e/joint_command"
      p1b:
        backend:
          type: "mujoco_native"            # sim mode: MuJoCo bridge (no motor lane)
          state_topic: "/p1b/joint_states"
          command_topic: "/p1b/joint_command"
          # ── Fingertip wrench lane ────────────────────────────────────────
          # List order = inference_enable[f] index = sensor-lane slot f, and it
          # MUST be the controller-facing finger order thumb → index → middle →
          # ring. That is the order _base.yaml's tree_models tip_links,
          # digital_twin's sensor_viz.fingertip_names and every grasp consumer
          # already use: slot f is paired POSITIONALLY with FK/contact frame f
          # (fingertip_data_[f] ↔ fingertip_rotations_[f], the #167 Stage A-3
          # contract). Reordering this list silently mis-pairs forces with
          # fingers — the magnitudes stay plausible, only the finger is wrong.
          #
          # The mujoco backend subscribes to each WrenchStamped and packs
          # fx/fy/fz into inference_data slots 1..3 (stride 7, dead slots 0 and
          # 4..6 zero-filled). Empty list disables the lane.
          #
          # SIGN. This lane is geometry_msgs/WrenchStamped, which rtc_mujoco_sim
          # publishes **link-on-environment** — the SAME sign as
          # rtc_msgs/FingertipSensor.f (finger-on-object), which is what the
          # real 1b firmware feeds these same inference slots. So sim and real
          # agree here and no consumer needs a conversion: the pull estimator
          # keeps force_sign at its +1 default in demo_shared.yaml for both.
          #
          # It was not always so. The lane used to publish env-on-link (the ROS
          # wrench reading), which made this profile's +1 wrong in sim while
          # being right on hardware — a solid grasp published an all-zero
          # estimate because every f_n = -n·f_obj came out negative. Flipping
          # the simulator (mujoco_sim_loop.cpp ReadContactWrenches) fixed that
          # rather than splitting demo_shared.yaml per mode.
          fingertip_wrench_topics:
            - "/p1b/l_thumb_tip_contact/contact_wrench"
            - "/p1b/l_index_tip_contact/contact_wrench"
            - "/p1b/l_middle_tip_contact/contact_wrench"
            - "/p1b/l_ring_tip_contact/contact_wrench"
          # Consecutive missed RT ticks before inference_enable[f] flips to
          # false. 500 Hz × 5 = 10 ms freshness budget; force values are
          # preserved across stale ticks (controller gates on the bool).
          max_consecutive_missed_ticks: 5
        # has_native_* both false: mujoco backend does not synthesize contact
        # probability or displacement vectors (sensor_topic is unset in sim).
        # Controllers fall back to |force| > grasp_force_threshold derive.
        sensor_layout:
          has_native_contact:  false
          has_native_displacement: false
