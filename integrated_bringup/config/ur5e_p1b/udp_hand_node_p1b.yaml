# ur5e_p1b/udp_hand_node_p1b.yaml -- standalone config for the p1b hand
#
# 완전 독립(self-contained) 파일이다. robot_ur5e_p1b.launch.py 는 이 파일만
# udp_hand_node 에 넘긴다 (+ 공용 fingertip_ft_inferencer.yaml). p1a 용
# udp_hand_driver/config/udp_hand_node.yaml 과는 더 이상 base+overlay 관계가
# 아니다 — 여기서 명시하지 않은 키는 udp_hand_node 의 C++ declare_parameter()
# 기본값으로 fallback 한다 (p1a yaml 값이 아님).
#
# protocol_version "1b":
#   - communication_mode 는 반드시 "bulk" — 1b force layout 은 bulk 전용이고
#     C++ 기본값 "individual" 로 두면 on_configure 가 실패한다.
#   - joint state/command 는 kMotor MODE 로 주고받는다 (1b 펌웨어의 유일한
#     joint-serving 모드; JointIoMode()=kMotor). 펌웨어가 요청 MODE 를 정확히
#     echo 하므로 수신 MODE 검증은 strict 유지 (VerifiesResponseMode()=true).
#   - /p1b/sensor_states = HandSensorState, 핑거당 f[3]={fx,fy,fz} (firmware force).
#   - /p1b/motor_states 미발행 (별도 motor-space read 스킵) → motor_state_names 생략.
#   - LPF/drift/F-T 후처리 파라미터는 1b 경로에서 무시되므로 생략 (C++ 기본 off).
/**:
  ros__parameters:
    # -- Fake hand 모드 (하드웨어 없이 standalone 테스트용) --
    use_fake_hand: false
    fake_tick_rate_hz: 500.0

    # -- UDP 통신 (p1b 핸드 하드웨어) --
    target_ip: "192.168.0.100"        # p1b 핸드 컨트롤러 IP
    target_port: 55151                # TODO(confirm): p1b 포트 — 현재 p1a 와 동일값 유지
    recv_timeout_ms: 0.4              # ppoll 수신 타임아웃 (ms), 0.4 -> 400us

    # -- 통신/프로토콜 --
    communication_mode: "bulk"        # 1b force layout 전용 (individual 조합 시 configure 실패)
    protocol_version: "1b"

    # -- UDP 통신 decimation (부하 감쇠 테스트용, 기본 1 = 매 사이클 통신) --
    # N 이면 N 사이클 중 1번만 실제 UDP 통신, 나머지는 건너뜀. N 을 크게 하면
    # min_rate_hz 를 낮추거나 rate/link 검사를 조정해 failure detector 오탐 방지.
    comm_decimation: 1

    # -- Publish rate (link_status decimation) --
    publish_rate: 100.0

    # -- 조인트 이름 (p1b URDF joint 명) --
    joint_state_names:
      - "thumb_cmc_fe_joint"
      - "thumb_cmc_aa_joint"
      - "thumb_mcp_joint"
      - "thumb_dip_fe_joint"
      - "index_mcp_aa_joint"
      - "index_mcp_fe_joint"
      - "index_dip_fe_joint"
      - "middle_mcp_fe_joint"
      - "middle_dip_fe_joint"
      - "ring_mcp_fe_joint"

    # -- Joint position offset (degree) --
    # joint_state_names 와 동일 순서(10개). 프레임 정의: URDF/controller − firmware zero.
    #   수신(joint_states 발행): udp_pos + offset  → controller-side
    #   송신(joint_command→UDP): controller_cmd − offset → 펌웨어
    # 두 경계가 대칭이라 명령↔상태 왕복이 항등. 전부 0 이면 offset 없음(기본).
    joint_position_offsets_deg:
      - 0.0   # thumb_cmc_aa_joint
      - 0.0   # thumb_cmc_fe_joint
      - 0.0   # thumb_mcp_joint
      - 0.0   # thumb_dip_fe_joint
      - 0.0   # index_mcp_aa_joint
      - 0.0   # index_mcp_fe_joint
      - 0.0   # index_dip_fe_joint
      - 0.0   # middle_mcp_fe_joint
      - 0.0   # middle_dip_fe_joint
      - 0.0   # ring_mcp_fe_joint

    # -- 핑거팁 이름 (1b: 핑거당 force 발행에 사용) --
    hand_fingertip_names:
      - "thumb"
      - "index"
      - "middle"
      - "ring"

    # -- ROS2 토픽 (p1b 네임스페이스) --
    command_topic: "/p1b/joint_command"
    joint_state_topic: "/p1b/joint_states"
    motor_state_topic: "/p1b/motor_states"   # 미발행 (1b: motor-space read 스킵)
    sensor_topic: "/p1b/sensor_states"
    link_status_topic: "/p1b/link_status"

    # -- Sensor calibration (trigger + status) --
    calibration_command_topic: "/p1b/calibration/command"
    calibration_status_topic: "/p1b/calibration/status"
    calibration_status_rate_hz: 5.0

    # -- Failure Detector 설정 (50Hz non-RT jthread) --
    enable_failure_detector: true
    failure_threshold: 5
    check_motor: false               # 1b: motor-space read 미수행 → motor_valid 항상 false (검사 무의미)
    check_sensor: true               # 1b: sensor_force 의 fx,fy,fz all-zero/duplicate 검사
    min_rate_hz: 30.0
    rate_fail_threshold: 5
    check_link: true
    link_fail_threshold: 10
