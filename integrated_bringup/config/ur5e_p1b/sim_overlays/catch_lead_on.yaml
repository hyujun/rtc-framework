# sim overlay — dynamic_catching S8-B, arm "lead on · planned γ" (#537)
#
#   ros2 launch integrated_bringup sim_ur5e_p1b.launch.py enable_mpc:=true \
#       sim_lanes:=true sim_overlay:=catch_lead_on
#
# This is the sim-runner's standard arm, and the only catching overlay here.
# The S8-B ablation arms (catch_lead_off, *_gamma0) and the S8-E beanbag arm
# were pruned once their results were recorded (S8-B/S8-E, ID_INDEX.md §3). The
# S8-F hand-near arm (s8f_reach_first) and the S8-I switched-in-pose arm
# (catch_wait_pose_current) went on 2026-10-09 (#747): both carried a catch box
# drawn around the wait pose and the floor of the scene they were measured in,
# and the scene and the pose have changed. git history has them all.
#
# WHAT IT IS FOR. The shipped controller runs with `joint_cmd.lag.T_arm: 0`
# because a real-arm actuation lag is an S10 measurement. The sim arm is not
# lag-free: ../mujoco_simulator.yaml runs its position servo at kd/kp = 0.05 s
# (see its "Position Servo Gains"), a first-order lag the S8-A least-squares
# fit reads as 50 ms on all six joints. This overlay leads that plant without
# touching the shipped controller YAML (S8-B ran the lead {off, on} x gamma
# {0, planned} ablation on it with sibling arms, since pruned).
#
# WHAT T_arm 0.05 CHANGES. T_arm is not only the lead: the validator derives
# the commit window from it, so T_freeze moves with it.
#   T_freeze 0.37 was T_close_lead 0.2805 + h/2 0.001 + T_arm 0.05 + margin
#                   0.03 = 0.3615, rounded up (L3 §4.11 lower bound). With
#                   the lead at 0.302 (E1-F19 part 2, #745) that bound is
#                   0.383 and 0.37 is 13 ms under it: of the 0.03 margin 17 ms
#                   are left. Kept (decided with the lead): the commit instant
#                   of every arm does not move, the validator's own bound
#                   (CheckFreezeCoversClose: T_close_lead + T_arm + h = 0.354)
#                   holds, and no unit showed a close command later than
#                   2.3 ms. The design bound is not a configure requirement.
#                   What does move: the grid search's commit-lead RANK gate
#                   (kRankCommitLead) uses the same sum, so a candidate
#                   0.370 – 0.383 s ahead — inside the window, whose lower
#                   end is T_freeze — now carries that penalty bit. With
#                   the lead at 0.2805 the sum was under the window and
#                   the bit never set. A penalty, not a refusal: it
#                   reaches the ranking of every grid arm.
#                   Startup log: "commit at t_c − 0.370 s".
#   io.horizon_min 0.51 / io.n_min 12 are already the shipped values: they were
#                   derived with T_arm 0.05 (see the shipped file's comments).
# (The pruned lead-off arms kept T_arm 0.05 and T_freeze 0.37 and set only
# `lead_enable: false` — the validator reads T_arm, the RT path and the planner
# use 0 when lead is off, so lead was the ONLY difference between the arms.)
#
# THE PATH IS THE TRAP. The controller config is not a ROS parameter tree:
# `ApplyControllerParamOverrides` pokes every `demo_catching_controller.*`
# parameter into the YAML it loaded, creating any key that is not there. One
# level short (without `catching:`) is written to a key nothing reads and the
# run is the shipped profile, with no warning. `test_catch_lead_overlays.py`
# pins every leaf below to a key the shipped YAML has.
#
# The sim plant is a choice (#537, 2026-09-24), not the UR5e: nothing measured
# with these overlays predicts the real arm's lead gain (S10 identifies T_arm).

integrated_rt_controller:
  ros__parameters:
    demo_catching_controller:
      catching:
        joint_cmd:
          lag:
            T_arm: 0.05
            lead_enable: true
        planner:
          freeze:
            T_freeze: 0.37
