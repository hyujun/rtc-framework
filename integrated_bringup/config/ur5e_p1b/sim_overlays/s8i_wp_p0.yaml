# sim overlay — dynamic_catching S8-I, arm "P0: shipped wait pose" (#537 5850509543)
#   ros2 launch integrated_bringup sim_ur5e_p1b.launch.py enable_viewer:=false enable_mpc:=true \
#       sim_lanes:=true sim_overlay:=s8i_wp_p0
#
# The baseline of the S8-I wait-pose A/B: S8-F-1's reach-first arm
# (s8f_reach_first.yaml — lead on, T_freeze 0.37, the widened catch box, the
# inverted score weights) under the D-S8-18 defaults (a_max 30, ω 10, the
# planner box = the executed envelope from sim.yaml), with `planner.wait_pose`
# pinned to the SHIPPED pose so this cell replays even if the shipped pose
# moves. The three P arms differ in `planner.wait_pose` ONLY
# (test_catch_lead_overlays.py pins the leaves). S8-H showed the wait pose
# fixes v_dir,max — the arm's directional speed toward the ball at the catch
# posture — because the arm barely moves between commit and catch
# (‖p_catch − p_wait‖ p50 0.086 m); this pose gives DLS 2.38 m/s along its own
# inbound direction (catching_wait_pose_search --evaluate-pose).
integrated_rt_controller:
  ros__parameters:
    demo_catching_controller:
      catching:
        joint_cmd:
          lag:
            T_arm: 0.05
            lead_enable: true
        planner:
          freeze:
            T_freeze: 0.37
          score:
            w_t: 5.0
            w_gamma: 1.0
          workspace:
            catch_box:
              min: [-1.1, -1.1, 0.15]
              max: [1.1, 1.1, 1.2]
          wait_pose: [0.212, -1.376, 1.107, -1.978, -3.296, 0.121]
