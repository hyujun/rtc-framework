# sim overlay — dynamic_catching S8-F-1, arm "reach first · beanbag" (#537, 2026-09-26)
#
#   ros2 launch integrated_bringup sim_ur5e_p1b.launch.py enable_mpc:=true \
#       sim_lanes:=true sim_overlay:=s8f_reach_first_beanbag
#
# s8f_reach_first.yaml (that header owns the box and score rationale) catching
# the rtc_mujoco_sim `beanbag` preset — the S8-F speed-cliff contrast arm only
# (56 throws at r 0). catch_lead_on_beanbag.yaml's header owns what the preset
# changes (the whole physics row, not only the bounce — D-S8-11).
#
# ONE FILE, TWO NODES: the simulator section carries ball_type and nothing
# else; the controller section must stay identical to s8f_reach_first.yaml
# (`test_catch_lead_overlays.py` pins both).

mujoco_simulator:
  ros__parameters:
    projectile_ball:
      ball_type: "beanbag"

integrated_rt_controller:
  ros__parameters:
    demo_catching_controller:
      catching:
        joint_cmd:
          lag:
            T_arm: 0.05
            lead_enable: true
        planner:
          freeze:
            T_freeze: 0.37
          score:
            w_t: 5.0
            w_gamma: 1.0
          workspace:
            catch_box:
              min: [-1.1, -1.1, 0.15]
              max: [1.1, 1.1, 1.2]
