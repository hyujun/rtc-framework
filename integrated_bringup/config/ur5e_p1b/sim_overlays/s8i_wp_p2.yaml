# sim overlay — dynamic_catching S8-I, arm "P2: catch-box optimum, axis within 10 deg" (#537 5850509543)
#   ros2 launch integrated_bringup sim_ur5e_p1b.launch.py enable_viewer:=false enable_mpc:=true \
#       sim_lanes:=true sim_overlay:=s8i_wp_p2
#
# `rtc_tools catching_wait_pose_search --box '-1.1 -1.1 0.15 1.1 1.1 1.2'
# --axis-tol-deg 10 --samples 20000 --seed 20260928 --objective dls`: the pose
# anywhere in the S8-F reach box whose approach axis stays within 10° of the
# shipped one and whose DLS v_dir,max along its own inbound direction is the
# largest found: 3.754 m/s (LP 3.754) — a different arm configuration (catch
# frame at (0.330, 0.021, 0.963) m, 0.220 m from the shipped, axis 10.0° off,
# 5 DLS artefacts dropped). Barely above P1: the lever is the elbow/wrist
# configuration, not the position or the tilt.
# Same S8-F-1 reach-first arm as s8i_wp_p0.yaml under the D-S8-18 defaults; the
# three P arms differ in `planner.wait_pose` ONLY (test_catch_lead_overlays.py
# pins the leaves). Sim only — a real-arm wait pose needs a collision and safety
# check this search does not do (kinematic model only, no IK-acceptance check).
integrated_rt_controller:
  ros__parameters:
    demo_catching_controller:
      catching:
        joint_cmd:
          lag:
            T_arm: 0.05
            lead_enable: true
        planner:
          freeze:
            T_freeze: 0.37
          score:
            w_t: 5.0
            w_gamma: 1.0
          workspace:
            catch_box:
              min: [-1.1, -1.1, 0.15]
              max: [1.1, 1.1, 1.2]
          wait_pose: [0.312, -1.4406, 0.7998, -1.834, -3.4693, 0.0261]
