# sim overlay — dynamic_catching S8-I, arm "P1: redundancy-only optimum, orientation kept" (#537 5850509543)
#   ros2 launch integrated_bringup sim_ur5e_p1b.launch.py enable_viewer:=false enable_mpc:=true \
#       sim_lanes:=true sim_overlay:=s8i_wp_p1
#
# `rtc_tools catching_wait_pose_search --radius-m 0.15 --axis-tol-deg 2 --samples
# 20000 --seed 20260928 --objective dls`: the pose within 0.15 m of the shipped
# catch-frame position whose approach axis stays within 2° of the shipped one
# (so the hand-near throws keep their geometry) and whose directional speed
# limit along its OWN inbound direction — v_dir,max, the DLS value the planner's
# γ window uses (L3 §4.5) — is the largest found: 3.748 m/s (LP 3.748) against
# the shipped pose's 2.381 (LP 2.503), 1.57x, by elbow/wrist re-configuration
# alone. Catch frame at (0.546, -0.043, 0.889) m, 0.120 m from the shipped
# (0.478, 0.000, 0.801); max |Δq| 0.89 rad. S8-H: v_dir,max at the catch
# posture is what limits catches (≤ 1.5 m/s → 0 %, 2.5–3.0 → 20 %), and the
# arm barely moves between commit and catch, so the wait pose sets it.
# Same S8-F-1 reach-first arm as s8i_wp_p0.yaml under the D-S8-18 defaults; the
# three P arms differ in `planner.wait_pose` ONLY (test_catch_lead_overlays.py
# pins the leaves). Sim only — a real-arm wait pose needs a collision and safety
# check this search does not do (kinematic model only, no IK-acceptance check).
integrated_rt_controller:
  ros__parameters:
    demo_catching_controller:
      catching:
        joint_cmd:
          lag:
            T_arm: 0.05
            lead_enable: true
        planner:
          freeze:
            T_freeze: 0.37
          score:
            w_t: 5.0
            w_gamma: 1.0
          workspace:
            catch_box:
              min: [-1.1, -1.1, 0.15]
              max: [1.1, 1.1, 1.2]
          wait_pose: [0.113, -0.9705, 0.2215, -1.5275, -3.25, 0.1142]
