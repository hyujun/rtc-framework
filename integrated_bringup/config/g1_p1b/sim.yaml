# g1_p1b/sim.yaml — MuJoCo-simulation delta (overlaid on _base.yaml)
# Used by sim_g1_p1b.launch.py. Loaded AFTER _base.yaml, which holds the
# mode-agnostic config (model topology, joint & sensor rosters, limits,
# control_rate, logging). This file owns only what a simulation run adds:
# MuJoCo backends + sim topics, sim-time sync, relaxed E-STOP/timeouts, and the
# startup controller.
/**:
  ros__parameters:
    # ── Initial controller ────────────────────────────────────────────────────
    # This profile ships a config for two controllers, demo_joint_controller
    # (the default) and demo_dualarm_controller (switch to it at runtime or set
    # initial_controller). The arm-chain controllers (task / wbc / compliance)
    # assume one serial arm and are not instantiated here.
    initial_controller: "demo_joint_controller"

    # ── Initialization timeout ────────────────────────────────────────────────
    init_timeout_sec: 0.0 # s. 0 = disabled (no real hardware init in sim)

    # ── Simulation sync ──────────────────────────────────────────────────────
    use_sim_time_sync: true       # CV-based wakeup (sim); false = clock_nanosleep (real)
    sim_sync_timeout_sec: 5.0     # s. Shut down if no state arrives within this

    # ── E-STOP configuration (relaxed for simulation) ────────────────────────
    enable_estop: false # Disabled for simulation
    device_timeout_values: [10000.0, 10000.0] # ms, device_timeout_names order — relaxed for sim startup

    # ── Device backends (MuJoCo bridge) ───────────────────────────────────────
    # Two robot groups in the sim, one per device, and the sim waits for a
    # command from BOTH every step — so both must be claimed by the active
    # controller, which demo_joint_controller and demo_dualarm_controller do.
    devices:
      g1:
        backend:
          type: "mujoco_native"
          state_topic: "/g1/joint_states"
          command_topic: "/g1/joint_command"
      p1b:
        backend:
          type: "mujoco_native"            # no motor lane in sim
          state_topic: "/p1b/joint_states"
          command_topic: "/p1b/joint_command"
          # ── Fingertip wrench lane ────────────────────────────────────────
          # List order = inference_enable[f] index = sensor-lane slot f, and it
          # MUST be thumb → index → middle → ring: slot f is paired
          # POSITIONALLY with fingertip frame f (_base.yaml tree_models.p1b
          # tip_links). Reordering silently mis-pairs forces with fingers.
          #
          # The backend packs fx/fy/fz into inference slots 1..3 (stride 7).
          # Sign: link-on-environment, the same as the real hand's firmware.
          fingertip_wrench_topics:
            - "/p1b/l_thumb_tip_contact/contact_wrench"
            - "/p1b/l_index_tip_contact/contact_wrench"
            - "/p1b/l_middle_tip_contact/contact_wrench"
            - "/p1b/l_ring_tip_contact/contact_wrench"
          # Consecutive missed RT ticks before inference_enable[f] goes false.
          # 500 Hz × 5 = 10 ms freshness budget.
          max_consecutive_missed_ticks: 5
        # The mujoco backend synthesizes neither a contact probability nor a
        # displacement vector; controllers derive contact from |force|.
        sensor_layout:
          has_native_contact:  false
          has_native_displacement: false
