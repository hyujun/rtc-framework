# locomotion_controller — the humanoid whole-body locomotion controller (b7_loco)
#
# Registered (integrated_bringup controllers/locomotion_controller.hpp): every
# profile that ships this file runs it, so this file must configure. It is not
# the initial controller — the operator switches to it from demo_joint_controller
# (/rtc_cm/switch_controller) once the robot stands. The model lives outside
# this repository, so no in-repo test configures this profile; its fragments
# are held to g1_loco's schema by the same loaders.
#
# What each part of the controller is configured with lives in a fragment under
# locomotion/ (rtc_controller_manager README, `include:`):
#   locomotion/model.yaml         which frames and device groups it works on (model.*)
#   locomotion/runtime.yaml       gains, fault, state source, topics, logs
#   locomotion/whole_body_qp.yaml the whole-body QP it solves each tick (whole_body_qp.*)
# The planner's sections (command, gait, swing, reference, mpc) join with the
# planner.
include:
  - locomotion/model.yaml
  - locomotion/runtime.yaml
  - locomotion/whole_body_qp.yaml
locomotion_controller: {}
