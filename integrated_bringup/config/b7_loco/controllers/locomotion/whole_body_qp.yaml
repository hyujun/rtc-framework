# locomotion_controller — whole_body_qp.* (b7_loco)
#
# A fragment of ../locomotion_controller.yaml (its `include:` list). The
# whole-body QP the controller solves each tick: schema, units and checks in
# rtc_tsid locomotion/locomotion_formulation.hpp (LocomotionFormulationBuilder —
# an unknown key is refused). The contact set and the torso frame are model.*'s;
# this file only parameterises them (contact_overrides.<contact name> per foot).
#
# Values are g1_loco's (but for solver.max_iter / max_iter_in, which are
# ProxQP-sized here), provisional for this profile: every foot task works
# while its contact is released (swing), the torso task holds the orientation
# only, the force task pulls λ toward the reference's. The sole patch is the
# g1 sole's until this profile's foot is measured.
#
# solver.warm_start / constraints.contact.inactive_lambda: each solve starts
# from the previous result with ProxQP's proximal step reset (from the
# equality-constrained solution after a miss), and a released foot's force is
# pinned to zero in the QP itself. With the library default (the previous
# result and its proximal step, regularised released forces) this QP misses on
# a few percent of the ticks of a gait, in chains, and can return SOLVED at a
# non-optimal point on a support change. A miss is still bounded by
# max_iter × max_iter_in inner iterations, not by the control period.
locomotion_controller:
  whole_body_qp:
    formulation_type: wqp
    solver:
      eps_abs: 1.0e-6
      max_iter: 200
      max_iter_in: 500
      dense_backend: PrimalDualLDLT
      warm_start: previous_result_reset_mu
    contact:
      friction_coeff: 0.4
      friction_faces: 4
      patch_half_length_x: 0.09        # [m] sole half length
      patch_half_length_y: 0.03        # [m] sole half width
      torsional_friction_coeff: 0.0
      t_ramp: 0.0                      # [s] force ramp on a support change
    tasks:
      posture: {kp: 50.0, kd: 10.0, weight: 1.0}
      feet:                            # [lin; ang], world axes
        kp: [400, 400, 400, 400, 400, 400]
        kd: [40, 40, 40, 40, 40, 40]
        weight: 100.0
      torso:
        kp: [0, 0, 0, 80, 80, 80]
        kd: [0, 0, 0, 20, 20, 20]
        mask: [0, 0, 0, 1, 1, 1]
        weight: 10.0
      force: {weight: 1.0e-3}
      # The CoM over its reference in the horizontal plane (the height is the
      # posture's). Without it nothing holds the base's horizontal position
      # against the plant: on the sim the stance rocked from foot to foot at
      # ~5.6 Hz and the feet slid ~0.1 m in 10 s.
      com: {kp: [50, 50, 0], kd: [14, 14, 0], weight: 10.0}
    constraints:
      eom: {}
      contact:                         # Baumgarte on the stance feet, [lin; ang]
        baumgarte: {kp: [0, 0, 100, 80, 80, 80], kd: [20, 20, 10, 20, 20, 20]}
        inactive_lambda: zero
      friction_cone: {}
      joint_limit: {position_margin: 0.05, velocity_margin: 0.1}
      torque_limit: {tau_scale: 1.0}
    # Solve health: a run of more than 5 ticks without a valid torque (or with
    # the margins below their floors) is a Fault and latches the controller;
    # 50 good ticks in a row return Degraded to Nominal.
    health:
      max_invalid_ticks: 5
      recover_valid_ticks: 50
