# locomotion_controller — model.* (b7_loco)
#
# A fragment of ../locomotion_controller.yaml (its `include:` list). The CM merges
# it into that file's tree; every key keeps its full path. Schema and checks:
# integrated_bringup controllers/locomotion/humanoid_model_config.hpp — every key
# is required, an unknown key is refused.
#
# Frames are of the CM model (_base.yaml urdf: — the hand_description package,
# not in this repository, so no in-repo test opens this file against its model;
# the configure-time checks do). Three roles, kept apart (WD-35):
#   contacts       carry the load — the soles: the toe links are the foot soles
#                  of this model (WD-9)
#   end_effectors  the arm ends manipulation will move — the two palm links the
#                  hands are mounted on (as in _base.yaml's tree model b7)
#   torso_frame    what the torso tracking task follows
locomotion_controller:
  model:
    # Device group of the body: its tree model and its joint_state_names (which
    # must be the model's joint order — checked at configure).
    body_group: "b7"
    # universe: the only base a floating model accepts (WD-19). The CM model's root
    # floats (W1-F04); universe is valid on a fixed root too.
    base_frame: "universe"
    torso_frame: "torso_link"
    # Order = index, {left, right}. At most 2.
    end_effectors:
      - {name: "left_hand", frame: "left_hand_palm"}
      - {name: "right_hand", frame: "right_hand_palm"}
    # Order = rtc_mpc contact index. dim: 6 = surface (wrench), 3 = point (force).
    contacts:
      - {name: "left_foot", frame: "left_toe_link", dim: 6}
      - {name: "right_foot", frame: "right_toe_link", dim: 6}
    # Hand device groups held at their hold pose while walking (WD-12); [] = no hand.
    hand_groups: ["p2_right", "p2_left"]
