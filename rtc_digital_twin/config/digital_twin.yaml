# digital_twin.yaml — Generalized Digital Twin configuration
#
# Subscribes to one or more JointState topics (RELIABLE, depth 10),
# merges them, and publishes a combined JointState for robot_state_publisher.
# Validates received joints against URDF (excluding fixed/mimic joints).
#
# ARCH-1: rtc_* stays robot-agnostic. This file ships robot-agnostic defaults
# only — robot identity (URDF package/path, source topics, sensor topics,
# fingertip names, TCP source) lives in <robot>_bringup yaml, e.g.
# `integrated_bringup/config/ur5e_hand/digital_twin.yaml`. Pass it via the launch
# `config_file:=...` argument or layer it on top of this default.

/**:
  ros__parameters:
    # ── Robot description ──────────────────────────────────────────────
    # Robot bringup yaml must populate ONE of:
    #   * robot_description_package + robot_description_path  (ament-share path)
    #   * robot_description_file                              (absolute path)
    # The launch file raises a friendly error if neither is provided.
    robot_description_package: ""               # e.g. "robot_descriptions"
    robot_description_path: ""                  # e.g. "robots/ur5e/urdf/ur5e_with_hand.urdf.xacro"
    robot_description_file: ""                  # e.g. "/path/to/robot.urdf"

    display_rate: 60.0                          # Hz — combined JointState publish rate
    output_topic: "/digital_twin/joint_states"  # Combined output for robot_state_publisher
    auto_compute_mimic: true                    # Auto-compute mimic joint positions from URDF

    # ── Extended-URDF closed-chain visualization (opt-in) ────────────────
    # Loop-closed hands only (e.g. linkage fingers). When set to the sidecar
    # `<stem>.closure.yaml` (pkg-share relative to robot_description_package),
    # the launch adds a closure_state_publisher (rtc_urdf_bridge) that fixes
    # measured actuated q and solves passive loop joints so RViz renders the
    # closed chain. digital_twin then forwards actuated joints to that solver.
    # Empty = disabled (digital_twin publishes /digital_twin/joint_states
    # directly). Mimic-coupled hands (e.g. LEAP) leave this empty. ARCH-1:
    # set the concrete path in the <robot>_bringup yaml, not here.
    closure_path: ""                            # e.g. "robots/<robot>/urdf/<hand>.closure.yaml"

    # ── Joint state sources ──────────────────────────────────────────────
    # Robot bringup yaml supplies the per-source topic + joint_names. Defaults
    # below produce zero sources (num_sources: 0); standalone-launch users
    # must override.
    num_sources: 0

    # Example: two sources (uncomment + customize for arm + hand pair):
    # num_sources: 2
    # source_0.topic: "/rtc_cm/<robot>/joint_states"
    # source_0.joint_names: [""]                # empty = accept all joints
    # source_1.topic: "/rtc_cm/<hand>/joint_states"
    # source_1.joint_names: [""]
    #
    # Concrete UR5e + 10-DOF hand example (see integrated_bringup/config/
    # ur5e_hand/digital_twin.yaml for the production version):
    # source_0.joint_names:
    #   - "shoulder_pan_joint"
    #   - "shoulder_lift_joint"
    #   - "elbow_joint"
    #   - "wrist_1_joint"
    #   - "wrist_2_joint"
    #   - "wrist_3_joint"

    # ── Joint State Publisher GUI (optional) ────────────────────────────
    joint_gui.enabled: false                    # true = launch GUI node
    joint_gui.output_topic: "/joint_gui/joint_states"   # JointState output topic
    joint_gui.publish_rate: 10.0                # Hz — GUI publish rate

    # ── Sensor visualization ────────────────────────────────────────────
    # Robot bringup yaml provides the sensor topic + fingertip names.
    sensor_viz.sensor_topic: ""                            # e.g. "/<hand>/sensor_states/monitor"
    sensor_viz.marker_topic: "/digital_twin/fingertip_markers"
    # Each name is used verbatim as the marker frame_id (and marker-ns prefix),
    # so it must match a fingertip link in the robot's URDF.
    sensor_viz.fingertip_names: []                         # e.g. ["index_tip_link","thumb_tip_link"]

    # Barometer: +Z Arrow markers (2×4 grid, 1mm spacing)
    sensor_viz.barometer_min: 0.0
    sensor_viz.barometer_max: 1000.0
    sensor_viz.barometer_arrow_max_length: 0.015    # max arrow length (m)
    sensor_viz.barometer_arrow_scale: 0.0008        # arrow shaft diameter (m)

    # ToF: +Z Arrow markers (disabled by default)
    sensor_viz.tof_enabled: false
    sensor_viz.tof_max_distance: 0.2
    sensor_viz.tof_arrow_scale: 0.003

    # Force (F): 3D Arrow marker
    sensor_viz.force_arrow_scale: 0.01              # length per Newton (m/N)
    sensor_viz.force_arrow_shaft: 0.003             # shaft diameter (m)

    # Displacement (u): 3D Arrow marker
    sensor_viz.displacement_arrow_scale: 0.05       # length per unit (m)
    sensor_viz.displacement_arrow_shaft: 0.002      # shaft diameter (m)

    # Contact: Sphere overlay at fingertip origin
    sensor_viz.contact_sphere_radius: 0.005         # sphere radius (m)

    # Force-magnitude fallback gate (N). 0 = contact_flag gate only (F/u arrows
    # show only when the classifier reports contact). Robots without a contact
    # classifier (contact_flag ≡ 0, e.g. proto_1b) set this > 0 in the bringup
    # yaml so the F arrow renders on |F| ≥ threshold. ARCH-1: concrete value in
    # <robot>_bringup yaml, not here.
    sensor_viz.force_display_threshold: 0.0

    # ── Controller TF re-broadcast (active-controller → /tf) ─────────────
    # The active controller broadcasts its FK `_actual` frames on
    # `<config_key>/transforms` (tf2_msgs/TFMessage), NOT on /tf. This node
    # follows `/rtc_cm/active_controller_name` and re-publishes the active
    # controller's transforms onto /tf (restamped with this node's clock), so
    # RViz renders the `_actual` axes automatically and the tcp_viz tf2 lookup
    # below resolves. Robot-agnostic: the controller key comes from the topic,
    # never hardcoded (ARCH-1). Disable to get a pure URDF-driven twin.
    controller_tf.rebroadcast_enable: true
    controller_tf.active_controller_topic: "/rtc_cm/active_controller_name"

    # ── TCP visualization ───────────────────────────────────────────────
    # Phase 4: TCP pose는 tf2 (`base → tool0_actual`) 에서 lookup. Active
    # controller의 <config_key>/transforms 는 위 controller_tf 재발행이 /tf 로
    # 올려주므로 (해당 재발행이 켜져 있어야) tcp_viz 의 bare TransformListener
    # 가 그 프레임을 받아 lookup 이 해결된다.
    # tcp_viz.source_topic 은 이제 child frame_id 로 해석된다 (예: "tool0_actual").
    # 빈 문자열 또는 슬래시("/")가 포함되면 기본값 "tool0_actual" 적용.
    tcp_viz.source_topic: ""                        # e.g. "tool0_actual"
    tcp_viz.marker_topic: "/digital_twin/tcp_markers"
    tcp_viz.frame_id: "base"                        # parent TF frame
    tcp_viz.broadcast_tf: true                      # broadcast virtual_tcp TF
    tcp_viz.tf_child_frame: "virtual_tcp"           # TF child frame name

    # TCP sphere (current position)
    tcp_viz.sphere_radius: 0.012                    # sphere radius (m)

    # TCP axes (orientation arrows)
    tcp_viz.axes_length: 0.05                       # axis arrow length (m)
    tcp_viz.axes_shaft: 0.004                       # axis arrow shaft diameter (m)

    # Goal sphere (target position, semi-transparent)
    tcp_viz.show_goal: true
    tcp_viz.goal_sphere_radius: 0.010               # goal sphere radius (m)
