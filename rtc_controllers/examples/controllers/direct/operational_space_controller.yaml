# ── EXAMPLE — reference config for OperationalSpaceController ─────────────────
# Location: rtc_controllers/examples/controllers/direct/ (installed under
#           share/rtc_controllers/examples/). NOT a production YAML.
#
# rtc_controllers ships this as a *reference example* only. The class is not
# auto-registered; downstream <robot>_bringup packages opt in by:
#   1) adding a `RTC_REGISTER_CONTROLLER(operational_space_controller, "direct",
#      "<robot>_bringup", std::make_unique<rtc::OperationalSpaceController>(...))`
#      registration in their controller_registration.cpp, and
#   2) copying this YAML to `<robot>_bringup/config/controllers/direct/` and
#      replacing the placeholder topic group ("<robot>" below) with their own
#      robot identity (matches their CM `devices.<group>` key).
# Keeping ARCH-1 invariant: rtc_* may not host robot-specific production YAML.
# ──────────────────────────────────────────────────────────────────────────────
# Torque OSC (#172): operational-space law outputs joint torque (N·m). The task
# PD is in ACCELERATION form — kp [1/s²], kd [1/s] — so these gains differ in
# meaning/scale from the old velocity-IK controller; retune per robot.
operational_space_controller:
  # ── 데카르트 PD 게인 (가속도형) ────────────────────────────────────────────
  kp_pos: [100.0, 100.0, 100.0]         # 위치 비례 게인 [1/s²] (x, y, z)
  kd_pos: [20.0, 20.0, 20.0]            # 위치 미분 게인 [1/s]  (x, y, z)
  kp_rot: [50.0, 50.0, 50.0]            # 회전 비례 게인 [1/s²] (rx, ry, rz)
  kd_rot: [10.0, 10.0, 10.0]            # 회전 미분 게인 [1/s]  (rx, ry, rz)

  # ── 특이점 감쇠 ───────────────────────────────────────────────────────────
  damping: 0.01                           # Λ⁻¹ 감쇠 λ (max(1e-4, ·) floor 적용)

  # ── 널공간 posture 이차 태스크 (nv>6 여유자유도에서만 유효) ──────────────────
  null_kp: 0.0                            # safe_position 향한 posture 강성 [N·m/rad]
  null_kd: 1.0                            # 널공간 관절 damping [N·m·s/rad]

  # 참고: torque OSC 는 g(q)+C·v 를 항상 보상합니다. enable_gravity_compensation
  # 는 하위 호환용으로 파싱만 되고 무시됩니다.

  # ── 궤적 속도 ────────────────────────────────────────────────────────────
  trajectory_speed: 0.1                   # TCP 최대 병진 속도 (m/s)
  trajectory_angular_speed: 0.5           # TCP 최대 회전 속도 (rad/s)

  # ── 궤적 속도 제한 ────────────────────────────────────────────────────────
  # quintic rest-to-rest 최대 속도 = 15/8 × Δ / T
  max_traj_velocity: 0.5                  # 최대 TCP 병진 속도 [m/s]
  max_traj_angular_velocity: 1.0          # 최대 TCP 회전 속도 [rad/s]

  # ── 출력 타입 (torque 고정 — 다른 값은 LoadConfig 에서 거부) ────────────────
  command_type: "torque"

  # ── 토픽 설정 ─────────────────────────────────────────────────────────────
  # Phase 4: device-wire lanes owned by DeviceBackend impls (see
  # `devices.<robot>.backend:` in your `<robot>_bringup` sim.yaml/robot.yaml).
  # Controller YAML keeps only subscribe role `target` (alias `goal`) and
  # publish role `robot_transforms`. `robot_target` was removed in issue #196
  # Phase 5 and is now a hard parse failure, not a silently ignored entry.
  # All topic entries are controller-owned (issue #138); these `<robot>`
  # configs are templates — replace placeholders before use, they are not
  # loaded at runtime as-is.
  topics:
    <robot>:
      subscribe:
        - topic: "/<robot>/joint_goal"
          role: "target"
