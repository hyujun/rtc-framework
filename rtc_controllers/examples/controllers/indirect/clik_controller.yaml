# ── EXAMPLE — reference config: clik_controller ───────────────────────────────
# Location: rtc_controllers/examples/controllers/indirect/ (installed under
#           share/rtc_controllers/examples/). NOT a production YAML.
#
# rtc_controllers ships this as a *reference example* only — it registers
# nothing. Downstream <robot>_bringup packages opt in by:
#   1) writing their OWN binding class that owns the core and implements
#      RTControllerInterface, then registering THAT:
#        RTC_REGISTER_CONTROLLER(clik_controller, "indirect", "<robot>_bringup",
#                               std::make_unique<MyBinding>(...))
#      in their controller_registration.cpp.
#      코어: `task/task_vel_law.hpp` + `compliance/differential_ik.hpp`
#      스키마: `params/clik_params.hpp`
#      The adapter class this file once named was deleted in #236 S7c —
#      rtc_controllers ships laws, not bindings. Worked example:
#      integrated_bringup/src/controllers/. Procedure:
#      agent_docs/modification-guide.md §Adding a New Controller.
#   2) copying this YAML to `<robot>_bringup/config/controllers/indirect/` and
#      replacing the placeholder topic group ("<robot>" below) with their own
#      robot identity (matches their CM `devices.<group>` key).
# Keeping ARCH-1 invariant: rtc_* may not host robot-specific production YAML.
# ──────────────────────────────────────────────────────────────────────────────
clik_controller:
  # ── CLIK 게인 ─────────────────────────────────────────────────────────────
  kp_translation: [1.0, 1.0, 1.0]   # 병진 비례 게인 (x, y, z) [1/s]
  kp_rotation: [1.0, 1.0, 1.0]      # 회전 비례 게인 (rx, ry, rz) [1/s]
  # ── 특이점 감쇠 (§6.5 σ_min-적응형 DLS — impedance/admittance/cascade 와 동일) ─
  # λ² = 0 (σ_min ≥ σ₀) / λ_max²·(1 − (σ_min/σ₀)²) (σ_min < σ₀).
  # #236 S3b (#258) 이전에는 상수 λ 인 `damping` 키였다 — 그 상수가 아웃라이어였고
  # 여기로 수렴시키는 것이 이관의 목적이다 (특이점에서 멀면 감쇠가 정확히 0).
  max_damping: 0.05                       # λ_max (FloorMaxDamping 으로 1e-4 floor)
  singularity_threshold: 0.02             # σ₀: 이 아래에서 DLS 감쇠가 붙기 시작

  # ── 영공간 (null-space) 설정 ──────────────────────────────────────────────
  enable_null_space: true                 # 영공간 관절 센터링 활성화
  null_kp: 0.5                            # 영공간 비례 게인

  # ── 6-DOF 모드 ────────────────────────────────────────────────────────────
  control_6dof: false                     # false=3-DOF(위치만), true=6-DOF(위치+방향)

  # ── 궤적 속도 ────────────────────────────────────────────────────────────
  trajectory_speed: 0.1                   # TCP 최대 병진 속도 (m/s)
  trajectory_angular_speed: 0.5           # TCP 최대 회전 속도 (rad/s, 6-DOF 모드)

  # ── 궤적 속도 제한 ────────────────────────────────────────────────────────
  # quintic rest-to-rest 최대 속도 = 15/8 × Δ / T
  max_traj_velocity: 0.5                  # 최대 TCP 병진 속도 [m/s]
  max_traj_angular_velocity: 1.0          # 최대 TCP 회전 속도 [rad/s]

  # ── 출력 타입 ─────────────────────────────────────────────────────────────
  command_type: "position"

  # ── 토픽 설정 ─────────────────────────────────────────────────────────────
  # Phase 4: device-wire lanes owned by DeviceBackend impls (see
  # `devices.<robot>.backend:` in your `<robot>_bringup` sim.yaml/robot.yaml).
  # Controller YAML keeps only subscribe role `target` (alias `goal`) and
  # publish role `robot_transforms`. `robot_target` was removed in issue #196
  # Phase 5 and is now a hard parse failure, not a silently ignored entry.
  # All topic entries are controller-owned (issue #138); these `<robot>`
  # configs are templates — replace placeholders before use, they are not
  # loaded at runtime as-is.
  topics:
    <robot>:
      subscribe:
        - topic: "/<robot>/joint_goal"
          role: "target"
