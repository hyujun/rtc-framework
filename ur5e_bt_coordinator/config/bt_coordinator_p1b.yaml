bt_coordinator:
  ros__parameters:

    # ══════════════════════════════════════════════════════════════════════════
    # ur5e_p1b variant — proto_1b hand on the UR5e arm
    # ══════════════════════════════════════════════════════════════════════════
    # 이 파일은 bt_coordinator.yaml 위에 얹는 delta 다 (launch 의 variant:=ur5e_p1b).
    # base 를 먼저 로드하고 여기서 device group 만 교체하므로 bb.* / tick_rate 등
    # 공통 설정은 base 한 곳에서만 관리된다 (drift 방지). poses 는 poses_p1b.yaml
    # 이 poses.yaml 대신 로드된다.

    # ── Robot profile ─────────────────────────────────────────────────────────
    # arm 은 UR5e 그대로 (arm_group/arm_dof 는 base default 유지: ur5e / 6).
    # hand 만 proto_1b 로 교체 → /rtc_cm/p1b/joint_states,
    # <ctrl>/p1b/{joint_goal,grasp_state,wbc_state}. hand_dof 는 10 으로 base 와
    # 동일 (assm_v1·proto_1b 둘 다 10-DoF) 이므로 재선언 불필요.
    hand_group: "p1b"

    # ── Capabilities ──────────────────────────────────────────────────────────
    # proto_1b 는 grasp-force / ToF / shape 센싱을 모두 갖춘다 → base default(all
    # true)와 동일. 명시적으로 재확인만 (position-only variant 는 여기서 false).
    has_grasp_sensing: true
    has_tof: true
    has_shape: true
